<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QC End-Line Inspection — Live Floor Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<style>
  :root{
    --bg:#0F1216;
    --panel:#171B21;
    --panel-2:#1D222A;
    --border:#2A303B;
    --border-soft:#232833;
    --text:#E7EAEE;
    --muted:#8A93A3;
    --muted-2:#5E6675;
    --brand:#2DD4BF;
    --brand-dim:#164E48;
    --rf:#EF4444;
    --rf-dim:#3A1B1B;
    --ga:#F5A524;
    --ga-dim:#3A2A10;
    --gb:#EAD32E;
    --gb-dim:#37331A;
    --gc:#38BDF8;
    --gc-dim:#132A38;
    --gd:#A78BFA;
    --gd-dim:#261F3D;
    --good:#34D399;
    --radius:10px;
    --shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 24px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 90% -10%, rgba(45,212,191,0.06), transparent),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#2A303B;border-radius:8px;}

  #app{max-width:1320px;margin:0 auto;padding:20px 22px 80px;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
    padding-bottom:18px;margin-bottom:18px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:9px;
    background:linear-gradient(155deg,var(--brand),#0EA5A0);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;color:#06201D;font-size:15px;
    box-shadow:0 4px 14px rgba(45,212,191,0.25);
    flex:none;
  }
  .brand h1{font-family:'Space Grotesk';font-size:16.5px;font-weight:600;margin:0;letter-spacing:.2px;}
  .brand .sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .live-dot{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--good);
    font-family:'IBM Plex Mono';border:1px solid #1D4B3D;background:#0E2019;
    padding:4px 9px;border-radius:100px;margin-left:10px;
  }
  .live-dot i{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 1.8s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(52,211,153,.55);}
    70%{box-shadow:0 0 0 7px rgba(52,211,153,0);}
    100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}
  }

  .tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:11px;border:1px solid var(--border-soft);}
  .tab-btn{
    border:none;background:transparent;color:var(--muted);
    font-family:'Inter';font-weight:600;font-size:13px;
    padding:8px 15px;border-radius:8px;cursor:pointer;transition:.15s;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{background:var(--panel-2);color:var(--text);box-shadow:0 0 0 1px var(--border);}

  /* ---------- Panels / cards ---------- */
  .panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);box-shadow:var(--shadow);}
  .panel-pad{padding:18px 20px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .col{flex:1;min-width:0;}

  h2.section-title{font-family:'Space Grotesk';font-size:14px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px;color:var(--text);}
  h2.section-title .tag{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);font-weight:400;background:var(--panel-2);border:1px solid var(--border);padding:2px 7px;border-radius:5px;}

  /* KPI cards */
  .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
  @media (max-width:1000px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;}
  .kpi .k-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  .kpi .k-value{font-family:'Space Grotesk';font-size:26px;font-weight:700;margin-top:6px;}
  .kpi .k-sub{font-size:11px;color:var(--muted-2);margin-top:3px;font-family:'IBM Plex Mono';}
  .kpi .k-bar{position:absolute;left:0;top:0;bottom:0;width:3px;}

  /* Dashboard grid */
  .dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px;}
  @media (max-width:980px){.dash-grid{grid-template-columns:1fr;}}
  .chart-wrap{position:relative;height:260px;}
  .chart-wrap.tall{height:300px;}

  /* Filters */
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  select, input[type=text], input[type=number], input[type=date], textarea{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:7px;padding:7px 10px;font-family:'Inter';font-size:12.5px;outline:none;
  }
  select:focus, input:focus, textarea:focus{border-color:var(--brand);}
  .field-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;display:block;margin-bottom:5px;}

  .dept-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .dept-toggle button{background:var(--panel-2);border:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer;font-family:'Inter';}
  .dept-toggle button.active{background:var(--brand);color:#06201D;}

  /* Empty state */
  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty .big{font-size:34px;margin-bottom:8px;}
  .empty .t1{font-family:'Space Grotesk';font-size:15px;color:var(--text);font-weight:600;margin-bottom:4px;}
  .empty .t2{font-size:12.5px;}
  .btn{
    background:var(--brand);color:#06201D;border:none;border-radius:8px;
    padding:9px 16px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:'Inter';
    transition:.15s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);font-weight:600;}
  .btn.ghost:hover{border-color:var(--brand);}
  .btn.danger{background:transparent;color:#F87171;border:1px solid #4A2323;}
  .btn.small{padding:5px 10px;font-size:11.5px;border-radius:6px;}

  /* ---- Entry form ---- */
  .header-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:900px){.header-grid{grid-template-columns:repeat(2,1fr);}}
  .header-grid .f{display:flex;flex-direction:column;}
  .header-grid input, .header-grid select{width:100%;}

  .shift-strip{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;}
  .shift-chip{
    font-family:'IBM Plex Mono';font-size:11.5px;padding:8px 10px;border-radius:8px;
    border:1px dashed var(--border);color:var(--muted);cursor:pointer;min-width:96px;text-align:center;position:relative;
  }
  .shift-chip .sc-hour{font-weight:600;color:var(--text);font-size:12px;}
  .shift-chip .sc-meta{font-size:10px;margin-top:3px;}
  .shift-chip.filled{border-style:solid;border-color:var(--border);background:var(--panel-2);}
  .shift-chip.selected{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);}
  .shift-chip .sc-del{position:absolute;top:3px;right:5px;color:var(--muted-2);font-size:12px;}
  .shift-chip .sc-del:hover{color:#F87171;}

  .defect-groups{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .g-block{border:1px solid var(--border-soft);border-radius:9px;overflow:hidden;}
  .g-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 14px;font-family:'Space Grotesk';font-weight:600;font-size:12.5px;
  }
  .g-body{padding:6px 14px 10px;}
  .d-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border-soft);}
  .d-row:last-child{border-bottom:none;}
  .d-name{flex:1;font-size:12.5px;color:var(--text);}
  .d-inputs{display:flex;gap:8px;align-items:center;}
  .mini-field{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .mini-field label{font-size:9px;color:var(--muted-2);font-family:'IBM Plex Mono';}
  .mini-field input{width:56px;text-align:center;padding:5px 4px;font-family:'IBM Plex Mono';}
  .mini-field.disabled input{opacity:.25;pointer-events:none;}
  .stepper{display:flex;align-items:stretch;}
  .stepper input{width:40px !important;padding:5px 2px !important;border-top-right-radius:0;border-bottom-right-radius:0;}
  .stepper.manual input{border-color:var(--ga);}
  .stepper-arrows{display:flex;flex-direction:column;border:1px solid var(--border);border-left:none;border-radius:0 7px 7px 0;overflow:hidden;}
  .stepper.manual .stepper-arrows{border-color:var(--ga);}
  .step-btn{
    width:16px;height:12px;flex:none;padding:0;line-height:1;
    border:none;background:var(--panel-2);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .step-btn+.step-btn{border-top:1px solid var(--border);}
  .step-btn:hover{background:var(--brand);}
  .step-btn::before{content:'';width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;}
  .step-btn.up::before{border-bottom:5px solid var(--muted);}
  .step-btn.down::before{border-top:5px solid var(--muted);}
  .step-btn:hover::before{border-bottom-color:#06201D;border-top-color:#06201D;}
  .def-reset{color:var(--ga);text-decoration:none;font-size:10px;margin-left:3px;}

  .entry-footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap;}
  .hour-summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
  @media (max-width:700px){.hour-summary-row{grid-template-columns:repeat(2,1fr);}}

  .stat-mini{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;}
  .stat-mini .sl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .stat-mini .sv{font-family:'Space Grotesk';font-size:17px;font-weight:700;margin-top:2px;}

  /* ---- Reports log ---- */
  table.log{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.log th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    padding:9px 10px;border-bottom:1px solid var(--border);font-weight:600;
  }
  table.log td{padding:10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  table.log tr:hover td{background:rgba(255,255,255,0.015);}
  .pill{font-family:'IBM Plex Mono';font-size:10.5px;padding:3px 8px;border-radius:100px;border:1px solid var(--border);}
  .pill.sewing{color:var(--gc);border-color:#164450;background:var(--gc-dim);}
  .pill.finishing{color:var(--gd);border-color:#332a55;background:var(--gd-dim);}
  .dhu-val{font-family:'IBM Plex Mono';font-weight:600;}
  .actions-cell{display:flex;gap:6px;}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(6,8,11,0.7);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:920px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,0.5);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border-soft);}
  .modal-body{padding:18px 20px;max-height:70vh;overflow:auto;}
  .close-x{cursor:pointer;color:var(--muted);font-size:18px;background:none;border:none;}
  .close-x:hover{color:var(--text);}

  .badge-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}

  .toast{
    position:fixed;bottom:20px;right:20px;background:var(--panel-2);border:1px solid var(--border);
    padding:11px 16px;border-radius:9px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);
    display:flex;align-items:center;gap:8px;z-index:100;
  }
  .toast .d{width:7px;height:7px;border-radius:50%;background:var(--good);}

  ::placeholder{color:var(--muted-2);}
  .legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
  .legend-sw{width:9px;height:9px;border-radius:2px;}

  .subtle-note{font-size:11px;color:var(--muted-2);margin-top:8px;line-height:1.5;}

  /* ---- QR / Barcode scan ---- */
  .scan-btn{
    display:inline-flex;align-items:center;gap:7px;background:var(--panel-2);color:var(--text);
    border:1px solid var(--border);border-radius:8px;padding:8px 13px;font-weight:600;font-size:12.5px;
    cursor:pointer;font-family:'Inter';transition:.15s;
  }
  .scan-btn:hover{border-color:var(--brand);color:var(--brand);}
  .scan-modal .modal{max-width:420px;}
  .scan-video-wrap{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:1/1;}
  .scan-video-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
  .scan-frame{position:absolute;inset:14%;border:2px solid var(--brand);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,0.35);pointer-events:none;}
  .scan-status{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center;min-height:16px;}
  .scan-manual{margin-top:14px;border-top:1px solid var(--border-soft);padding-top:12px;}
  .scan-manual textarea{width:100%;min-height:64px;font-family:'IBM Plex Mono';font-size:11.5px;resize:vertical;}

  .bundle-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
  .bundle-chip{
    display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--border);
    border-radius:100px;padding:5px 6px 5px 11px;font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);
  }
  .bundle-chip b{color:var(--text);font-weight:600;}
  .bundle-chip .bc-del{cursor:pointer;color:var(--muted-2);border:none;background:var(--panel);border-radius:50%;width:16px;height:16px;line-height:14px;text-align:center;font-size:11px;}
  .bundle-chip .bc-del:hover{color:#F87171;}
  .bundle-ref{font-size:11px;color:var(--muted-2);font-family:'IBM Plex Mono';margin-top:6px;}

  .auto-tag{font-family:'IBM Plex Mono';font-size:9px;font-weight:400;color:var(--brand);text-transform:none;letter-spacing:0;margin-left:6px;}
  .auto-tag.manual{color:var(--ga);}
  .group-badges{display:flex;gap:6px;flex-wrap:wrap;}
  .group-badge{
    font-family:'IBM Plex Mono';font-size:10.5px;padding:4px 9px;border-radius:100px;
    border:1px solid var(--border);background:var(--panel-2);opacity:.6;
  }
  .group-badge.active{opacity:1;box-shadow:0 0 0 1px currentColor inset;}
</style>
</head>
<body>
<div id="tc-guard-bar" style="background:#1B211D;color:#F1F0EA;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.04em;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9999">
  <a href="dashboard.html" style="color:#F1F0EA;text-decoration:none">&larr; Back to Dashboard</a>
  <span>TAHER CONSULTING &middot; QC Inspection</span>
  <span id="tc-guard-user" style="color:#A9832F"></span>
</div>
<script>
(function(){
  var raw = localStorage.getItem("tc_session") || sessionStorage.getItem("tc_session");
  if (!raw) {
    window.location.href = "login.html";
  } else {
    try {
      var s = JSON.parse(raw);
      document.addEventListener("DOMContentLoaded", function(){
        var el = document.getElementById("tc-guard-user");
        if (el) el.textContent = s.name || "";
      });
    } catch(e) {}
  }
})();
</script>

<div id="app"></div>

<script>
/* ============================= DATA MODEL ============================= */
const DEFECT_SCHEMA = [
  {key:'label', name:'Label Mistake', group:'RF'},
  {key:'style', name:'Style Mistake', group:'RF'},
  {key:'component', name:'Missing / Wrong Component (Label/Bow/Button/Emb/Print/Bartack/Heat Seal)', group:'RF'},
  {key:'position', name:'Wrong Position / Placement', group:'RF'},
  {key:'otherCritical', name:'Other Critical Defects', group:'RF'},

  {key:'missingYarn', name:'Missing Yarn', group:'A'},
  {key:'brokenStitch', name:'Broken Stitch', group:'A'},
  {key:'skipStitch', name:'Skip Stitch', group:'A'},
  {key:'openSeam', name:'Open Seam', group:'A'},
  {key:'hole', name:'Hole', group:'A'},
  {key:'needleHole', name:'Needle Hole / Scissor Cut / Damage', group:'A'},
  {key:'printEmb', name:'Print / Embroidery / Heat Seal Defect', group:'A'},

  {key:'oilStain', name:'Oil Stain', group:'B', hasMinor:true},
  {key:'stain', name:'Stain / Dirty / Pen Mark / Chalk Mark', group:'B', hasMinor:true},

  {key:'ootPlus', name:'Measurement OOT (+)', group:'C'},
  {key:'ootMinus', name:'Measurement OOT (-)', group:'C'},

  {key:'fabricFault', name:'Fabric Fault', group:'D', hasMinor:true},
  {key:'puckering', name:'Puckering / Shearing / Pleat / Roping / Wavy', group:'D', hasMinor:true},
  {key:'rawedge', name:'Rawedge / Down Stitch', group:'D', hasMinor:true},
  {key:'looseStitch', name:'Loose Stitch / Bad Tension', group:'D', hasMinor:true},
  {key:'jointOut', name:'Joint Out / Poor Join', group:'D', hasMinor:true},
  {key:'uncutThread', name:'Uncut Thread', group:'D', hasMinor:true},
  {key:'imbalance', name:'Imbalance / 4-Point Up & Down / Uneven', group:'D', hasMinor:true},
  {key:'poorAppearance', name:'Poor Appearance / Off Shape / Poor Ironing / Loose Thread', group:'D', hasMinor:true},
  {key:'shadeVariation', name:'Shade Variation', group:'D', hasMinor:true},
  {key:'othersDefect', name:'Others Defect', group:'D', hasMinor:true},
];
const GROUP_META = {
  RF:{label:'Red Flag · Critical Defects', color:'var(--rf)', hex:'#EF4444', dim:'var(--rf-dim)'},
  A:{label:'Group A · Stitch & Sewing', color:'var(--ga)', hex:'#F5A524', dim:'var(--ga-dim)'},
  B:{label:'Group B · Stain / Oil', color:'var(--gb)', hex:'#EAD32E', dim:'var(--gb-dim)'},
  C:{label:'Group C · Measurement', color:'var(--gc)', hex:'#38BDF8', dim:'var(--gc-dim)'},
  D:{label:'Group D · Finish & Appearance', color:'var(--gd)', hex:'#A78BFA', dim:'var(--gd-dim)'},
};
function ordinal(n){
  const s=["th","st","nd","rd"], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}
const SHIFT_LABELS = Array.from({length:15}, (_,i)=> ordinal(i+1));
const SBU_LIST = ['SBU-01','SBU-02','SBU-03','SBU-04','SBU-05'];
function pad2(n){ return n<10? '0'+n : ''+n; }
function linesForSBU(sbuLabel){
  // 'SBU-01' -> lines 101A,101B,102A,...,109A,109B
  const num = parseInt((sbuLabel||'SBU-01').replace(/\D/g,''),10) || 1;
  const out = [];
  for(let i=1;i<=9;i++){
    out.push(`${num}${pad2(i)}A`);
    out.push(`${num}${pad2(i)}B`);
  }
  return out;
}
function lineOptionsFor(sbuLabel){
  // Finishing/off-line inspections often aren't tied to one sewing line — N/A is always offered
  return [...linesForSBU(sbuLabel), 'N/A'];
}

/* ============================= STATE ============================= */
let state = {
  reports: [],
  storageReady: false,
  tab: 'dashboard',
  dashDept: 'All',
  dashRange: '30',
  dashBuyer: 'All',
  dashLine: 'All',
  entryDept: 'Sewing',
  header: emptyHeader(),
  entryStep: 'header',   // 'header' -> fill report header, then Next -> 'hours'
  hours: [],             // completed hours for the report currently being built: {shift, bundles:[...]}
  hourWork: {},           // in-progress bundles per shift, keyed by shift label, before the hour is completed
  selectedShift: null,
  selectedDefectGroup: 'RF',
  bundleDraft: emptyBundleDraft(),
  viewingReportId: null,
  toast: null,
  scan: { open:false, status:'Point the camera at the bundle card QR code', manualText:'' },
};

function emptyHeader(){

/* ============================= COMPUTATION ============================= */
function bundleTotals(b){
  const groupTotals = {RF:0,A:0,B:0,C:0,D:0};
  let criticalCount = 0, majorCount = 0, minorCount = 0, defectivePieces = 0;
  DEFECT_SCHEMA.forEach(d=>{
    const v = (b.values && b.values[d.key]) || {cri:0,maj:0,min:0,defective:0};
    const cri = Number(v.cri)||0, maj = Number(v.maj)||0, min = Number(v.min)||0;
    groupTotals[d.group] += cri+maj+min;
    criticalCount += cri; majorCount += maj; minorCount += min;
    defectivePieces += Number(v.defective)||0;
  });
  const totalDefects = criticalCount + majorCount + minorCount;
  const qty = Number(b.qty)||0;
  const defective = Number(b.defectiveQty)||0;
  const repaired = Number(b.repairedQty)||0;
  const rejected = Number(b.rejectionQty)||0;
  const passed = Math.max(qty - rejected, 0);
  const pctDefective = qty>0 ? (defective/qty*100) : 0;
  const dhu = qty>0 ? (totalDefects/qty*100) : 0;
  return {groupTotals, totalDefects, criticalCount, majorCount, minorCount, defectivePieces, qty, defective, repaired, rejected, passed, pctDefective, dhu};
}
function hourTotals(hourEntry){
  const bundles = (hourEntry && hourEntry.bundles) || [];
  const groupTotals = {RF:0,A:0,B:0,C:0,D:0};
  let inspected=0, defective=0, repaired=0, rejected=0, totalDefects=0, criticalCount=0, majorCount=0, minorCount=0;
  bundles.forEach(b=>{
    const t = bundleTotals(b);
    inspected += t.qty; defective += t.defective; repaired += t.repaired; rejected += t.rejected;
    totalDefects += t.totalDefects; criticalCount += t.criticalCount; majorCount += t.majorCount; minorCount += t.minorCount;
    Object.keys(groupTotals).forEach(g=> groupTotals[g]+=t.groupTotals[g]);
  });
  const passed = Math.max(inspected - rejected, 0);
  const pctDefective = inspected>0 ? (defective/inspected*100) : 0;
  const dhu = inspected>0 ? (totalDefects/inspected*100) : 0;
  return {groupTotals, totalDefects, criticalCount, majorCount, minorCount, inspected, defective, repaired, rejected, passed, pctDefective, dhu, bundleCount:bundles.length};
}
function reportTotals(report){
  let inspected=0, defective=0, repaired=0, rejected=0, totalDefects=0, criticalCount=0, majorCount=0, minorCount=0;
  const groupTotals = {RF:0,A:0,B:0,C:0,D:0};
  const byDefect = {};
  DEFECT_SCHEMA.forEach(d=> byDefect[d.key]=0);
  report.hours.forEach(h=>{
    const t = hourTotals(h);
    inspected += t.inspected;
    defective += t.defective;
    repaired += t.repaired;
    rejected += t.rejected;
    totalDefects += t.totalDefects;
    criticalCount += t.criticalCount;
    majorCount += t.majorCount;
    minorCount += t.minorCount;
    Object.keys(groupTotals).forEach(g=> groupTotals[g]+=t.groupTotals[g]);
    (h.bundles||[]).forEach(b=>{
      DEFECT_SCHEMA.forEach(d=>{
        const v = (b.values && b.values[d.key]) || {cri:0,maj:0,min:0};
        byDefect[d.key]+= (Number(v.cri)||0)+(Number(v.maj)||0)+(Number(v.min)||0);
      });
    });
  });
  const passed = Math.max(inspected-rejected,0);
  const pctDefective = inspected>0 ? (defective/inspected*100) : 0;
  const dhu = inspected>0 ? (totalDefects/inspected*100) : 0;
  return {inspected, defective, repaired, rejected, passed, totalDefects, criticalCount, majorCount, minorCount, pctDefective, dhu, groupTotals, byDefect};
}

function filteredReports(){
  let list = state.reports.slice();
  if(state.dashDept !== 'All') list = list.filter(r=>r.dept===state.dashDept);
  if(state.dashBuyer !== 'All') list = list.filter(r=>(r.header.buyer||'—')===state.dashBuyer);
  if(state.dashLine !== 'All') list = list.filter(r=>(r.header.lineNo||'—')===state.dashLine);
  if(state.dashRange !== 'all'){
    const days = Number(state.dashRange);
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
    list = list.filter(r=> new Date(r.header.date) >= cutoff);
  }
  return list.sort((a,b)=> new Date(a.header.date)-new Date(b.header.date));
}
function distinctValues(field){
  const set = new Set();
  state.reports.forEach(r=> set.add((r.header[field]||'—')));
  return Array.from(set).sort();
}

function captureFocusState(app){
  const el = document.activeElement;
  if(!el || !app.contains(el)) return null;
  const attrs = ['data-bf','data-defect','data-sev','data-h','data-group-select','data-shift-select','data-dir','id'];
  const parts = [el.tagName.toLowerCase()];
  attrs.forEach(a=>{
    if(el.hasAttribute && el.hasAttribute(a)) parts.push(`[${a}="${(el.getAttribute(a)||'').replace(/"/g,'\\"')}"]`);
  });
  return { selector: parts.join(''), start: el.selectionStart, end: el.selectionEnd };
}
function restoreFocusState(info){
  if(!info) return;
  const el = document.querySelector(info.selector);
  if(!el) return;
  el.focus({preventScroll:true});
  if(typeof info.start === 'number' && el.setSelectionRange){
    try{ el.setSelectionRange(info.start, info.end); }catch(e){}
  }
}
function render(){
  const app = document.getElementById('app');
  const scrollY = window.scrollY;
  const focusInfo = captureFocusState(app);
  app.innerHTML = `
    ${renderTopbar()}
    ${state.tab==='dashboard' ? renderDashboard() : ''}
    ${state.tab==='entry' ? renderEntry() : ''}
    ${state.tab==='log' ? renderLog() : ''}
    ${state.viewingReportId ? renderReportModal() : ''}
    ${state.scan.open ? renderScanModal() : ''}
    ${state.toast ? `<div class="toast"><span class="d"></span>${esc(state.toast)}</div>` : ''}
  `;
  bindEvents();
  if(state.tab==='dashboard') drawDashboardCharts();
  if(state.scan.open) startScanCamera();
  restoreFocusState(focusInfo);
  window.scrollTo(0, scrollY);
}

function renderGroupAnalysisTable(reports){
  const gt = {RF:0,A:0,B:0,C:0,D:0};
  let inspected = 0;
  reports.forEach(r=>{ const rt=reportTotals(r); inspected += rt.inspected; Object.keys(gt).forEach(g=> gt[g]+=rt.groupTotals[g]); });
  const rowsHtml = Object.keys(gt).map(g=>{
    const dhu = inspected>0 ? gt[g]/inspected*100 : 0;
    return `<tr>
      <td><span class="badge-dot" style="background:${GROUP_META[g].hex}"></span>${GROUP_META[g].label}</td>
      <td class="mono">${gt[g]}</td>
      <td class="mono">${fmt1(dhu)}%</td>
    </tr>`;
  }).join('');
  return `<table class="log"><thead><tr><th>Group</th><th>Defect Qty</th><th>DHU %</th></tr></thead>
  <tbody>${rowsHtml}<tr><td><b>Total (Check Qty)</b></td><td class="mono"><b>${inspected}</b></td><td></td></tr></tbody></table>`;
}

function renderTop5Table(reports){
  const byDefect = {}; DEFECT_SCHEMA.forEach(d=> byDefect[d.key]=0);
  let inspected = 0;
  reports.forEach(r=>{ const rt=reportTotals(r); inspected += rt.inspected; DEFECT_SCHEMA.forEach(d=> byDefect[d.key]+=rt.byDefect[d.key]); });
  const top5 = DEFECT_SCHEMA.map(d=>({...d, qty:byDefect[d.key]})).sort((a,b)=>b.qty-a.qty).slice(0,5);
  const rowsHtml = top5.map(d=>{
    const dhu = inspected>0 ? d.qty/inspected*100 : 0;
    return `<tr>
      <td><span class="badge-dot" style="background:${GROUP_META[d.group].hex}"></span>${d.name.length>26? d.name.slice(0,24)+'…' : d.name}</td>
      <td class="mono">${d.qty}</td>
      <td class="mono">${fmt1(dhu)}%</td>
    </tr>`;
  }).join('');
  return `<table class="log"><thead><tr><th>Defect</th><th>Qty</th><th>DHU %</th></tr></thead><tbody>${rowsHtml||'<tr><td colspan="3" style="color:var(--muted)">No defects logged</td></tr>'}</tbody></table>`;
}

    const d = r.header.date;
    if(!byDate[d]) byDate[d] = {dhuSum:0,pctSum:0,n:0};

    byDate[d].dhuSum += rt.dhu; byDate[d].pctSum += rt.pctDefective; byDate[d].n++;
  });
  const dates = Object.keys(byDate).sort();
  const dhuSeries = dates.map(d=> byDate[d].dhuSum/byDate[d].n);

      {label:'Defective %', data:pctSeries, borderColor:'#2DD4BF', backgroundColor:'rgba(45,212,191,0.08)', tension:.35, fill:true, pointRadius:3},
    ]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'top', labels:{boxWidth:10, usePointStyle:true}}},
      scales:{ y:{beginAtZero:true, grid:{color:'#1D222A'}}, x:{grid:{display:false}} }
    }
  });

  // Group donut

  reports.forEach(r=>{ const rt=reportTotals(r); Object.keys(gt).forEach(g=> gt[g]+=rt.groupTotals[g]); });

  // Pareto

    return {dhu:dhuSum/rs.length, pct:pctSum/rs.length};
  });
  // Severity split (Critical / Major / Minor)
  let sevC=0, sevMaj=0, sevMin=0;
  reports.forEach(r=>{ const rt=reportTotals(r); sevC+=rt.criticalCount; sevMaj+=rt.majorCount; sevMin+=rt.minorCount; });

    options:{ responsive:true, maintainAspectRatio:false, cutout:'60%',
      plugins:{legend:{position:'bottom', labels:{boxWidth:9, usePointStyle:true, font:{size:10.5}}}} }
  });

  new Chart(document.getElementById('deptChart'), {
    type:'bar',
    data:{ labels:depts, datasets:[
      {label:'Avg DHU %', data:deptStats.map(s=>s.dhu), backgroundColor:'#EF4444', borderRadius:5},
      {label:'Avg Defective %', data:deptStats.map(s=>s.pct), backgroundColor:'#2DD4BF', borderRadius:5},

function renderEntryHoursStep(){
  const h = state.header;
  const shift = state.selectedShift;
  const completedIdx = shift!=null ? state.hours.findIndex(x=>x.shift===shift) : -1;
  const isCompleted = completedIdx>=0;
  const workBundles = (shift && !isCompleted) ? (state.hourWork[shift]||[]) : [];
  const workTotals = hourTotals({bundles: workBundles});

  const shiftOptions = SHIFT_LABELS.map(s=>{
    const doneIdx = state.hours.findIndex(x=>x.shift===s);
    const done = doneIdx>=0;
    const inProgressBundles = state.hourWork[s]||[];
    const inProgress = !done && inProgressBundles.length>0;
    const stat = done ? hourTotals(state.hours[doneIdx]) : (inProgress ? hourTotals({bundles:inProgressBundles}) : null);
    const label = `${s} Hour — ${stat? `${stat.inspected} pcs (${done?'complete':'in progress'})` : 'not started'}`;
    return `<option value="${s}" ${state.selectedShift===s?'selected':''}>${label}</option>`;
  }).join('');
  const shiftPicker = `
    <div class="f" style="max-width:340px;">
      <span class="field-label">Hour</span>
      <select data-shift-select>${shiftOptions}</select>
    </div>`;

  let bundlePanel = '';
  if(!shift){
    bundlePanel = `<div class="empty"><div class="big">⏱️</div><div class="t1">Pick an hour above to begin</div><div class="t2">Select 1st, 2nd, 3rd… to start logging bundles for that hour.</div></div>`;
  } else if(isCompleted){
    const rt = hourTotals(state.hours[completedIdx]);
    bundlePanel = `
    <div class="hour-summary-row" style="grid-template-columns:repeat(6,1fr);">
      <div class="stat-mini"><div class="sl">Bundles</div><div class="sv mono">${rt.bundleCount}</div></div>
      <div class="stat-mini"><div class="sl">Inspected</div><div class="sv mono">${rt.inspected}</div></div>
      <div class="stat-mini"><div class="sl">Defective</div><div class="sv mono">${rt.defective}</div></div>
      <div class="stat-mini"><div class="sl">Repaired</div><div class="sv mono">${rt.repaired}</div></div>
      <div class="stat-mini"><div class="sl">Rejected</div><div class="sv mono">${rt.rejected}</div></div>
      <div class="stat-mini"><div class="sl">DHU</div><div class="sv mono" style="color:var(--brand);">${fmt1(rt.dhu)}%</div></div>
    </div>
    <div class="subtle-note">${shift} Hour is complete.</div>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button class="btn ghost" data-action="reopen-hour">Reopen ${shift} Hour to add more bundles</button>
      <button class="btn danger" data-action="delete-hour">🗑 Delete ${shift} Hour</button>
    </div>
    `;
  } else {
    const bd = state.bundleDraft;
    DEFECT_SCHEMA.forEach(d=>{
      const v = bd.values[d.key];
      if(v.defectiveAuto === undefined) v.defectiveAuto = true; // migrate legacy drafts
      if(v.defectiveAuto){
        v.defective = d.group==='RF' ? (Number(v.cri)||0) : (Number(v.maj)||0)+(Number(v.min)||0);
      }

    let bt = bundleTotals(bd);
    if(bd.defectiveQtyAuto){
      const autoVal = bt.totalDefects; // Critical + Major + Minor

    const activeGroup = state.selectedDefectGroup || 'RF';

function parseBundleCardText(text){
  const grab = (re) => { const m = text.match(re); return m ? m[1].trim() : ''; };
  const buyer = grab(/BR\s*#\s*([^\n\r]+)/i);
  const style = grab(/STY\s*#\s*([^\n\r]+)/i);
  const color = grab(/COLOR\s*#\s*([^\n\r]+)/i);
  const qtyStr = grab(/QTY\s*#\s*(\d+)/i);
  const bn = grab(/BN\s*#\s*([^\n\r]+)/i);
  const roll = grab(/ROLL\s*#\s*([^\n\r]+)/i);
  const qty = Number(qtyStr) || 0;
  if(!buyer && !style && !qty) return null;
  return { buyer, style, color, qty, bn, roll };
}

function applyBundleScan(parsed){
  if(!parsed){
    state.scan.status = 'Could not read bundle card fields from that code — try again or paste the text.';
    render();
    return;
  }
  if(state.entryStep==='header'){
    // Step 1: identify the batch — fill Buyer / Style / Color on the report header
    if(parsed.buyer) state.header.buyer = parsed.buyer;
    if(parsed.style) state.header.styleNo = parsed.style;
    if(parsed.color) state.header.color = parsed.color;
    stopScanCamera();
    state.scan.open = false;
    showToast(`Scanned: ${parsed.buyer? 'Buyer '+parsed.buyer+' · ':''}${parsed.style? 'Style '+parsed.style:''}`);
  } else {
    // Step 2: scanning a single bundle card sets this bundle's Inspected Qty
    if(parsed.qty>0) state.bundleDraft.qty = parsed.qty;
    if(parsed.bn) state.bundleDraft.bn = parsed.bn;
    if(parsed.roll) state.bundleDraft.roll = parsed.roll;
    stopScanCamera();
    state.scan.open = false;
    showToast(`Scanned bundle — ${parsed.qty||0} pcs${parsed.bn? ' · BN# '+parsed.bn:''}`);
  }
}

let _scanStream = null, _scanRAF = null;
function startScanCamera(){
  const video = document.getElementById('scanVideo');
  if(!video) return;
  if(_scanStream){
    // modal was re-rendered (e.g. a toast fired) — reattach the live stream to the new <video> node
    if(video.srcObject !== _scanStream) video.srcObject = _scanStream;
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.scan.status = 'Camera not available on this device/browser — paste the QR text below instead.';
    render();
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream=>{
      _scanStream = stream;
      video.srcObject = stream;
      const tick = ()=>{
        const video = document.getElementById('scanVideo');
        const canvas = document.getElementById('scanCanvas');
        if(!state.scan.open || !video || !canvas){ return; }
        const ctx = canvas.getContext('2d');
        if(video.readyState === video.HAVE_ENOUGH_DATA && typeof jsQR !== 'undefined'){
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imgData.data, imgData.width, imgData.height);
          if(code && code.data){
            const parsed = parseBundleCardText(code.data);
            if(parsed){ applyBundleScan(parsed); render(); return; }
          }
        }
        _scanRAF = requestAnimationFrame(tick);
      };
      _scanRAF = requestAnimationFrame(tick);
    })
    .catch(()=>{
      state.scan.status = 'Camera permission denied — paste the QR text below instead.';
      render();
    });
}
function stopScanCamera(){
  if(_scanRAF) cancelAnimationFrame(_scanRAF);
  _scanRAF = null;
  if(_scanStream){ _scanStream.getTracks().forEach(t=>t.stop()); _scanStream = null; }
}

/* ============================= CSV EXPORT ============================= */
function exportReportCSV(id){
  const r = state.reports.find(x=>x.id===id);
  if(!r) return;
  const cols = ['Hour','Bundles','Inspected','Defective','Repaired','Rejected','Passed', ...DEFECT_SCHEMA.map(d=>d.name+' (Cri)'), ...DEFECT_SCHEMA.map(d=>d.name+' (Maj)'), ...DEFECT_SCHEMA.map(d=>d.name+' (Min)'), ...DEFECT_SCHEMA.map(d=>d.name+' (Def)'), 'Group RF','Group A','Group B','Group C','Group D','Total Defects','DHU %','Defective %'];
  const lines = [cols.join(',')];
  r.hours.forEach(h=>{
    const t = hourTotals(h);
    const def = {}; DEFECT_SCHEMA.forEach(d=> def[d.key]={cri:0,maj:0,min:0,defective:0});
    (h.bundles||[]).forEach(b=> DEFECT_SCHEMA.forEach(d=>{
      const v = (b.values && b.values[d.key]) || {cri:0,maj:0,min:0,defective:0};
      def[d.key].cri += Number(v.cri)||0; def[d.key].maj += Number(v.maj)||0; def[d.key].min += Number(v.min)||0; def[d.key].defective += Number(v.defective)||0;
    }));
    const row = [h.shift, t.bundleCount, t.inspected, t.defective, t.repaired, t.rejected, t.passed,
      ...DEFECT_SCHEMA.map(d=> def[d.key].cri),
      ...DEFECT_SCHEMA.map(d=> def[d.key].maj),
      ...DEFECT_SCHEMA.map(d=> def[d.key].min),
      ...DEFECT_SCHEMA.map(d=> def[d.key].defective),
      t.groupTotals.RF, t.groupTotals.A, t.groupTotals.B, t.groupTotals.C, t.groupTotals.D,
      t.totalDefects, fmt1(t.dhu), fmt1(t.pctDefective)];
    lines.push(row.map(v=>`"${v}"`).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${r.dept}_EndLine_${r.header.date}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ============================= EVENTS ============================= */
function bindEvents(){
  document.querySelectorAll('[data-tab]').forEach(el=> el.addEventListener('click', ()=>{ state.tab = el.dataset.tab; render(); }));

  // Dashboard filters
  document.querySelectorAll('[data-dashdept]').forEach(el=> el.addEventListener('click', ()=>{ state.dashDept = el.dataset.dashdept; render(); }));
  const rangeSel = document.querySelector('[data-dashrange]');
  if(rangeSel) rangeSel.addEventListener('change', e=>{ state.dashRange = e.target.value; render(); });
  const buyerSel = document.querySelector('[data-dashbuyer]');
  if(buyerSel) buyerSel.addEventListener('change', e=>{ state.dashBuyer = e.target.value; render(); });
  const lineSel = document.querySelector('[data-dashline]');
  if(lineSel) lineSel.addEventListener('change', e=>{ state.dashLine = e.target.value; render(); });

  // Entry dept toggle
  document.querySelectorAll('[data-entrydept]').forEach(el=> el.addEventListener('click', ()=>{
    state.entryDept = el.dataset.entrydept;
    if(state.entryDept==='Finishing'){
      state.header.lineNo = 'N/A';
    } else if(state.header.lineNo==='N/A'){
      state.header.lineNo = linesForSBU(state.header.sbu)[0];
    }
    render();
  }));

  // Header fields
  document.querySelectorAll('[data-h]').forEach(el=> el.addEventListener('input', e=>{
    state.header[el.dataset.h] = e.target.value;
    if(el.dataset.h==='sbu'){
      // SBU changed: re-derive the line list and default to its first line
      state.header.lineNo = state.entryDept==='Finishing' ? 'N/A' : linesForSBU(e.target.value)[0];
      render();
    }
  }));

  // Bundle-level fields (Inspected Qty, Defective/Repaired/Rejection Qty)
  document.querySelectorAll('[data-bf]').forEach(el=> el.addEventListener('input', e=>{
    const f = el.dataset.bf;
    const digits = sanitizeDigits(e.target.value);
    if(e.target.value !== digits) e.target.value = digits;
    state.bundleDraft[f] = Number(digits)||0;
    if(f==='defectiveQty') state.bundleDraft.defectiveQtyAuto = false;
    render();
  }));

  // Defect inputs (bound to the current bundle draft)
  document.querySelectorAll('[data-defect]').forEach(el=> el.addEventListener('input', e=>{
    const k = el.dataset.defect, sev = el.dataset.sev;
    const digits = sanitizeDigits(e.target.value);
    if(e.target.value !== digits) e.target.value = digits;
    state.bundleDraft.values[k][sev] = Number(digits)||0;
    if(sev==='defective') state.bundleDraft.values[k].defectiveAuto = false;
    render();
  }));
  document.querySelectorAll('[data-reset-def]').forEach(el=> el.addEventListener('click', e=>{
    e.preventDefault();
    state.bundleDraft.values[el.dataset.resetDef].defectiveAuto = true;
    render();
  }));

  // +/- steppers for every numeric entry (bundle fields and defect grid)
  document.querySelectorAll('.step-btn').forEach(btn=> btn.addEventListener('click', ()=>{
    const dir = Number(btn.dataset.dir)||0;
    if(btn.dataset.bf){
      const f = btn.dataset.bf;
      const cur = Number(state.bundleDraft[f])||0;
      state.bundleDraft[f] = Math.max(0, cur+dir);
      if(f==='defectiveQty') state.bundleDraft.defectiveQtyAuto = false;
    } else if(btn.dataset.defect){
      const k = btn.dataset.defect, sev = btn.dataset.sev;
      const cur = Number(state.bundleDraft.values[k][sev])||0;
      state.bundleDraft.values[k][sev] = Math.max(0, cur+dir);
      if(sev==='defective') state.bundleDraft.values[k].defectiveAuto = false;
    }
    render();
  }));
  document.querySelectorAll('[data-action="reset-defective-auto"]').forEach(el=> el.addEventListener('click', (e)=>{
    e.preventDefault();
    state.bundleDraft.defectiveQtyAuto = true;
    render();
  }));

  // Hour dropdown (select an hour to work on) + delete a completed hour
  const shiftSel = document.querySelector('[data-shift-select]');
  if(shiftSel) shiftSel.addEventListener('change', e=> selectShift(e.target.value));
  const deleteHourBtn = document.querySelector('[data-action="delete-hour"]');
  if(deleteHourBtn) deleteHourBtn.addEventListener('click', ()=>{
    const s = state.selectedShift;
    if(confirm(`Delete the completed ${s} Hour? This cannot be undone.`)){
      state.hours = state.hours.filter(h=>h.shift!==s);
      delete state.hourWork[s];
      state.bundleDraft = emptyBundleDraft();
      render();
    }
  });

  // Defect group dropdown
  const groupSel = document.querySelector('[data-group-select]');
  if(groupSel) groupSel.addEventListener('change', e=>{ state.selectedDefectGroup = e.target.value; render(); });

  // Header step navigation
  const headerNext = document.querySelector('[data-action="header-next"]');
  if(headerNext) headerNext.addEventListener('click', ()=>{
    if(!state.header.date){ showToast('Set the inspection date first'); return; }
    state.entryStep = 'hours';
    if(!state.selectedShift) state.selectedShift = SHIFT_LABELS.find(s=> !state.hours.some(h=>h.shift===s)) || SHIFT_LABELS[0];
    render();
  });
  const headerBack = document.querySelector('[data-action="header-back"]');
  if(headerBack) headerBack.addEventListener('click', ()=>{ state.entryStep = 'header'; render(); });

  // Bundle submit / hour complete / reopen
  const submitBundleBtn = document.querySelector('[data-action="submit-bundle"]');
  if(submitBundleBtn) submitBundleBtn.addEventListener('click', submitBundle);
  const completeHourBtn = document.querySelector('[data-action="complete-hour"]');
  if(completeHourBtn) completeHourBtn.addEventListener('click', completeHour);
  const reopenHourBtn = document.querySelector('[data-action="reopen-hour"]');
  if(reopenHourBtn) reopenHourBtn.addEventListener('click', reopenHour);
  document.querySelectorAll('[data-remove-bundle]').forEach(el=> el.addEventListener('click', ()=>{
    const i = Number(el.dataset.removeBundle);
    state.hourWork[state.selectedShift].splice(i,1);
    render();
  }));

  // Save report
  const saveReportBtn = document.querySelector('[data-action="save-report"]');
  if(saveReportBtn) saveReportBtn.addEventListener('click', saveReport);
  const gotoEntry = document.querySelector('[data-action="goto-entry"]');
  if(gotoEntry) gotoEntry.addEventListener('click', ()=>{ state.tab='entry'; render(); });

  // Log actions
  document.querySelectorAll('[data-view-report]').forEach(el=> el.addEventListener('click', ()=>{ state.viewingReportId = el.dataset.viewReport; render(); }));
  document.querySelectorAll('[data-export-report]').forEach(el=> el.addEventListener('click', ()=> exportReportCSV(el.dataset.exportReport)));
  document.querySelectorAll('[data-del-report]').forEach(el=> el.addEventListener('click', ()=>{
    if(confirm('Delete this report permanently?')){
      state.reports = state.reports.filter(r=>r.id!==el.dataset.delReport);
      persistReports();
      render();
    }
  }));
  document.querySelectorAll('[data-action="close-modal"]').forEach(el=> el.addEventListener('click', ()=>{ state.viewingReportId=null; render(); }));

  // Scan modal
  document.querySelectorAll('[data-action="open-scan"]').forEach(el=> el.addEventListener('click', ()=>{
    state.scan = { open:true, status:'Point the camera at the bundle card QR code', manualText:'' };
    render();
  }));
  document.querySelectorAll('[data-action="close-scan"]').forEach(el=> el.addEventListener('click', ()=>{
    stopScanCamera();
    state.scan.open = false;
    render();
  }));
  const manualTA = document.getElementById('scanManualText');
  if(manualTA) manualTA.addEventListener('input', e=>{ state.scan.manualText = e.target.value; });
  document.querySelectorAll('[data-action="parse-manual-scan"]').forEach(el=> el.addEventListener('click', ()=>{
    const parsed = parseBundleCardText(state.scan.manualText||'');
    applyBundleScan(parsed);
    render();
  }));
}

function selectShift(shift){
  state.selectedShift = shift;
  state.bundleDraft = emptyBundleDraft();
  render();
}

function submitBundle(){
  const shift = state.selectedShift;
  const bd = state.bundleDraft;
  if(!bd.qty || bd.qty<=0){
    showToast('Enter this bundle\'s Inspected Qty before submitting');
    return;
  }
  if(!state.hourWork[shift]) state.hourWork[shift] = [];
  state.hourWork[shift].push(JSON.parse(JSON.stringify(bd)));
  state.bundleDraft = emptyBundleDraft();
  showToast(`Bundle submitted — ${bd.qty} pcs added to ${shift} Hour`);
}

function completeHour(){
  const shift = state.selectedShift;
  const bundles = state.hourWork[shift]||[];
  if(bundles.length===0){
    showToast('Submit at least one bundle before completing this hour');
    return;
  }
  const idx = state.hours.findIndex(h=>h.shift===shift);
  const hourEntry = { shift, bundles: JSON.parse(JSON.stringify(bundles)) };
  if(idx>=0) state.hours[idx] = hourEntry; else state.hours.push(hourEntry);
  delete state.hourWork[shift];
  showToast(`${shift} Hour completed`);
  // advance to the next not-yet-completed shift automatically
  const nextShift = SHIFT_LABELS.find(s=> !state.hours.some(h=>h.shift===s));
  selectShift(nextShift || shift);
}

function reopenHour(){
  const shift = state.selectedShift;
  const idx = state.hours.findIndex(h=>h.shift===shift);
  if(idx<0) return;
  state.hourWork[shift] = JSON.parse(JSON.stringify(state.hours[idx].bundles||[]));
  state.hours.splice(idx,1);
  state.bundleDraft = emptyBundleDraft();
  render();
}

async function saveReport(){
  if(state.hours.length===0){
    showToast('Log at least one hour before saving the report');
    return;
  }
  if(!state.header.date){
    showToast('Set the inspection date');
    return;
  }
  const report = {
    id: uid(),
    dept: state.entryDept,
    header: {...state.header},
    hours: JSON.parse(JSON.stringify(state.hours)),
    createdAt: new Date().toISOString(),
  };
  state.reports.push(report);
  await persistReports();
  showToast('Report saved — dashboard updated');
  // reset for next report, keep the fields that stay the same shift-to-shift:
  // date, SBU, line, supervisor & inspector name. Buyer/Style/Color reset since
  // those come from the next bundle card scan.
  const keep = { date: state.header.date, sbu: state.header.sbu, lineNo: state.header.lineNo,
                 svName: state.header.svName, inspectorName: state.header.inspectorName };
  state.header = emptyHeader();
  Object.assign(state.header, keep);
  state.hours = [];
  state.hourWork = {};
  state.entryStep = 'header';
  state.selectedShift = null;
  state.bundleDraft = emptyBundleDraft();
  state.tab = 'dashboard';
  render();
}

/* ============================= INIT ============================= */
loadReports();
</script>
