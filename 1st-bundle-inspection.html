<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root{
  --bg:#F1F0EA; --panel:#FFFFFF; --text:#1F1D1A; --muted:#726F68; --line:#E3E1D9;
  --brand:#3E6B4F; --brand-dim:#E6EEE8; --bad:#B84226; --bad-dim:#F6E4DE;

}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;font-size:14px;}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px;}
.guard-bar{background:#1F1D1A;color:#F1F0EA;font-size:12.5px;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;}
.guard-bar a{color:#F1F0EA;}
h1{font-size:22px;margin:0;}
h2.section-title{font-size:14px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line);text-transform:uppercase;letter-spacing:.03em;}
h3.section-title{font-size:12.5px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:14px 0 18px;flex-wrap:wrap;gap:10px;}
.sub{color:var(--muted);font-size:12.5px;}

.section-block{margin-bottom:16px;}
.header-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.f{display:flex;flex-direction:column;gap:4px;}
.field-label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
input,select,textarea{font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);width:100%;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;}
input[readonly]{background:#F6F5F1;color:var(--muted);}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.btn{font-family:inherit;font-weight:600;font-size:13px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);}
.btn.danger{background:var(--bad-dim);color:var(--bad);border-color:var(--bad-dim);}
.btn.ghost{background:transparent;}
.btn.small{padding:5px 10px;font-size:12px;}
table.rep-table{width:100%;border-collapse:collapse;}
.rep-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);}
.rep-table td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top;}
.rep-group-hd td{background:#F6F5F1;font-weight:700;font-size:12.5px;padding:8px 6px;}
.result-select.PASS{border-color:var(--brand);color:var(--brand);font-weight:700;}
.result-select.FAIL{border-color:var(--bad);color:var(--bad);font-weight:700;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;background:#E9E7DF;}
.badge.pass{background:var(--brand-dim);color:var(--brand);}
.badge.fail{background:var(--bad-dim);color:var(--bad);}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px;}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.k-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.k-value{font-size:20px;font-weight:700;margin-top:2px;}
.subtle-note{font-size:12px;color:var(--muted);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1F1D1A;color:#F1F0EA;padding:10px 18px;border-radius:8px;font-size:13px;z-index:50;}
.row-add-btn{margin-top:8px;}
.check{display:flex;align-items:center;gap:6px;font-size:13px;}
.overflow-x{overflow-x:auto;}
</style>
</head>
<body>
<div class="guard-bar"><span>J.M. FABRICS LIMITED &middot; QA Inspection &middot; 1st Bundle Inspection</span><a href="qa-inspection.html">&larr; Back to QA Inspection</a></div>
<div id="app"></div>
<script>
/* ============================= REFERENCE DATA (ANSI-ASQ Z1.4 / ISO 2859-1, normal, single) ============================= */
const AQL_COLS = [0.010,0.015,0.025,0.040,0.065,0.10,0.15,0.25,0.40,0.65,1.0,1.5,2.5,4.0,6.5,10];
const CODE_LETTERS = ['A','B','C','D','E','F','G','H','J','K','L','M','N','P','Q','R'];
const CODE_SIZE = { A:2,B:3,C:5,D:8,E:13,F:20,G:32,H:50,J:80,K:125,L:200,M:315,N:500,P:800,Q:1250,R:2000 };
const CODE_ZERO_COL = { A:15,B:14,C:13,D:12,E:11,F:11,G:10,H:9,J:8,K:7,L:6,M:5,N:4,P:3,Q:2,R:1 };
const AC_SEQ = [0,1,2,3,5,7,10,14,21];
const LOT_BANDS = [
  {min:2,max:8,c:{'S-1':'A','S-2':'A','S-3':'A','S-4':'A','General I':'A','General II':'A','General III':'B'}},
  {min:9,max:15,c:{'S-1':'A','S-2':'A','S-3':'A','S-4':'A','General I':'A','General II':'B','General III':'C'}},
  {min:16,max:25,c:{'S-1':'A','S-2':'A','S-3':'B','S-4':'B','General I':'B','General II':'C','General III':'D'}},
  {min:26,max:50,c:{'S-1':'A','S-2':'B','S-3':'B','S-4':'C','General I':'C','General II':'D','General III':'E'}},
  {min:51,max:90,c:{'S-1':'B','S-2':'B','S-3':'C','S-4':'C','General I':'C','General II':'E','General III':'F'}},
  {min:91,max:150,c:{'S-1':'B','S-2':'B','S-3':'C','S-4':'D','General I':'D','General II':'F','General III':'G'}},
  {min:151,max:280,c:{'S-1':'B','S-2':'C','S-3':'D','S-4':'E','General I':'E','General II':'G','General III':'H'}},
  {min:281,max:500,c:{'S-1':'B','S-2':'C','S-3':'D','S-4':'E','General I':'F','General II':'H','General III':'J'}},
  {min:501,max:1200,c:{'S-1':'C','S-2':'C','S-3':'E','S-4':'F','General I':'G','General II':'J','General III':'K'}},
  {min:1201,max:3200,c:{'S-1':'C','S-2':'D','S-3':'E','S-4':'G','General I':'H','General II':'K','General III':'L'}},
  {min:3201,max:10000,c:{'S-1':'C','S-2':'D','S-3':'F','S-4':'G','General I':'J','General II':'L','General III':'M'}},
  {min:10001,max:35000,c:{'S-1':'C','S-2':'D','S-3':'F','S-4':'H','General I':'K','General II':'M','General III':'N'}},
  {min:35001,max:150000,c:{'S-1':'D','S-2':'E','S-3':'G','S-4':'J','General I':'L','General II':'N','General III':'P'}},
  {min:150001,max:500000,c:{'S-1':'D','S-2':'E','S-3':'G','S-4':'J','General I':'M','General II':'P','General III':'Q'}},
  {min:500001,max:Infinity,c:{'S-1':'D','S-2':'E','S-3':'H','S-4':'K','General I':'N','General II':'Q','General III':'R'}}
];
const INSPECTION_LEVELS = ['General I','General II','General III','S-1','S-2','S-3','S-4'];
const DEFECT_TYPES = ['Critical','Major','Minor'];
const DECISIONS = ['Accepted','Rework Required','Rejected'];

function codeLetterFor(lotSize, level){
  const q = Number(lotSize)||0;
  if (q < 2) return '';
  const band = LOT_BANDS.find(b => q >= b.min && q <= b.max);
  if (!band) return '';
  return band.c[level] || band.c['General II'];
}
function aqlColIndex(aql){
  const v = Number(aql); let best=0, bd=Infinity;
  AQL_COLS.forEach((c,i)=>{ const d=Math.abs(c-v); if(d<bd){bd=d;best=i;} });
  return best;
}
function singlePlan(codeLetter, aql){
  if (!codeLetter) return null;
  if (Number(aql) === 0) return { code:codeLetter, n:CODE_SIZE[codeLetter], ac:0, re:1 };
  const ai = aqlColIndex(aql);
  let ci = CODE_LETTERS.indexOf(codeLetter), guard=0;
  while (ci >= 0 && ci < CODE_LETTERS.length && guard++ < 40){
    const L = CODE_LETTERS[ci], k = ai - CODE_ZERO_COL[L];
    if (k < 0){ ci++; continue; }
    if (k > AC_SEQ.length-1){ ci--; continue; }
    return { code:L, n:CODE_SIZE[L], ac:AC_SEQ[k], re:AC_SEQ[k]+1 };
  }
  return null;
}
function computeAQL(lotQty, foundC, foundM, foundN, aqlC, aqlM, aqlN, level, noDefectsFound){
  level = level || 'General II';
  const lot = Number(lotQty)||0;
  const code = codeLetterFor(lot, level);
  const pC = singlePlan(code, aqlC), pM = singlePlan(code, aqlM), pN = singlePlan(code, aqlN);
  const sampleSize = Math.max(pC?pC.n:0, pM?pM.n:0, pN?pN.n:0);
  const critAllowed = Number(aqlC)>0 ? (pC?pC.ac:0) : 0;
  const majAllowed = pM?pM.ac:0, minAllowed = pN?pN.ac:0;
  const fail = foundC > critAllowed || foundM > majAllowed || foundN > minAllowed;
  const anyFound = foundC||foundM||foundN;
  return { sampleSize, codeLetter:code, critAllowed, majAllowed, minAllowed,
    result: anyFound ? (fail?'FAIL':'PASS') : (noDefectsFound ? 'PASS' : '') };
}

/* ============================= CHECKLIST CONFIG (from JMF QA_Inspection.xlsx) ============================= */
const INSPECTION_TYPE = '1st Bundle Inspection';
const MODULE_KIND = '1stbundle';
const MODULE_STORAGE_KEY = '1stbundle-reports-fallback';
const CHECKLIST_GROUPS = [
  { group: 'Documents Review', items: ['Style File Review', 'Risk Assessment Review', 'Tech Pack Review', 'PP Meeting Review', 'PP Sample Comments Review', 'Approval Sample Review', 'Trims Card Review', 'Size Set Approval Review'] },
  { group: 'Product Appearance', items: ['PP Sample vs Bulk Production Correct?', 'Styling Check', 'Fabric Color', 'Fabric Hand Feel', 'Fabric Appearance', 'Shading (Panel to Panel)', 'Overall Garments Appearance'] },
  { group: 'Sewing Construction', items: ['SPI (Stitch Per Inch)', 'Needle Gauge', 'Stitch Tension', 'Seam Allowance', 'Piping/Binding', 'Thread Color Matching', 'Trim Color Matching'] },
  { group: 'Measurement Check', items: ['Garment measurement as per approved spec', 'Measurement within approved tolerance', 'Random measurement of 3 pcs per size'] },
  { group: 'Attachment', items: ['Elastic', 'Lace', 'Heat Seal', 'Drawcord', 'Zipper', 'Button', 'Snap Button', 'Eyelet', 'Bow', 'Velcro', 'Rivet', 'Toggle/Cord Lock'] },
  { group: 'Label & Artwork Verification', items: ['Main Label Correct', 'Size Label Correct', 'Care Label Correct', 'Country of Origin Label Correct', 'Barcode Label Correct', 'Label Position Correct', 'Print Artwork Correct', 'Embroidery Correct', 'Heat Seal Dimension/Placement', 'Print/Embroidery Dimension', 'Print/Embroidery Placement'] },
  { group: 'Critical Defect Check', items: ['Missing Operation', 'Wrong Component Attachment', 'Wrong Label Information', 'Safety Requirement Complied', 'Sharp Edge/Point Check'] },
  { group: 'Functional Test', items: ['Zipper Running Smoothly', 'Button/Snap Functioning Correctly', 'Pull Test', 'Elastic Stretch Acceptable', 'Drawcord Functionality Verified', 'Minimum Neck Stretch', 'Pocket Functional', 'Hood Functionality', 'Adjustable Strap Functionality', 'Toggle/Cord Lock Function', 'Buckle Functionality'] }
];
const SUMMARY_GROUPS = ['Documents Review', 'Appearance', 'Construction', 'Measurements', 'Attachment', 'Labels & Artwork', 'Critical Defect', 'Functional Test'];


function flatChecklist(){
  const out = [];
  CHECKLIST_GROUPS.forEach(g => g.items.forEach(label => out.push({ group:g.group, label })));
  return out;
}

/* ============================= STATE ============================= */
function emptyHeader(){
  return {
    dataMode:'auto', sbu:'', buyer:'', ir:'', styleId:'', styleName:'', styleDescription:'', item:'', productDept:'', season:'',
    date:new Date().toISOString().slice(0,10), startTime:'', inspectorName:'',
    line:'', size:'', color:'', fiberComposition:'', productType:'',
    lotQty:'', inspectionLevel:'General II', aqlCritical:0, aqlMajor:2.5, aqlMinor:4.0,
  };
}
function emptyReportState(){
  return {
    header: emptyHeader(),
    checklist: flatChecklist().map(c => ({ group:c.group, label:c.label, status:'', result:'', comments:'' })),
    defects: [],
    noDefectsFound:false,
    comments:'',
    decision:'',
  };
}
let state = Object.assign({
  reports:[], storageReady:false, tab:'entry', editingId:null,
  sbuOptions:[], buyerOptions:[], irOptions:[], colorOptions:[],
  sbuLoading:false, buyerLoading:false, irLoading:false,
  sbuLoadFailed:false, buyerLoadFailed:false, irLoadFailed:false,
  toast:null,
}, emptyReportState());

/* ============================= BACKEND ============================= */
const QA_API_URL = "https://script.google.com/macros/s/AKfycbzZ2Kn-5XlYWyJL2x9eYwtuQwm9dWNX8okS47B4Bjh8OcMQkMhwuZEJapfPaW68ZVIZ/exec";
async function qaApi(payload){
  if (QA_API_URL.indexOf("PASTE_YOUR") === 0) throw new Error("Backend not connected yet");
  let lastErr=null;
  for (let attempt=1; attempt<=4; attempt++){
    try{
      const controller = new AbortController();
      const timeoutId = setTimeout(()=>controller.abort(), 15000);
      let res;
      try{
        res = await fetch(QA_API_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), signal:controller.signal });
      } finally { clearTimeout(timeoutId); }
      const rawText = await res.text();
      try{ return JSON.parse(rawText); }
      catch(e){ console.error('[qaApi] non-JSON (HTTP '+res.status+'):', rawText.slice(0,300)); throw new Error('non_json_response'); }
    }catch(e){
      lastErr = e; console.error('[qaApi] attempt '+attempt+' failed for "'+(payload&&payload.action)+'":', e);
      if (attempt<4) await new Promise(r=>setTimeout(r, attempt*1200));
    }
  }
  throw lastErr;
}
function isOwnReport_(r){ const t=(r&&r.header&&r.header.inspectionType)||''; return !t || t===INSPECTION_TYPE; }
async function loadReports(){
  try{
    const res = await qaApi({ action:"list1stBundle" });
    if (!res.ok) throw new Error(res.error||"Failed to load reports");
    state.reports = (Array.isArray(res.reports)?res.reports:[]).filter(isOwnReport_);
  }catch(e){
    try{ const raw = localStorage.getItem(MODULE_STORAGE_KEY); state.reports = (raw?JSON.parse(raw):[]).filter(isOwnReport_); }
    catch(e2){ state.reports=[]; }
    showToast('Could not reach server — showing this browser\'s last saved copy');
  }
  state.storageReady = true;
  loadSbuOptions();
  try{ render(); }catch(e){ console.error('[loadReports] render threw:', e); }
}
async function persistReports(){
  try{
    const res = await qaApi({ action:"save1stBundle", reports: state.reports });
    if (!res.ok) throw new Error(res.error||"Save failed");
  }catch(e){
    try{ localStorage.setItem(MODULE_STORAGE_KEY, JSON.stringify(state.reports)); }catch(e2){}
    showToast('Could not reach server — saved to this browser only');
  }
}

/* ============================= ORDER LOOKUP (SBU -> Buyer -> IR) ============================= */
async function loadSbuOptions(){
  state.sbuLoading=true; state.sbuLoadFailed=false; render();
  try{
    const res = await qaApi({ action:"listSbus" });
    if (!res.ok) throw new Error(res.error||'listSbus failed');
    state.sbuOptions = Array.isArray(res.sbus)?res.sbus:[];
    state.sbuLoadFailed = state.sbuOptions.length===0;
  }catch(e){ state.sbuOptions=[]; state.sbuLoadFailed=true; }
  state.sbuLoading=false; render();
}
async function loadBuyerOptions(sbu){
  state.buyerOptions=[]; state.irOptions=[]; state.buyerLoading=true; state.buyerLoadFailed=false; render();
  try{
    const res = await qaApi({ action:"listBuyers", sbu:sbu });
    if (!res.ok) throw new Error(res.error||'listBuyers failed');
    state.buyerOptions = Array.isArray(res.buyers)?res.buyers:[];
    state.buyerLoadFailed = state.buyerOptions.length===0;
  }catch(e){ state.buyerOptions=[]; state.buyerLoadFailed=true; }
  state.buyerLoading=false; render();
}
async function loadIrOptions(sbu, buyer){
  state.irOptions=[]; state.irLoading=true; state.irLoadFailed=false; render();
  try{
    const res = await qaApi({ action:"listIrs", sbu:sbu, buyer:buyer });
    if (!res.ok) throw new Error(res.error||'listIrs failed');
    state.irOptions = Array.isArray(res.irs)?res.irs:[];
    state.irLoadFailed = state.irOptions.length===0;
  }catch(e){ state.irOptions=[]; state.irLoadFailed=true; }
  state.irLoading=false; render();
}
async function loadStyleDetail(sbu, buyer, ir){
  render();
  try{
    const res = await qaApi({ action:"getOrderDetail", sbu:sbu, buyer:buyer, ir:ir });
    const d = res.ok ? res.detail : null;
    if (d){
      state.header.styleId = ir||'';
      state.header.styleName = d.styleName||'';
      state.header.styleDescription = d.styleDescription||'';
      state.header.item = d.item||'';
      state.header.productDept = d.productDept||'';
      state.header.season = d.season||'';
      if (!state.header.lotQty) state.header.lotQty = d.totalQty||'';
      state.colorOptions = (d.colors||[]).map(c=>c.color).filter(Boolean);
    }
  }catch(e){}
  render();
}

/* ============================= HELPERS ============================= */
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ state.toast=msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2600); }
function defectTotals(){
  const t = { Critical:0, Major:0, Minor:0 };
  state.defects.forEach(d => { t[d.type] = (t[d.type]||0) + (Number(d.qty)||0); });
  return t;
}
function aqlFor(){
  const h = state.header, t = defectTotals();
  return computeAQL(h.lotQty, t.Critical, t.Major, t.Minor, h.aqlCritical, h.aqlMajor, h.aqlMinor, h.inspectionLevel, state.noDefectsFound);
}
function groupResult_(groupName){
  const rows = state.checklist.filter(c => c.group === groupName);
  const results = rows.map(r=>r.result).filter(Boolean);
  if (!results.length) return 'Hold';
  return results.includes('Fail') ? 'Fail' : 'Pass';
}
function overallResult_(){
  const aql = aqlFor();
  const groupResults = SUMMARY_GROUPS.map(g => groupResult_(g));
  const workResult = aql.result === 'FAIL' ? 'Fail' : (aql.result === 'PASS' ? 'Pass' : 'Hold');
  const all = groupResults.concat([workResult]);
  if (all.includes('Fail')) return 'Fail';
  if (all.includes('Hold')) return 'Hold';
  return 'Pass';
}

/* ============================= RENDER ============================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="wrap">
      <div class="top">
        <div><h1>1st Bundle Inspection</h1><div class="sub">QA Inspection Checklist</div></div>
        <div class="tabs">
          <button class="tab-btn ${state.tab==='entry'?'active':''}" data-tab="entry">New Inspection</button>
          <button class="tab-btn ${state.tab==='log'?'active':''}" data-tab="log">Reports Log</button>
        </div>
      </div>
      ${state.tab==='entry' ? renderEntry() : renderLog()}
    </div>
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
  `;
  bindEvents();
}

function renderEntry(){
  const h = state.header, aql = aqlFor();
  return `
  ${renderOrderInfoPanel(h)}
  ${renderAqlPanel(h, aql)}
  ${renderChecklistPanel()}
  ${renderWorkmanshipPanel(aql)}
  ${renderCommentsPanel()}
  ${renderSummaryPanel(aql)}
  <div class="row" style="margin-top:6px;">
    <button type="button" class="btn primary" id="saveBtn">Save Inspection</button>
    <button type="button" class="btn ghost" id="pdfBtn">Export PDF</button>
    <button type="button" class="btn ghost" id="newBtn">Clear / New</button>
  </div>`;
}

function renderOrderInfoPanel(h){
  return `
  <div class="panel panel-pad section-block">
    <h2 class="section-title">Order Information</h2>
    <div class="row" style="margin-bottom:12px;">
      <button type="button" class="tab-btn ${h.dataMode!=='manual'?'active':''}" data-mode="auto">Auto &mdash; from Master Order Information Sheet</button>
      <button type="button" class="tab-btn ${h.dataMode==='manual'?'active':''}" data-mode="manual">Manual Entry</button>
    </div>
    ${h.dataMode==='manual' ? `
    <div class="header-grid">
      <div class="f"><span class="field-label">SBU</span><input type="text" data-hf="sbu" value="${esc(h.sbu)}"></div>
      <div class="f"><span class="field-label">Buyer</span><input type="text" data-hf="buyer" value="${esc(h.buyer)}"></div>
      <div class="f"><span class="field-label">IR / Style</span><input type="text" data-hf="ir" value="${esc(h.ir)}"></div>
      <div class="f"><span class="field-label">Style Name</span><input type="text" data-hf="styleName" value="${esc(h.styleName)}"></div>
    </div>` : `
    <div class="header-grid">
      <div class="f"><span class="field-label">SBU</span>
        <select data-hf-sel="sbu">
          <option value="">${state.sbuLoading?'Loading...':'-- select SBU --'}</option>
          ${state.sbuOptions.map(s=>`<option value="${esc(s)}" ${h.sbu===s?'selected':''}>${esc(s)}</option>`).join('')}
        </select>
      </div>
      <div class="f"><span class="field-label">Buyer</span>
        <select data-hf-sel="buyer" ${!h.sbu?'disabled':''}>
          <option value="">${state.buyerLoading?'Loading...':'-- select Buyer --'}</option>
          ${state.buyerOptions.map(s=>`<option value="${esc(s)}" ${h.buyer===s?'selected':''}>${esc(s)}</option>`).join('')}
        </select>
      </div>
      <div class="f"><span class="field-label">IR</span>
        <select data-hf-sel="ir" ${!h.buyer?'disabled':''}>
          <option value="">${state.irLoading?'Loading...':'-- select IR --'}</option>
          ${state.irOptions.map(s=>`<option value="${esc(s)}" ${h.ir===s?'selected':''}>${esc(s)}</option>`).join('')}
        </select>
      </div>
      <div class="f"><span class="field-label">Style Name</span><input type="text" value="${esc(h.styleName)}" readonly></div>
    </div>`}
    <div class="header-grid" style="margin-top:12px;">
      <div class="f"><span class="field-label">Inspection Date</span><input type="date" data-hf="date" value="${esc(h.date)}"></div>
      <div class="f"><span class="field-label">Inspection Time</span><input type="time" data-hf="startTime" value="${esc(h.startTime)}"></div>
      <div class="f"><span class="field-label">Inspected By</span><input type="text" data-hf="inspectorName" value="${esc(h.inspectorName)}"></div>
      <div class="f"><span class="field-label">Inspection Type</span><input type="text" value="${esc(INSPECTION_TYPE)}" readonly></div>
      <div class="f"><span class="field-label">Line</span><input type="text" data-hf="line" value="${esc(h.line)}"></div>
      <div class="f"><span class="field-label">Size</span><input type="text" data-hf="size" value="${esc(h.size)}"></div>
      <div class="f"><span class="field-label">Color</span>
        ${state.colorOptions.length ? `
        <select data-hf-sel2="color">
          <option value="">-- select Color --</option>
          ${state.colorOptions.map(c=>`<option value="${esc(c)}" ${h.color===c?'selected':''}>${esc(c)}</option>`).join('')}
        </select>` : `<input type="text" data-hf="color" value="${esc(h.color)}">`}
      </div>
      <div class="f"><span class="field-label">Fiber / Fabric Composition</span><input type="text" data-hf="fiberComposition" value="${esc(h.fiberComposition)}"></div>
      <div class="f"><span class="field-label">Product Type</span><input type="text" data-hf="productType" value="${esc(h.productType)}"></div>
      
    </div>
  </div>`;
}

function renderAqlPanel(h, aql){
  const t = defectTotals();
  return `
  <div class="panel panel-pad section-block">
    <h2 class="section-title">Sampling Plan &amp; AQL <span class="subtle-note">ISO 2859-1 / ANSI-ASQ Z1.4 &middot; Single Sampling Plan for Normal Inspection</span></h2>
    <div class="header-grid" style="margin-bottom:14px;">
      <div class="f"><span class="field-label">Inspection Level</span>
        <select data-hf="inspectionLevel">${INSPECTION_LEVELS.map(l=>`<option ${h.inspectionLevel===l?'selected':''}>${l}</option>`).join('')}</select>
      </div>
      <div class="f"><span class="field-label">Lot Qty</span><input type="number" data-hf="lotQty" value="${esc(h.lotQty)}"></div>
      <div class="f"><span class="field-label">AQL Critical</span><input type="number" step="0.01" data-hf="aqlCritical" value="${esc(h.aqlCritical)}"></div>
      <div class="f"><span class="field-label">AQL Major</span><input type="number" step="0.01" data-hf="aqlMajor" value="${esc(h.aqlMajor)}"></div>
      <div class="f"><span class="field-label">AQL Minor</span><input type="number" step="0.01" data-hf="aqlMinor" value="${esc(h.aqlMinor)}"></div>
    </div>
    <div class="overflow-x">
    <table class="rep-table">
      <thead><tr><th>Lot Qty</th><th>Sample Size</th><th>Defect Type</th><th>Critical</th><th>Major</th><th>Minor</th></tr></thead>
      <tbody>
        <tr>
          <td>${esc(h.lotQty)||'-'} <span class="subtle-note">(code ${aql.codeLetter||'-'})</span></td>
          <td>${aql.sampleSize||'-'}</td>
          <td>Defect Allowed</td>
          <td>${aql.critAllowed}</td>
          <td>${aql.majAllowed}</td>
          <td>${aql.minAllowed}</td>
        </tr>
        <tr>
          <td></td><td></td>
          <td>Found Defect</td>
          <td>${t.Critical}</td><td>${t.Major}</td><td>${t.Minor}</td>
        </tr>
      </tbody>
    </table>
    </div>
    <div class="row" style="margin-top:12px;align-items:center;">
      <label class="check"><input type="checkbox" id="noDefectsFound" ${state.noDefectsFound?'checked':''}> No workmanship defects found</label>
      <div class="subtle-note">AQL Result: <span class="badge ${aql.result==='FAIL'?'fail':aql.result==='PASS'?'pass':''}">${aql.result||'—'}</span></div>
    </div>
  </div>`;
}

function renderChecklistPanel(){
  let lastGroup=null;
  const rows = state.checklist.map((c,i)=>{
    const hd = c.group!==lastGroup ? `<tr class="rep-group-hd"><td colspan="4">${esc(c.group)}</td></tr>` : '';
    lastGroup = c.group;
    return hd + `
    <tr>
      <td>${esc(c.label)}</td>
      <td><select data-ck="${i}:status"><option value="">--</option><option ${c.status==='Yes'?'selected':''}>Yes</option><option ${c.status==='No'?'selected':''}>No</option><option ${c.status==='N/A'?'selected':''}>N/A</option></select></td>
      <td><select class="result-select ${c.result==='Pass'?'PASS':c.result==='Fail'?'FAIL':''}" data-ck="${i}:result"><option value="">--</option><option ${c.result==='Pass'?'selected':''}>Pass</option><option ${c.result==='Fail'?'selected':''}>Fail</option><option ${c.result==='N/A'?'selected':''}>N/A</option></select></td>
      <td><input type="text" data-ck="${i}:comments" value="${esc(c.comments)}"></td>
    </tr>`;
  }).join('');
  return `
  <div class="panel panel-pad section-block">
    <h2 class="section-title">Checklist</h2>
    <div class="overflow-x">
    <table class="rep-table">
      <thead><tr><th style="width:40%">Check Point</th><th>Status</th><th>Result</th><th>Comments</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  </div>`;
}

function renderWorkmanshipPanel(){
  const rows = state.defects.map((d,i)=>`
    <tr>
      <td>${i+1}</td>
      <td><input type="text" data-df="${i}:name" value="${esc(d.name)}" placeholder="Defect name"></td>
      <td><select data-df="${i}:type">${DEFECT_TYPES.map(t=>`<option ${d.type===t?'selected':''}>${t}</option>`).join('')}</select></td>
      <td><input type="number" data-df="${i}:qty" value="${d.qty||1}" style="width:70px"></td>
      <td><button type="button" class="btn danger small" data-remove-defect="${i}">&times;</button></td>
    </tr>`).join('') || `<tr><td colspan="5" class="subtle-note">No defects logged yet.</td></tr>`;
  return `
  <div class="panel panel-pad section-block">
    <h2 class="section-title">Workmanship Findings</h2>
    <div class="overflow-x">
    <table class="rep-table">
      <thead><tr><th>SL</th><th>Defect Name</th><th>Defect Type</th><th>Qty</th><th></th></tr></thead>
      <tbody id="defectList">${rows}</tbody>
    </table>
    </div>
    <button type="button" class="btn ghost small row-add-btn" id="addDefectBtn">+ Add Defect</button>
  </div>`;
}

function renderCommentsPanel(){
  return `
  <div class="panel panel-pad section-block">
    <h2 class="section-title">Comments</h2>
    <textarea id="f_comments" rows="3" style="width:100%;">${esc(state.comments)}</textarea>
  </div>`;
}

function renderSummaryPanel(aql){
  const rows = SUMMARY_GROUPS.map(g => {
    const r = groupResult_(g);
    return `<tr><td>${esc(g)}</td><td><span class="badge ${r==='Fail'?'fail':r==='Pass'?'pass':''}">${r}</span></td></tr>`;
  }).join('');
  const workResult = aql.result==='FAIL'?'Fail':(aql.result==='PASS'?'Pass':'Hold');
  const overall = overallResult_();
  return `
  <div class="panel panel-pad section-block">
    <h2 class="section-title">Summary</h2>
    <table class="rep-table">
      <thead><tr><th>Item</th><th>Result (Pass/Fail/Hold)</th></tr></thead>
      <tbody>
        ${rows}
        <tr><td>Workmanship</td><td><span class="badge ${workResult==='Fail'?'fail':workResult==='Pass'?'pass':''}">${workResult}</span></td></tr>
        <tr><td><b>Overall Result</b></td><td><span class="badge ${overall==='Fail'?'fail':overall==='Pass'?'pass':''}">${overall}</span></td></tr>
      </tbody>
    </table>
    <div class="row" style="margin-top:14px;align-items:center;">
      <div class="f" style="max-width:260px;">
        <span class="field-label">Decision</span>
        <select id="f_decision"><option value="">-- select --</option>${DECISIONS.map(d=>`<option ${state.decision===d?'selected':''}>${d}</option>`).join('')}</select>
      </div>
    </div>
  </div>`;
}

function renderLog(){
  const rows = state.reports.slice().sort((a,b)=> new Date(b.header.date)-new Date(a.header.date)).map(r=>{
    const aql = computeAQL(r.header.lotQty, 0,0,0, r.header.aqlCritical, r.header.aqlMajor, r.header.aqlMinor, r.header.inspectionLevel, true);
    return `
    <tr>
      <td>${esc(r.header.date)}</td>
      <td>${esc(r.header.buyer)}</td>
      <td>${esc(r.header.styleName||r.header.ir)}</td>
      <td>${esc(r.header.line)}</td>
      <td><span class="badge ${r.decision==='Rejected'?'fail':r.decision==='Accepted'?'pass':''}">${esc(r.decision||'-')}</span></td>
      <td><button type="button" class="btn ghost small" data-view-report="${r.id}">Open</button> <button type="button" class="btn danger small" data-delete-report="${r.id}">Delete</button></td>
    </tr>`;
  }).join('') || `<tr><td colspan="6" class="subtle-note">No ${esc(INSPECTION_TYPE)} reports saved yet.</td></tr>`;
  return `
  <div class="panel panel-pad section-block">
    <h2 class="section-title">Reports Log</h2>
    <div class="overflow-x">
    <table class="rep-table">
      <thead><tr><th>Date</th><th>Buyer</th><th>Style</th><th>Line</th><th>Decision</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  </div>`;
}

/* ============================= EVENTS ============================= */
function bindEvents(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ state.tab=b.dataset.tab; render(); }));
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click', ()=>{ state.header.dataMode=b.dataset.mode; render(); }));

  document.querySelectorAll('[data-hf]').forEach(el=>el.addEventListener('change', ()=>{ state.header[el.dataset.hf]=el.value; render(); }));
  document.querySelectorAll('[data-hf-sel]').forEach(el=>el.addEventListener('change', ()=>{
    const key = el.dataset.hfSel;
    state.header[key] = el.value;
    if (key==='sbu'){ state.header.buyer=''; state.header.ir=''; loadBuyerOptions(el.value); }
    if (key==='buyer'){ state.header.ir=''; loadIrOptions(state.header.sbu, el.value); }
    if (key==='ir'){ loadStyleDetail(state.header.sbu, state.header.buyer, el.value); }
    render();
  }));
  document.querySelectorAll('[data-hf-sel2]').forEach(el=>el.addEventListener('change', ()=>{ state.header[el.dataset.hfSel2]=el.value; render(); }));

  document.querySelectorAll('[data-ck]').forEach(el=>{
    const evt = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      const [i,field] = el.dataset.ck.split(':');
      state.checklist[Number(i)][field] = el.value;
      render();
    });
  });

  document.querySelectorAll('[data-df]').forEach(el=>{
    const evt = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      const [i,field] = el.dataset.df.split(':');
      state.defects[Number(i)][field] = field==='qty' ? Number(el.value)||0 : el.value;
      render();
    });
  });
  document.querySelectorAll('[data-remove-defect]').forEach(el=>el.addEventListener('click', ()=>{
    state.defects.splice(Number(el.dataset.removeDefect),1); render();
  }));
  const addDefectBtn = document.getElementById('addDefectBtn');
  if (addDefectBtn) addDefectBtn.addEventListener('click', ()=>{ state.defects.push({name:'',type:'Major',qty:1}); render(); });
  const noDefEl = document.getElementById('noDefectsFound');
  if (noDefEl) noDefEl.addEventListener('change', ()=>{ state.noDefectsFound = noDefEl.checked; render(); });

  const commentsEl = document.getElementById('f_comments');
  if (commentsEl) commentsEl.addEventListener('input', ()=>{ state.comments = commentsEl.value; });
  const decisionEl = document.getElementById('f_decision');
  if (decisionEl) decisionEl.addEventListener('change', ()=>{ state.decision = decisionEl.value; render(); });

  const saveBtn = document.getElementById('saveBtn');
  if (saveBtn) saveBtn.addEventListener('click', saveInspection);
  const pdfBtn = document.getElementById('pdfBtn');
  if (pdfBtn) pdfBtn.addEventListener('click', exportPdf);
  const newBtn = document.getElementById('newBtn');
  if (newBtn) newBtn.addEventListener('click', ()=>{
    if (confirm('Clear the current form and start a new inspection?')){
      Object.assign(state, emptyReportState());
      state.editingId = null;
      render();
    }
  });

  document.querySelectorAll('[data-view-report]').forEach(el=>el.addEventListener('click', ()=>{
    const r = state.reports.find(x=>x.id===el.dataset.viewReport);
    if (!r) return;
    Object.assign(state, JSON.parse(JSON.stringify({ header:r.header, checklist:r.checklist, defects:r.defects, noDefectsFound:r.noDefectsFound, comments:r.comments, decision:r.decision })));
    state.editingId = r.id;
    state.tab = 'entry';
    render();
  }));
  document.querySelectorAll('[data-delete-report]').forEach(el=>el.addEventListener('click', ()=>{
    if (!confirm('Delete this report? This cannot be undone.')) return;
    state.reports = state.reports.filter(x=>x.id!==el.dataset.deleteReport);
    persistReports(); render();
  }));
}

function saveInspection(){
  const h = state.header;
  if (!h.buyer || !h.line){ showToast('Please fill in at least Buyer and Line before saving.'); return; }
  const report = {
    id: state.editingId || ('r'+Date.now()),
    header: JSON.parse(JSON.stringify(h)),
    checklist: JSON.parse(JSON.stringify(state.checklist)),
    defects: JSON.parse(JSON.stringify(state.defects)),
    noDefectsFound: state.noDefectsFound,
    comments: state.comments,
    decision: state.decision,
    overall: overallResult_(),
  };
  report.header.inspectionType = INSPECTION_TYPE;
  const idx = state.reports.findIndex(r=>r.id===report.id);
  if (idx>=0) state.reports[idx]=report; else state.reports.push(report);
  state.editingId = report.id;
  persistReports();
  showToast('Inspection saved.');
  render();
}

/* ============================= PDF EXPORT ============================= */
function exportPdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  let y = 14;
  function heading(t){ doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.text(t, 10, y); y+=6; doc.setFont(undefined,'normal'); }
  function line(t){ doc.setFontSize(9.5); const lines = doc.splitTextToSize(t, pageW-20); doc.text(lines, 10, y); y += lines.length*4.5; }
  function checkPage(){ if (y > 275){ doc.addPage(); y = 14; } }

  doc.setFontSize(14); doc.setFont(undefined,'bold');
  doc.text('J.M. Fabrics Limited', pageW/2, y, { align:'center' }); y+=6;
  doc.setFontSize(11); doc.text(INSPECTION_TYPE, pageW/2, y, { align:'center' }); y+=8;
  doc.setFont(undefined,'normal');

  const h = state.header;
  heading('Order Information');
  line('Buyer: ' + (h.buyer||'-') + '   Style: ' + (h.styleName||h.ir||'-') + '   Line: ' + (h.line||'-') + '   Size: ' + (h.size||'-'));
  line('Color: ' + (h.color||'-') + '   Fiber/Composition: ' + (h.fiberComposition||'-') + '   Product Type: ' + (h.productType||'-'));
  line('Date: ' + (h.date||'-') + '   Time: ' + (h.startTime||'-') + '   Inspected By: ' + (h.inspectorName||'-'));
  
  y += 2; checkPage();

  const aql = aqlFor(); const t = defectTotals();
  heading('Sampling Plan & AQL (ISO 2859-1 / ANSI-ASQ Z1.4, Single, Normal)');
  line('Inspection Level: ' + h.inspectionLevel + '   Lot Qty: ' + (h.lotQty||'-') + '   Sample Size: ' + (aql.sampleSize||'-') + ' (code ' + (aql.codeLetter||'-') + ')');
  line('AQL — Critical: ' + h.aqlCritical + ' Major: ' + h.aqlMajor + ' Minor: ' + h.aqlMinor);
  line('Defect Allowed — Critical: ' + aql.critAllowed + ' Major: ' + aql.majAllowed + ' Minor: ' + aql.minAllowed);
  line('Found Defect — Critical: ' + t.Critical + ' Major: ' + t.Major + ' Minor: ' + t.Minor + '   AQL Result: ' + (aql.result||'-'));
  y += 2; checkPage();

  heading('Checklist');
  let lastGroup = null;
  state.checklist.forEach(c => {
    checkPage();
    if (c.group !== lastGroup){ doc.setFont(undefined,'bold'); line(c.group); doc.setFont(undefined,'normal'); lastGroup = c.group; }
    line('- ' + c.label + '   [' + (c.status||'-') + ' / ' + (c.result||'-') + ']' + (c.comments? ('  Comments: '+c.comments) : ''));
  });
  y += 2; checkPage();

  heading('Workmanship Findings');
  if (!state.defects.length){ line(state.noDefectsFound ? 'No workmanship defects found.' : 'No defects logged.'); }
  state.defects.forEach((d,i)=>{ checkPage(); line((i+1)+'. '+ (d.name||'-') + ' — ' + d.type + ' x' + (d.qty||1)); });
  y += 2; checkPage();

  heading('Comments');
  line(state.comments || '-');
  y += 2; checkPage();

  heading('Summary');
  SUMMARY_GROUPS.forEach(g => { checkPage(); line(g + ': ' + groupResult_(g)); });
  const workResult = aql.result==='FAIL'?'Fail':(aql.result==='PASS'?'Pass':'Hold');
  line('Workmanship: ' + workResult);
  doc.setFont(undefined,'bold'); line('Overall Result: ' + overallResult_()); doc.setFont(undefined,'normal');
  line('Decision: ' + (state.decision || '-'));

  doc.save((INSPECTION_TYPE.replace(/\s+/g,'_')) + '_' + (h.date||'') + '.pdf');
}

/* ============================= INIT ============================= */
if (!localStorage.getItem('tc_session')) { /* soft guard — page still works if opened directly during dev */ }
loadReports();
</script>
