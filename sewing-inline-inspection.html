<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sewing Inline Inspection — J.M. Fabrics Limited</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#F1F0EA; --panel:#FFFFFF; --text:#1F1D1A; --muted:#726F68; --line:#E3E1D9;
  --brand:#3E6B4F; --brand-dim:#E6EEE8; --bad:#B84226; --bad-dim:#F6E4DE;
  --crit:#B84226; --maj:#A9832F; --min:#2C5A86;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;font-size:14px;}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px;}
.guard-bar{background:#1F1D1A;color:#F1F0EA;font-size:12.5px;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;}
.guard-bar a{color:#F1F0EA;}
h1{font-size:22px;margin:0;}
h2.section-title{font-size:14px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line);text-transform:uppercase;letter-spacing:.03em;}
h3.section-title{font-size:12.5px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:14px 0 18px;flex-wrap:wrap;gap:10px;}
.sub{color:var(--muted);font-size:12.5px;}
.tabs{display:flex;gap:6px;background:#E9E7DF;padding:4px;border-radius:10px;}
.tab-btn{border:none;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:8px 15px;border-radius:8px;cursor:pointer;}
.tab-btn.active{background:var(--text);color:#F1F0EA;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;}
.panel-pad{padding:18px;}
.section-block{margin-bottom:16px;}
.header-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.f{display:flex;flex-direction:column;gap:4px;}
.field-label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
input,select,textarea{font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);width:100%;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;}
input[readonly]{background:#F6F5F1;color:var(--muted);}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.btn{font-family:inherit;font-weight:600;font-size:13px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);}
.btn.danger{background:var(--bad-dim);color:var(--bad);border-color:var(--bad-dim);}
.btn.ghost{background:transparent;}
.btn.small{padding:5px 10px;font-size:12px;}
table.rep-table{width:100%;border-collapse:collapse;}
.rep-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);}
.rep-table td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top;}
.rep-group-hd td{background:#F6F5F1;font-weight:700;font-size:12.5px;padding:8px 6px;}
.result-select.PASS{border-color:var(--brand);color:var(--brand);font-weight:700;}
.result-select.FAIL{border-color:var(--bad);color:var(--bad);font-weight:700;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;background:#E9E7DF;}
.badge.pass{background:var(--brand-dim);color:var(--brand);}
.badge.fail{background:var(--bad-dim);color:var(--bad);}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px;}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.k-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.k-value{font-size:20px;font-weight:700;margin-top:2px;}
.subtle-note{font-size:12px;color:var(--muted);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1F1D1A;color:#F1F0EA;padding:10px 18px;border-radius:8px;font-size:13px;z-index:50;}
.row-add-btn{margin-top:8px;}
.check{display:flex;align-items:center;gap:6px;font-size:13px;}
.overflow-x{overflow-x:auto;}
.grp-hd-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.grp-pic{display:flex;align-items:center;gap:6px;}
.grp-pic-thumbs{display:flex;gap:4px;}
.grp-pic-thumbs img{width:22px;height:22px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:pointer;}
.cam-btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;white-space:nowrap;}
.sign-table input{min-width:120px;}
</style>

<script>
/* ============================= REFERENCE DATA (ANSI-ASQ Z1.4 / ISO 2859-1, normal, single) ============================= */
const AQL_COLS = [0.010,0.015,0.025,0.040,0.065,0.10,0.15,0.25,0.40,0.65,1.0,1.5,2.5,4.0,6.5,10];
const CODE_LETTERS = ['A','B','C','D','E','F','G','H','J','K','L','M','N','P','Q','R'];
const CODE_SIZE = { A:2,B:3,C:5,D:8,E:13,F:20,G:32,H:50,J:80,K:125,L:200,M:315,N:500,P:800,Q:1250,R:2000 };
const CODE_ZERO_COL = { A:15,B:14,C:13,D:12,E:11,F:11,G:10,H:9,J:8,K:7,L:6,M:5,N:4,P:3,Q:2,R:1 };
const AC_SEQ = [0,1,2,3,5,7,10,14,21];
const LOT_BANDS = [
  {min:2,max:8,c:{'S-1':'A','S-2':'A','S-3':'A','S-4':'A','General I':'A','General II':'A','General III':'B'}},
  {min:9,max:15,c:{'S-1':'A','S-2':'A','S-3':'A','S-4':'A','General I':'A','General II':'B','General III':'C'}},
  {min:16,max:25,c:{'S-1':'A','S-2':'A','S-3':'B','S-4':'B','General I':'B','General II':'C','General III':'D'}},
  {min:26,max:50,c:{'S-1':'A','S-2':'B','S-3':'B','S-4':'C','General I':'C','General II':'D','General III':'E'}},
  {min:51,max:90,c:{'S-1':'B','S-2':'B','S-3':'C','S-4':'C','General I':'C','General II':'E','General III':'F'}},
  {min:91,max:150,c:{'S-1':'B','S-2':'B','S-3':'C','S-4':'D','General I':'D','General II':'F','General III':'G'}},
  {min:151,max:280,c:{'S-1':'B','S-2':'C','S-3':'D','S-4':'E','General I':'E','General II':'G','General III':'H'}},
  {min:281,max:500,c:{'S-1':'B','S-2':'C','S-3':'D','S-4':'E','General I':'F','General II':'H','General III':'J'}},
  {min:501,max:1200,c:{'S-1':'C','S-2':'C','S-3':'E','S-4':'F','General I':'G','General II':'J','General III':'K'}},
  {min:1201,max:3200,c:{'S-1':'C','S-2':'D','S-3':'E','S-4':'G','General I':'H','General II':'K','General III':'L'}},
  {min:3201,max:10000,c:{'S-1':'C','S-2':'D','S-3':'F','S-4':'G','General I':'J','General II':'L','General III':'M'}},
  {min:10001,max:35000,c:{'S-1':'C','S-2':'D','S-3':'F','S-4':'H','General I':'K','General II':'M','General III':'N'}},
  {min:35001,max:150000,c:{'S-1':'D','S-2':'E','S-3':'G','S-4':'J','General I':'L','General II':'N','General III':'P'}},
  {min:150001,max:500000,c:{'S-1':'D','S-2':'E','S-3':'G','S-4':'J','General I':'M','General II':'P','General III':'Q'}},
  {min:500001,max:Infinity,c:{'S-1':'D','S-2':'E','S-3':'H','S-4':'K','General I':'N','General II':'Q','General III':'R'}}
];
const AQL_OPTIONS = [0,0.065,0.10,0.15,0.25,0.40,0.65,1.0,1.5,2.5,4.0,6.5,10];
const INSPECTION_LEVELS = ['General I','General II','General III','S-1','S-2','S-3','S-4'];
const DEFECT_TYPES = ['Critical','Major','Minor'];
const DECISIONS = ['Accepted','Rework Required','Rejected'];

function codeLetterFor(lotSize, level){
  const q = Number(lotSize)||0;
  if (q < 2) return '';
  const band = LOT_BANDS.find(b => q >= b.min && q <= b.max);
  if (!band) return '';
  return band.c[level] || band.c['General II'];
}
function aqlColIndex(aql){
  const v = Number(aql); let best=0, bd=Infinity;
  AQL_COLS.forEach((c,i)=>{ const d=Math.abs(c-v); if(d<bd){bd=d;best=i;} });
  return best;
}
function singlePlan(codeLetter, aql){
  if (!codeLetter) return null;
  if (Number(aql) === 0) return { code:codeLetter, n:CODE_SIZE[codeLetter], ac:0, re:1 };
  const ai = aqlColIndex(aql);
  let ci = CODE_LETTERS.indexOf(codeLetter), guard=0;
  while (ci >= 0 && ci < CODE_LETTERS.length && guard++ < 40){
    const L = CODE_LETTERS[ci], k = ai - CODE_ZERO_COL[L];
    if (k < 0){ ci++; continue; }
    if (k > AC_SEQ.length-1){ ci--; continue; }
    return { code:L, n:CODE_SIZE[L], ac:AC_SEQ[k], re:AC_SEQ[k]+1 };
  }
  return null;
}
function computeAQL(lotQty, foundC, foundM, foundN, aqlC, aqlM, aqlN, level, noDefectsFound){
  level = level || 'General II';
  const lot = Number(lotQty)||0;
  const code = codeLetterFor(lot, level);
  const pC = singlePlan(code, aqlC), pM = singlePlan(code, aqlM), pN = singlePlan(code, aqlN);
  let sampleSize = Math.max(pC?pC.n:0, pM?pM.n:0, pN?pN.n:0);
  // Z1.4: when the plan's sample size is >= lot size, inspect the whole lot
  const planSample = sampleSize;
  const fullLot = lot > 0 && sampleSize > lot;
  if (fullLot) sampleSize = lot;
  const critAllowed = Number(aqlC)>0 ? (pC?pC.ac:0) : 0;
  const majAllowed = pM?pM.ac:0, minAllowed = pN?pN.ac:0;
  const fail = foundC > critAllowed || foundM > majAllowed || foundN > minAllowed;
  const anyFound = foundC||foundM||foundN;
  return { sampleSize, planSample, fullLot, codeLetter:code, critAllowed, majAllowed, minAllowed,
    result: anyFound ? (fail?'FAIL':'PASS') : (noDefectsFound ? 'PASS' : '') };
}

const QA_API_URL = "https://script.google.com/macros/s/AKfycbzZ2Kn-5XlYWyJL2x9eYwtuQwm9dWNX8okS47B4Bjh8OcMQkMhwuZEJapfPaW68ZVIZ/exec";
function qaApi(payload){ return window.ReportSync ? ReportSync.wrap(payload, qaApiRaw) : qaApiRaw(payload); }
async function qaApiRaw(payload){
  // Master Order lookups come from data/masterOrders.json (fast, static). Falls back to the backend below if unavailable.
  if (window.MasterOrder && payload && MasterOrder.handles(payload.action)) {
    const local = await MasterOrder.handle(payload, "qa");
    if (local) return local;
  }
  if (QA_API_URL.indexOf("PASTE_YOUR") === 0) throw new Error("Backend not connected yet");
  let lastErr=null;
  for (let attempt=1; attempt<=4; attempt++){
    try{
      const controller = new AbortController();
      const timeoutId = setTimeout(()=>controller.abort(), 15000);
      let res;
      try{
        res = await fetch(QA_API_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), signal:controller.signal });
      } finally { clearTimeout(timeoutId); }
      const rawText = await res.text();
      try{ return JSON.parse(rawText); }
      catch(e){ console.error('[qaApi] non-JSON (HTTP '+res.status+'):', rawText.slice(0,300)); throw new Error('non_json_response'); }
    }catch(e){
      lastErr = e; console.error('[qaApi] attempt '+attempt+' failed for "'+(payload&&payload.action)+'":', e);
      if (attempt<4) await new Promise(r=>setTimeout(r, attempt*1200));
    }
  }
  throw lastErr;
}
function isOwnReport_(r){ const t=(r&&r.header&&r.header.inspectionType)||''; return !t || t===INSPECTION_TYPE; }
async function loadReports(){
  try{
    const res = await qaApi({ action:"listSewingInline" });
    if (!res.ok) throw new Error(res.error||"Failed to load reports");
    state.reports = (Array.isArray(res.reports)?res.reports:[]).filter(isOwnReport_);
  }catch(e){
    try{ const raw = localStorage.getItem(MODULE_STORAGE_KEY); state.reports = (raw?JSON.parse(raw):[]).filter(isOwnReport_); }
    catch(e2){ state.reports=[]; }
    showToast('Could not reach server — showing this browser\'s last saved copy');
  }
  state.storageReady = true;
  loadSbuOptions();
  try{ render(); }catch(e){ console.error('[loadReports] render threw:', e); }
  autoPdfFromUrl_();
}
function stripPics_(r){
  const c = JSON.parse(JSON.stringify(r));
  Object.keys(c.groupPictures||{}).forEach(g => (c.groupPictures[g]||[]).forEach(p => { if (p.fileId) delete p.dataUrl; }));
  return c;
}

  }catch(e){
    try{ localStorage.setItem(MODULE_STORAGE_KEY, JSON.stringify(state.reports)); }catch(e2){}
    showToast('Could not reach server — saved to this browser only');

}

/* ---- Group-level photo capture (Documents Review / Product Appearance corners) ---- */
function picThumbSrc_(p){ return p.dataUrl || p.thumbUrl || p.url || ''; }
function compressImageToBase64(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('That file could not be read as an image.'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('That file could not be read.'));
    reader.readAsDataURL(file);
  });
}
async function handleGroupPictureUpload(group, file){
  showToast('Uploading photo\u2026');
  let dataUrl = null;
  try{ dataUrl = await compressImageToBase64(file, 1200, 0.7); }
  catch(e){ showToast('Could not read that photo \u2014 try a JPG or PNG.'); render(); return; }
  const base64 = dataUrl.split(',')[1];
  state.groupPictures[group] = state.groupPictures[group] || [];
  try{
    const res = await qaApi({ action:'uploadImage', base64:base64, filename:file.name, mimeType:'image/jpeg' });
    if (!res.ok) throw new Error(res.error||'Upload failed');
    state.groupPictures[group].push({ url:res.url, thumbUrl:res.thumbUrl, fileId:res.fileId, name:file.name, dataUrl:dataUrl });
  }catch(e){
    state.groupPictures[group].push({ url:'', thumbUrl:'', fileId:'', name:file.name, dataUrl:dataUrl, localOnly:true });
    showToast('Photo kept locally \u2014 could not reach Drive.');
  }
  render();
}
function groupPictureWidget(group){
  const pics = (state.groupPictures && state.groupPictures[group]) || [];
  return `
    <div class="grp-pic">
      <input type="file" accept="image/*" capture="environment" style="display:none" data-gpic-input="${esc(group)}">
      <button type="button" class="cam-btn" data-gpic-add="${esc(group)}">&#128247; ${pics.length ? pics.length+' photo'+(pics.length>1?'s':'') : 'Add Photo'}</button>
      <div class="grp-pic-thumbs">
        ${pics.map((p,pi)=>`<img src="${esc(picThumbSrc_(p))}" data-gpic-view="${esc(group)}:${pi}">`).join('')}
      </div>
    </div>`;
}
function defectTotals(){
  const t = { Critical:0, Major:0, Minor:0 };
  state.defects.forEach(d => { t[d.type] = (t[d.type]||0) + (Number(d.qty)||0); });
  return t;
}
function aqlFor(){
  const h = state.header, t = defectTotals();
  return computeAQL(h.lotQty, t.Critical, t.Major, t.Minor, h.aqlCritical, h.aqlMajor, h.aqlMinor, h.inspectionLevel, state.noDefectsFound);
}
function groupResult_(groupName){
  const rows = state.checklist.filter(c => c.group === groupName);
  const results = rows.map(r=>r.result).filter(Boolean);
  if (results.includes('Fail')) return 'Fail';
  if (results.length < rows.length) return 'Hold';
  return 'Pass';
}
function overallResult_(){
  const aql = aqlFor();
  const groupResults = SUMMARY_ROWS.map(r => groupResult_(r.group));
  const workResult = aql.result === 'FAIL' ? 'Fail' : (aql.result === 'PASS' ? 'Pass' : 'Hold');
  const all = groupResults.concat([workResult]);
  if (all.includes('Fail')) return 'Fail';
  if (all.includes('Hold')) return 'Hold';
  return 'Pass';
}

    <div class="overflow-x">
    <table class="rep-table">
      <thead><tr><th>Date</th><th>Buyer</th><th>Style</th><th>Line</th><th>Decision</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  </div>`;
}

/* ============================= EVENTS ============================= */
function bindEvents(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ state.tab=b.dataset.tab; render(); }));
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click', ()=>{ state.header.dataMode=b.dataset.mode; render(); }));

  document.querySelectorAll('[data-hf]').forEach(el=>el.addEventListener('change', ()=>{ state.header[el.dataset.hf]=el.value; render(); }));
  document.querySelectorAll('[data-hf-sel]').forEach(el=>el.addEventListener('change', ()=>{
    const key = el.dataset.hfSel;
    state.header[key] = el.value;
    if (key==='sbu'){ state.header.buyer=''; state.header.ir=''; loadBuyerOptions(el.value); }
    if (key==='buyer'){ state.header.ir=''; loadIrOptions(state.header.sbu, el.value); }
    if (key==='ir'){ loadStyleDetail(state.header.sbu, state.header.buyer, el.value); }
    render();
  }));
  document.querySelectorAll('[data-hf-num]').forEach(el=>el.addEventListener('change', ()=>{ state.header[el.dataset.hfNum]=Number(el.value); render(); }));
  document.querySelectorAll('[data-hf-sel2]').forEach(el=>el.addEventListener('change', ()=>{ state.header[el.dataset.hfSel2]=el.value; render(); }));

  document.querySelectorAll('[data-ck]').forEach(el=>{
    const evt = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      const [i,field] = el.dataset.ck.split(':');
      const row = state.checklist[Number(i)];
      row[field] = el.value;
      // Setting Status auto-fills Result (Yes->Pass, No->Fail, N/A->N/A) so a
      // row doesn't sit as "Hold" just because Result wasn't clicked too —
      // Result can still be corrected manually afterward.
      if (field === 'status' && STATUS_RESULT_MAP[el.value]) row.result = STATUS_RESULT_MAP[el.value];
      if (field === 'comments') return;   // typing: no re-render, keeps focus & scroll
      render();
    });
  });

  document.querySelectorAll('[data-gpic-add]').forEach(el=>el.addEventListener('click', ()=>{
    const input = document.querySelector(`[data-gpic-input="${CSS.escape(el.dataset.gpicAdd)}"]`);
    if (input) input.click();
  }));
  document.querySelectorAll('[data-gpic-input]').forEach(el=>el.addEventListener('change', (ev)=>{
    const file = ev.target.files && ev.target.files[0];
    if (file) handleGroupPictureUpload(el.dataset.gpicInput, file);
  }));
  document.querySelectorAll('[data-gpic-view]').forEach(el=>el.addEventListener('click', ()=>{
    const [group,pi] = el.dataset.gpicView.split(':');
    const p = (state.groupPictures[group]||[])[Number(pi)];
    if (p && p.url) window.open(p.url,'_blank');
  }));

  document.querySelectorAll('[data-so]').forEach(el=>el.addEventListener('input', ()=>{
    const [i,field] = el.dataset.so.split(':');
    state.signOff[Number(i)][field] = el.value;
  }));

  document.querySelectorAll('[data-df]').forEach(el=>{
    el.addEventListener('input', (ev)=>{ if (el.tagName==='INPUT') handleDf(el, ev); });
    el.addEventListener('change', (ev)=>{ handleDf(el, ev); });
    function handleDf(el, ev){
      const [i,field] = el.dataset.df.split(':');
      state.defects[Number(i)][field] = field==='qty' ? Number(el.value)||0 : el.value;
      if (field === 'name') return;       // typing: no re-render, keeps focus & scroll
      if (field === 'qty' && ev && ev.type==='input') return;
      if (ev && ev.type==='input') return;
      render();
    }
  });
  document.querySelectorAll('[data-remove-defect]').forEach(el=>el.addEventListener('click', ()=>{
    state.defects.splice(Number(el.dataset.removeDefect),1); render();
  }));
  const addDefectBtn = document.getElementById('addDefectBtn');
  if (addDefectBtn) addDefectBtn.addEventListener('click', ()=>{ state.defects.push({name:'',type:'Major',qty:1}); render(); });
  const noDefEl = document.getElementById('noDefectsFound');
  if (noDefEl) noDefEl.addEventListener('change', ()=>{ state.noDefectsFound = noDefEl.checked; render(); });

  const commentsEl = document.getElementById('f_comments');
  if (commentsEl) commentsEl.addEventListener('input', ()=>{ state.comments = commentsEl.value; });
  const decisionEl = document.getElementById('f_decision');
  if (decisionEl) decisionEl.addEventListener('change', ()=>{ state.decision = decisionEl.value; render(); });

  const saveBtn = document.getElementById('saveBtn');
  if (saveBtn) saveBtn.addEventListener('click', saveInspection);
  const pdfBtn = document.getElementById('pdfBtn');
  if (pdfBtn) pdfBtn.addEventListener('click', exportPdf);
  const newBtn = document.getElementById('newBtn');
  if (newBtn) newBtn.addEventListener('click', ()=>{
    if (confirm('Clear the current form and start a new inspection?')){
      Object.assign(state, emptyReportState());
      state.editingId = null;
      render();
    }
  });

  document.querySelectorAll('[data-view-report]').forEach(el=>el.addEventListener('click', ()=>{
    const r = state.reports.find(x=>x.id===el.dataset.viewReport);
    if (!r) return;
    openReport_(r);
  }));
  document.querySelectorAll('[data-delete-report]').forEach(el=>el.addEventListener('click', ()=>{
    if (!confirm('Delete this report? This cannot be undone.')) return;
    state.reports = state.reports.filter(x=>x.id!==el.dataset.deleteReport);
    persistReports(); render();
  }));
}

async function mirrorToStyleTracking_(report){
  const h = report.header;
  const statusMap = { 'Accepted':'Done', 'Rework Required':'In Progress', 'Rejected':'Open' };
  try{
    await qaApi({ action:'saveEntry', entry:{
      stage: STAGE_ID, orderNo:'', styleNo: h.styleName||'', irNo: h.ir||'',
      inspector: h.inspectorName||'', status: statusMap[report.decision] || 'In Progress',
      score: report.overall||'', notes: (report.decision||'') + (report.comments ? ' - '+report.comments : '')
    }});
  }catch(e){ console.error('[styleTracking mirror]', e); }
}

function openReport_(r){
  Object.assign(state, JSON.parse(JSON.stringify({ header:r.header, checklist:r.checklist, groupPictures:r.groupPictures||PHOTO_GROUPS.reduce((o,g)=>{o[g]=[];return o;},{}), defects:r.defects, noDefectsFound:r.noDefectsFound, comments:r.comments, decision:r.decision, signOff:r.signOff||SIGNOFF_ROLES.map(role=>({role,name:'',signature:''})) })));
  state.editingId = r.id;
  state.tab = 'entry';
  render();
}
// Style Tracking's "Download PDF" opens this page with ?pdf=<reportId>
async function autoPdfFromUrl_(){
  const id = new URLSearchParams(location.search).get('pdf');
  if (!id) return;
  const r = state.reports.find(x=>x.id===id);
  if (!r){ showToast('That report could not be found.'); return; }
  openReport_(r);
  showToast('Preparing PDF\u2026');
  try{ await exportPdf(); showToast('PDF downloaded.'); }catch(e){ console.error(e); showToast('Could not create the PDF.'); }
}

function saveInspection(){
  const h = state.header;
  if (!h.buyer || !h.line){ showToast('Please fill in at least Buyer and Line before saving.'); return; }
  const report = {
    id: state.editingId || ('r'+Date.now()),
    header: JSON.parse(JSON.stringify(h)),
    checklist: JSON.parse(JSON.stringify(state.checklist)),
    groupPictures: JSON.parse(JSON.stringify(state.groupPictures)),
    defects: JSON.parse(JSON.stringify(state.defects)),
    noDefectsFound: state.noDefectsFound,
    comments: state.comments,
    decision: state.decision,
    signOff: JSON.parse(JSON.stringify(state.signOff)),
    overall: overallResult_(),
    aql: (function(){ const a = aqlFor(), t = defectTotals();
      return { sampleSize:a.sampleSize, codeLetter:a.codeLetter, critAllowed:a.critAllowed, majAllowed:a.majAllowed, minAllowed:a.minAllowed,
               foundCritical:t.Critical, foundMajor:t.Major, foundMinor:t.Minor, result:a.result }; })(),
  };
  report.header.inspectionType = INSPECTION_TYPE;
  const idx = state.reports.findIndex(r=>r.id===report.id);
  const isNew = idx < 0;
  if (idx>=0) state.reports[idx]=report; else state.reports.push(report);
  state.editingId = report.id;
  persistReports();
  if (isNew) mirrorToStyleTracking_(report);
  showToast('Inspection saved.');
  render();
}

/* ============================= PDF EXPORT (professional, autoTable-based) ============================= */
function resultColor_(v){
  if (v==='Pass'||v==='PASS') return [230,238,232];
  if (v==='Fail'||v==='FAIL') return [246,228,222];
  return [255,255,255];
}
async function exportPdf(){
  // Photos saved earlier only keep a Drive id; pull them back for the PDF.
  for (const g of PHOTO_GROUPS){
    for (const p of (state.groupPictures[g]||[])){
      if (!p.dataUrl && p.fileId && !p._pdfData){
        try{ const r = await qaApi({ action:'fetchImageBase64', fileId:p.fileId }); if (r.ok) p._pdfData = 'data:'+(r.mimeType||'image/jpeg')+';base64,'+r.base64; }catch(e){}
      }
    }
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const marginX = 10;
  let y = 14;

  // ---- Letterhead ----
  const logoH = 17, logoW = logoH * 1.2427;
  try{ doc.addImage(JMF_LOGO, 'PNG', marginX, y-2, logoW, logoH); }catch(e){}
  const textX = marginX + logoW + 5;
  doc.setFontSize(16); doc.setFont(undefined,'bold');
  doc.text('J.M. FABRICS LIMITED', textX, y+5);
  doc.setFontSize(8.5); doc.setFont(undefined,'normal'); doc.setTextColor(90,88,82);
  doc.text('South Nayapara, 6 No Dogri, Bhawal Mirzapur, Gazipur.', textX, y+10.5);
  doc.setTextColor(0,0,0);
  y += logoH + 1;
  doc.setDrawColor(180,178,168); doc.setLineWidth(0.4);
  doc.line(marginX, y, pageW-marginX, y); y += 7;
  doc.setFontSize(13); doc.setFont(undefined,'bold');
  doc.text(INSPECTION_TYPE + ' Report', pageW/2, y, { align:'center' }); y += 7;
  doc.setFont(undefined,'normal');

  function sectionTitle(t){
    doc.setFontSize(10.5); doc.setFont(undefined,'bold');
    doc.setFillColor(246,245,241);
    doc.rect(marginX, y-4, pageW-marginX*2, 6.5, 'F');
    doc.text(t.toUpperCase(), marginX+2, y);
    doc.setFont(undefined,'normal');
    y += 6;
  }
  function afterTable(){ y = doc.lastAutoTable.finalY + 7; }
  function ensureSpace(min){ if (y > 297 - min){ doc.addPage(); y = 14; } }

  const h = state.header;

  // ---- Order Information ----
  sectionTitle('Order Information');
  doc.autoTable({
    startY: y, margin:{left:marginX, right:marginX}, theme:'grid',
    styles:{ fontSize:8.5, cellPadding:2 }, tableLineColor:[227,225,217], tableLineWidth:0.15,
    body: [
      ['SBU', h.sbu||'-', 'IR', h.ir||'-'],
      ['Buyer', h.buyer||'-', 'Style', h.styleName||'-'],
      ['Item', h.item||'-', 'Season', h.season||'-'],
      ['Order Qty', h.orderQty||'-', 'Product Dept', h.productDept||'-'],
      ['Line', h.line||'-', 'Size', h.size||'-'],
      ['Color', h.color||'-', 'Product Type', h.productType||'-'],
      ['Fiber / Composition', h.fiberComposition||'-', 'Style Description', h.styleDescription||'-'],
      ['Inspection Date', h.date||'-', 'Inspection Time', h.startTime||'-'],
      ['Inspected By', h.inspectorName||'-', 'Inspection Type', INSPECTION_TYPE],
    ],
    columnStyles:{ 0:{fontStyle:'bold', textColor:[114,111,104], cellWidth:38}, 2:{fontStyle:'bold', textColor:[114,111,104], cellWidth:38} },
  });
  afterTable(); ensureSpace(40);

  // ---- Sampling Plan & AQL ----
  const aql = aqlFor(); const t = defectTotals();
  sectionTitle('Sampling Plan & AQL  (ISO 2859-1 / ANSI-ASQ Z1.4 \u2014 Single, Normal Inspection)');
  doc.autoTable({
    startY: y, margin:{left:marginX, right:marginX}, theme:'grid', styles:{ fontSize:8.5, cellPadding:2 },
    head: [['Inspection Level', 'Lot Qty', 'Sample Size (code)', 'AQL Cr / Mj / Mn', 'AQL Result']],
    body: [[ h.inspectionLevel, h.lotQty||'-', (aql.sampleSize||'-') + ' (' + (aql.codeLetter||'-') + ')',
             h.aqlCritical+' / '+h.aqlMajor+' / '+h.aqlMinor, aql.result||'-' ]],
    headStyles:{ fillColor:[31,29,26], textColor:255, fontSize:8 },
    didParseCell: function(data){ if (data.section==='body' && data.column.index===4) data.cell.styles.fillColor = resultColor_(data.cell.raw); },
  });
  y = doc.lastAutoTable.finalY + 3;
  doc.autoTable({
    startY: y, margin:{left:marginX, right:marginX}, theme:'grid', styles:{ fontSize:8.5, cellPadding:2 },
    head: [['', 'Critical', 'Major', 'Minor']],
    body: [ ['Defect Allowed', aql.critAllowed, aql.majAllowed, aql.minAllowed], ['Found Defect', t.Critical, t.Major, t.Minor] ],
    headStyles:{ fillColor:[246,245,241], textColor:[31,29,26], fontSize:8 },
    columnStyles:{ 0:{fontStyle:'bold'} },
  });
  afterTable(); ensureSpace(40);

  // ---- Checklist (grouped) ----
  sectionTitle('Checklist');
  CHECKLIST_GROUPS.forEach(g => {
    ensureSpace(25);
    doc.setFontSize(9); doc.setFont(undefined,'bold');
    doc.text(g.group, marginX, y); y += 1;
    doc.setFont(undefined,'normal');
    const body = state.checklist.filter(c=>c.group===g.group).map(c=>[c.label, c.status||'-', c.result||'-', c.comments||'']);
    doc.autoTable({
      startY: y+2, margin:{left:marginX, right:marginX}, theme:'grid', styles:{ fontSize:8, cellPadding:1.8 },
      head: [['Check Point','Status','Result','Comments']],
      body: body,
      headStyles:{ fillColor:[246,245,241], textColor:[31,29,26], fontSize:7.5 },
      columnStyles:{ 0:{cellWidth:70}, 1:{cellWidth:18}, 2:{cellWidth:18} },
      didParseCell: function(data){ if (data.section==='body' && data.column.index===2) data.cell.styles.fillColor = resultColor_(data.cell.raw); },
    });
    y = doc.lastAutoTable.finalY + 5;
  });
  ensureSpace(40);

  // ---- Workmanship Findings ----
  sectionTitle('Workmanship Findings');
  if (!state.defects.length){
    doc.setFontSize(8.5); doc.text(state.noDefectsFound ? 'No workmanship defects found.' : 'No defects logged.', marginX, y); y += 6;
  } else {
    doc.autoTable({
      startY: y, margin:{left:marginX, right:marginX}, theme:'grid', styles:{ fontSize:8.5, cellPadding:2 },
      head: [['SL','Defect Name','Defect Type','Qty']],
      body: state.defects.map((d,i)=>[i+1, d.name||'-', d.type, d.qty||1]),
      headStyles:{ fillColor:[246,245,241], textColor:[31,29,26], fontSize:8 },
    });
    afterTable();
  }
  ensureSpace(30);

  // ---- Comments ----
  sectionTitle('Comments');
  doc.setFontSize(8.5);
  const commentLines = doc.splitTextToSize(state.comments || '-', pageW - marginX*2);
  doc.text(commentLines, marginX, y); y += commentLines.length*4.2 + 6;
  ensureSpace(60);

  // ---- Summary ----
  sectionTitle('Summary');
  const workResult = aql.result==='FAIL'?'Fail':(aql.result==='PASS'?'Pass':'Hold');
  const overall = overallResult_();
  doc.autoTable({
    startY: y, margin:{left:marginX, right:marginX}, theme:'grid', styles:{ fontSize:8.5, cellPadding:2 },
    head: [['Item','Result (Pass / Fail / Hold)']],
    body: SUMMARY_ROWS.map(sr=>[sr.label, groupResult_(sr.group)]).concat([['Workmanship', workResult],['Overall Result', overall]]),
    headStyles:{ fillColor:[31,29,26], textColor:255, fontSize:8 },
    didParseCell: function(data){
      if (data.section==='body' && data.column.index===1) data.cell.styles.fillColor = resultColor_(data.cell.raw);
      if (data.section==='body' && data.row.index === SUMMARY_ROWS.length+1) data.cell.styles.fontStyle = 'bold';
    },
  });
  y = doc.lastAutoTable.finalY + 3;
  doc.setFontSize(9.5); doc.setFont(undefined,'bold');
  doc.text('Decision: ' + (state.decision || '-'), marginX, y); y += 8;
  doc.setFont(undefined,'normal');
  ensureSpace(40);

  // ---- Sign-off ----
  sectionTitle('Acknowledgements & Sign-Off');
  doc.autoTable({
    startY: y, margin:{left:marginX, right:marginX}, theme:'grid', styles:{ fontSize:8.5, cellPadding:3, minCellHeight:10 },
    head: [['Role','Name','Signature / Date']],
    body: state.signOff.map(s=>[s.role, s.name||'', s.signature||'']),
    headStyles:{ fillColor:[246,245,241], textColor:[31,29,26], fontSize:8 },
  });
  y = doc.lastAutoTable.finalY + 10;

  // ---- Group photo appendix (Documents Review / Product Appearance) ----
  const anyPics = PHOTO_GROUPS.some(g => (state.groupPictures[g]||[]).length);
  if (anyPics){
    ensureSpace(50);
    sectionTitle('Photo Evidence');
    PHOTO_GROUPS.forEach(g => {
      const pics = state.groupPictures[g] || [];
      if (!pics.length) return;
      ensureSpace(45);
      doc.setFontSize(9); doc.setFont(undefined,'bold'); doc.text(g, marginX, y); doc.setFont(undefined,'normal'); y += 4;
      let x = marginX;
      pics.forEach(p => {
        if (x + 40 > pageW - marginX){ x = marginX; y += 34; ensureSpace(40); }
        try{ doc.addImage(p.dataUrl || p._pdfData, 'JPEG', x, y, 36, 30); }catch(e){}
        x += 40;
      });
      y += 36;
    });
  }

  // ---- Footer: generated timestamp ----
  const pageCount = doc.internal.getNumberOfPages();
  for (let p=1; p<=pageCount; p++){
    doc.setPage(p);
    doc.setFontSize(7.5); doc.setTextColor(150,148,140);
    doc.text('Generated ' + new Date().toLocaleString() + '  \u2014  Page ' + p + ' of ' + pageCount, pageW/2, 291, { align:'center' });
    doc.setTextColor(0,0,0);
  }

  doc.save((INSPECTION_TYPE.replace(/\s+/g,'_')) + '_' + (h.date||'') + '.pdf');
}

/* ============================= INIT ============================= */
if (!localStorage.getItem('tc_session')) { /* soft guard — page still works if opened directly during dev */ }
loadReports();
</script>
