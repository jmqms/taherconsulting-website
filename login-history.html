<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login History — Taher Consulting</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#F4F3EE;--panel:#fff;--ink:#1B211D;--soft:#5b655f;--line:#dcdad0;--accent:#1E6B4A;--gold:#A9832F;--bad:#B84226;--warn:#B7791F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
.top{background:#1B211D;color:#F1F0EA;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;letter-spacing:.04em}
.top a{color:#F1F0EA;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--soft);margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.panel h2{font-size:15px;margin:0 0 12px}
.signin{max-width:400px;margin:60px auto}
label{display:block;font-weight:600;font-size:13px;margin:0 0 6px}
input,select{width:100%;height:42px;padding:0 12px;border:1.5px solid #d4d6de;border-radius:10px;font:inherit;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.field{margin-bottom:16px;position:relative}
.pw input{padding-right:70px}
.pw button{position:absolute;right:6px;bottom:5px;border:none;background:none;color:var(--soft);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;cursor:pointer;border-radius:8px}
.pw button:hover{background:#f0f0ee;color:var(--ink)}
.btn{height:42px;padding:0 18px;border:none;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid #d4d6de}
.btn:disabled{opacity:.6;cursor:default}
.err{background:#fdecea;color:#b3261e;border:1px solid #f3b8b3;border-radius:10px;padding:10px 12px;margin-bottom:14px;display:none}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.filters .field{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .n{font-size:28px;font-weight:700;line-height:1.1}
.tile .l{color:var(--soft);font-size:12.5px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;background:#f1f0ea;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);padding:9px 10px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.pill.Success{background:#e1f3e8;color:#1E6B4A}.pill.Failed{background:#fdecea;color:#b3261e}.pill.Guest{background:#eee;color:#555}
.chip{display:inline-block;background:#f1f0ea;border-radius:6px;padding:1px 7px;margin:0 4px 3px 0;font-size:12px}
.muted{color:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
@media(max-width:600px){.wrap{padding:16px 12px}}
</style>
</head>
<body>
<div class="top"><span>TAHER CONSULTING &middot; ADMIN</span><a href="dashboard.html">&larr; Back to Dashboard</a></div>

<div class="wrap" id="signinView">
  <form class="panel signin" id="signinForm" autocomplete="off">
    <h1>Login History</h1>
    <p class="sub">Administrators only. Sign in with your main portal administrator ID.</p>
    <div class="err" id="siErr"></div>
    <div class="field"><label for="siUser">User ID</label><input id="siUser" placeholder="Enter ID" autocapitalize="off"></div>
    <div class="field pw"><label for="siPass">Password</label><input id="siPass" type="password" placeholder="Enter password"><button type="button" id="siToggle">Show</button></div>
    <button class="btn" id="siBtn" style="width:100%">View Login History</button>
  </form>
</div>

<div class="wrap" id="mainView" style="display:none">
  <div class="row" style="margin-bottom:16px">
    <div><h1>Login History</h1><p class="sub" style="margin:0">Who logged in, how many times, and which module — Bangladesh time. Only administrators can see this page.</p></div>
    <div style="display:flex;gap:8px"><button class="btn ghost" id="btnRefresh">Refresh</button><button class="btn ghost" id="btnCsv">Download CSV</button></div>
  </div>

  <div class="panel">
    <div class="filters">
      <div class="field"><label>From</label><input type="date" id="fFrom"></div>
      <div class="field"><label>To</label><input type="date" id="fTo"></div>
      <div class="field"><label>Module</label><select id="fModule"><option value="">All modules</option></select></div>
      <div class="field"><label>Result</label><select id="fResult"><option value="">All</option><option>Success</option><option>Failed</option><option>Guest</option></select></div>
      <div class="field"><label>User</label><input id="fUser" placeholder="ID or name"></div>
      <div class="field"><button class="btn ghost" id="btnClear" style="width:100%">Clear filters</button></div>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="panel"><h2>By user</h2><div class="scroll"><table id="tblUser"></table></div></div>
  <div class="panel"><h2>By module</h2><div class="scroll"><table id="tblMod"></table></div></div>
  <div class="panel"><div class="row"><h2 style="margin:0">Login log <span class="muted" style="font-weight:400" id="logCount"></span></h2></div>
    <div class="scroll" style="margin-top:10px"><table id="tblLog"></table></div>
    <div style="margin-top:12px"><button class="btn ghost" id="btnMore" style="display:none">Show more</button></div></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbx7Cwnp8hoKuxcQ57TlllwBaA7zr9S2bcFVi9-mzyyY8RhRL3YiUpbJMFohLmQZkf1a/exec";
let CREDS = null, ROWS = [], SHOWN = 200;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

$("siToggle").onclick = () => {
  const p = $("siPass"), show = p.type === "text";
  p.type = show ? "password" : "text"; $("siToggle").textContent = show ? "Show" : "Hide"; p.focus();
};
$("signinForm").onsubmit = async e => { e.preventDefault(); await load($("siUser").value, $("siPass").value, true); };
$("btnRefresh").onclick = () => load(CREDS.u, CREDS.p, false);

async function load(u, p, first) {
  const err = $("siErr"), btn = $("siBtn");
  err.style.display = "none";
  if (!String(u).trim() || !p) { err.textContent = "Enter your User ID and password."; err.style.display = "block"; return; }
  btn.disabled = true; btn.textContent = "Checking…";
  try {
    const res = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "loginHistory", userId: u, password: p, limit: 5000 }) });
    const d = JSON.parse(await res.text());
    if (!d.ok) throw new Error(d.error || "Could not load the history.");
    CREDS = { u, p }; ROWS = d.rows || [];
    if (first) { $("signinView").style.display = "none"; $("mainView").style.display = "block"; buildModuleOptions(); }
    render();
  } catch (x) {
    if (first) { err.textContent = x.message || "Could not reach the login server."; err.style.display = "block"; }
    else alert(x.message || "Could not refresh.");
  }
  btn.disabled = false; btn.textContent = "View Login History";
}

function buildModuleOptions() {
  const mods = [...new Set(ROWS.map(r => r.module).filter(Boolean))].sort();
  $("fModule").innerHTML = '<option value="">All modules</option>' + mods.map(m => `<option>${esc(m)}</option>`).join("");
}
["fFrom", "fTo", "fModule", "fResult", "fUser"].forEach(id => { $(id).oninput = () => { SHOWN = 200; render(); }; });
$("btnClear").onclick = () => { ["fFrom", "fTo", "fModule", "fResult", "fUser"].forEach(id => $(id).value = ""); SHOWN = 200; render(); };
$("btnMore").onclick = () => { SHOWN += 200; render(); };

function device(ua) {
  ua = String(ua || ""); if (!ua) return "";
  const b = /Edg\//.test(ua) ? "Edge" : /OPR\/|Opera/.test(ua) ? "Opera" : /Firefox\//.test(ua) ? "Firefox" : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "Browser";
  const o = /Android/.test(ua) ? "Android" : /iPhone|iPad|iOS/.test(ua) ? "iOS" : /Windows/.test(ua) ? "Windows" : /Mac OS/.test(ua) ? "Mac" : /Linux/.test(ua) ? "Linux" : "";
  return b + (o ? " · " + o : "") + (/Mobile/.test(ua) ? " (mobile)" : "");
}

function filtered() {
  const f = $("fFrom").value, t = $("fTo").value, m = $("fModule").value, rs = $("fResult").value, q = $("fUser").value.trim().toLowerCase();
  return ROWS.filter(r => {
    const day = String(r.time).slice(0, 10);
    if (f && day < f) return false; if (t && day > t) return false;
    if (m && r.module !== m) return false; if (rs && r.result !== rs) return false;
    if (q && !(String(r.userId).toLowerCase().includes(q) || String(r.name).toLowerCase().includes(q))) return false;
    return true;
  });
}

function render() {
  const rows = filtered();
  const ok = rows.filter(r => r.result === "Success");
  const today = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Dhaka" });
  const tile = (n, l) => `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  $("tiles").innerHTML = tile(ok.length, "Successful logins") + tile(new Set(ok.map(r => String(r.userId).toLowerCase())).size, "Different users") +
    tile(rows.filter(r => r.result === "Failed").length, "Failed attempts") + tile(rows.filter(r => r.result === "Guest").length, "Guest visits") +
    tile(ok.filter(r => String(r.time).slice(0, 10) === today).length, "Logins today");

  // by user
  const U = {};
  rows.forEach(r => {
    const k = String(r.userId).toLowerCase() || "(blank)";
    const u = U[k] || (U[k] = { id: r.userId, name: "", role: "", ok: 0, fail: 0, guest: 0, last: "", lastMod: "", mods: {} });
    if (r.name) u.name = r.name; if (r.role) u.role = r.role;
    if (r.result === "Success") { u.ok++; u.mods[r.module] = (u.mods[r.module] || 0) + 1; }
    else if (r.result === "Failed") u.fail++; else u.guest++;
    if (!u.last || r.time > u.last) { u.last = r.time; u.lastMod = r.module; }
  });
  const ul = Object.values(U).sort((a, b) => b.ok - a.ok || (b.last > a.last ? 1 : -1));
  $("tblUser").innerHTML = `<thead><tr><th>User ID</th><th>Name</th><th>Role</th><th>Logins</th><th>Failed</th><th>Last login</th><th>Modules used</th></tr></thead><tbody>` +
    (ul.length ? ul.map(u => `<tr><td><b>${esc(u.id)}</b></td><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td><b>${u.ok}</b>${u.guest ? ` <span class="muted">(+${u.guest} guest)</span>` : ""}</td><td>${u.fail || "-"}</td>
      <td>${esc(u.last)}<div class="muted">${esc(u.lastMod)}</div></td><td>${Object.entries(u.mods).sort((a, b) => b[1] - a[1]).map(([m, n]) => `<span class="chip">${esc(m)} × ${n}</span>`).join("")}</td></tr>`).join("")
      : `<tr><td colspan="7" class="muted">No logins match these filters.</td></tr>`) + "</tbody>";

  // by module
  const M = {};
  rows.forEach(r => {
    const m = M[r.module] || (M[r.module] = { ok: 0, fail: 0, guest: 0, users: new Set(), last: "" });
    if (r.result === "Success") { m.ok++; m.users.add(String(r.userId).toLowerCase()); } else if (r.result === "Failed") m.fail++; else m.guest++;
    if (!m.last || r.time > m.last) m.last = r.time;
  });
  const ml = Object.entries(M).sort((a, b) => b[1].ok - a[1].ok);
  $("tblMod").innerHTML = `<thead><tr><th>Module</th><th>Logins</th><th>Different users</th><th>Failed</th><th>Guest</th><th>Last used</th></tr></thead><tbody>` +
    (ml.length ? ml.map(([n, m]) => `<tr><td><b>${esc(n)}</b></td><td>${m.ok}</td><td>${m.users.size}</td><td>${m.fail || "-"}</td><td>${m.guest || "-"}</td><td>${esc(m.last)}</td></tr>`).join("") : `<tr><td colspan="6" class="muted">Nothing to show.</td></tr>`) + "</tbody>";

  // log
  $("logCount").textContent = "— " + rows.length + " entries";
  $("tblLog").innerHTML = `<thead><tr><th>Time (BD)</th><th>User ID</th><th>Name</th><th>Module</th><th>Result</th><th>Device</th></tr></thead><tbody>` +
    (rows.length ? rows.slice(0, SHOWN).map(r => `<tr><td style="white-space:nowrap">${esc(r.time)}</td><td>${esc(r.userId)}</td><td>${esc(r.name)}</td><td>${esc(r.module)}</td><td><span class="pill ${esc(r.result)}">${esc(r.result)}</span></td><td class="muted">${esc(device(r.device))}</td></tr>`).join("")
      : `<tr><td colspan="6" class="muted">No entries yet. Every login from now on is recorded here.</td></tr>`) + "</tbody>";
  $("btnMore").style.display = rows.length > SHOWN ? "inline-block" : "none";
}

$("btnCsv").onclick = () => {
  const rows = filtered();
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const csv = ["Time (BD),UserID,Name,Role,Module,Result,Device"].concat(rows.map(r => [r.time, r.userId, r.name, r.role, r.module, r.result, device(r.device)].map(q).join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = "login-history.csv"; a.click();
};
</script>
</body>
</html>
