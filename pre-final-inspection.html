<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pre-Final Inspection — Taher Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  /* Professional light palette, matching the Taher Consulting site
     (ink #1B211D / paper #F1F0EA / gold #A9832F) instead of the old
     near-black module theme. */
  --bg:#F1F0EA; --panel:#FFFFFF; --panel-2:#F6F5F0; --border:#D5D2C6; --border-soft:#E5E2D8;
  --text:#1B211D; --muted:#5E665F; --muted-2:#8B928B;
  --brand:#2F6E52; --brand-dim:#E4EDE7;
  --crit:#B84226; --crit-dim:#F7E6E1;
  --maj:#A9832F; --maj-dim:#F5EDD8;
  --min:#2C5A86; --min-dim:#E5EDF5;
  --good:#2F6E52;
  --radius:6px;
  --shadow: 0 1px 2px rgba(27,33,29,0.05), 0 6px 18px rgba(27,33,29,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;}
.mono{font-family:'IBM Plex Mono',monospace;}
.display{font-family:'Space Grotesk',sans-serif;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#C9C6BA;border-radius:8px;}
#app{max-width:1320px;margin:0 auto;padding:20px 22px 80px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--border-soft);}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:38px;height:38px;border-radius:9px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;color:#FFFFFF;font-size:13px;flex:none;}
.brand h1{font-family:'Space Grotesk';font-size:16.5px;font-weight:600;margin:0;letter-spacing:.2px;}
.brand .sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
.tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:9px;border:1px solid var(--border);}
.tab-btn{border:none;background:transparent;color:var(--muted);font-family:'Inter';font-weight:600;font-size:13px;padding:8px 15px;border-radius:8px;cursor:pointer;transition:.15s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{background:var(--text);color:#F1F0EA;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.panel-pad{padding:18px 20px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
h2.section-title{font-family:'Space Grotesk';font-size:14px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px;color:var(--text);}
h2.section-title .tag{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);font-weight:400;background:var(--panel-2);border:1px solid var(--border);padding:2px 7px;border-radius:5px;}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
@media (max-width:1000px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;}
.kpi .k-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.kpi .k-value{font-family:'Space Grotesk';font-size:26px;font-weight:700;margin-top:6px;}
.kpi .k-sub{font-size:11px;color:var(--muted-2);margin-top:3px;font-family:'IBM Plex Mono';}
.kpi .k-bar{position:absolute;left:0;top:0;bottom:0;width:3px;}
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px;}
@media (max-width:980px){.dash-grid{grid-template-columns:1fr;}}
.chart-wrap{position:relative;height:260px;}
.chart-wrap.tall{height:300px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
select, input[type=text], input[type=number], input[type=date], textarea{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 10px;font-family:'Inter';font-size:12.5px;outline:none;}
select:focus, input:focus, textarea:focus{border-color:var(--brand);}
.field-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;display:block;margin-bottom:5px;}
.dept-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.dept-toggle button{background:var(--panel-2);border:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer;font-family:'Inter';}
.dept-toggle button.active{background:var(--brand);color:#FFFFFF;}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .big{font-size:34px;margin-bottom:8px;}
.empty .t1{font-family:'Space Grotesk';font-size:15px;color:var(--text);font-weight:600;margin-bottom:4px;}
.empty .t2{font-size:12.5px;}
.btn{background:var(--brand);color:#FFFFFF;border:none;border-radius:8px;padding:9px 16px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:'Inter';transition:.15s;}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);font-weight:600;}
.btn.ghost:hover{border-color:var(--brand);}
.btn.danger{background:transparent;color:var(--crit);border:1px solid #E0C9C1;}
.btn.small{padding:5px 10px;font-size:11.5px;border-radius:6px;}
.header-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media (max-width:900px){.header-grid{grid-template-columns:repeat(2,1fr);}}
.header-grid .f{display:flex;flex-direction:column;}
.header-grid input, .header-grid select{width:100%;}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;color:#FFFFFF;}
.badge.pass{background:var(--good);color:#FFFFFF;}
.badge.fail{background:var(--crit);color:#fff;}
.aql-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0;}
.aql-cell{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:center;}
.aql-cell .al{font-size:10px;color:var(--muted);text-transform:uppercase;}
.aql-cell .av{font-family:'Space Grotesk';font-size:20px;font-weight:700;margin-top:3px;}
.defect-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.defect-row select{flex:2;min-width:220px;}
.defect-row select.sev{flex:1;min-width:100px;}
.defect-row input{flex:1;min-width:70px;}
table.log{width:100%;border-collapse:collapse;font-size:12.5px;}
table.log th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--border);font-weight:600;}
table.log td{padding:10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
table.log tr:hover td{background:rgba(27,33,29,0.03);}
.pill{font-family:'IBM Plex Mono';font-size:10.5px;padding:3px 8px;border-radius:100px;border:1px solid var(--border);}
.pill.prefinal{color:var(--min);border-color:#C2D3E4;background:var(--min-dim);}
.pill.final{color:#5B4B8A;border-color:#D3CBE6;background:#EEEAF7;}
.actions-cell{display:flex;gap:6px;}
.modal-bg{position:fixed;inset:0;background:rgba(27,33,29,0.45);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:8px;max-width:920px;width:100%;box-shadow:0 24px 50px rgba(27,33,29,0.22);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border-soft);}
.modal-body{padding:18px 20px;max-height:70vh;overflow:auto;}
.close-x{cursor:pointer;color:var(--muted);font-size:18px;background:none;border:none;}
.close-x:hover{color:var(--text);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#F1F0EA;border:1px solid var(--text);padding:11px 16px;border-radius:7px;font-size:12.5px;box-shadow:0 10px 26px rgba(27,33,29,.28);display:flex;align-items:center;gap:8px;z-index:100;}
.toast .d{width:7px;height:7px;border-radius:50%;background:var(--good);}
.subtle-note{font-size:11px;color:var(--muted-2);margin-top:8px;line-height:1.5;}
::placeholder{color:var(--muted-2);}
.pic-widget{display:flex;flex-direction:column;gap:6px;}
.pic-thumbs{display:flex;flex-wrap:wrap;gap:6px;}
.pic-thumb{position:relative;width:44px;height:44px;border-radius:6px;overflow:hidden;border:1px solid var(--border);}
.pic-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer;}
.pic-thumb .pic-del{position:absolute;top:0;right:0;background:rgba(27,33,29,.65);color:#fff;border:none;width:15px;height:15px;line-height:14px;font-size:11px;cursor:pointer;padding:0;}
.rep-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px;}
.rep-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--border);font-weight:600;}
.rep-table td{padding:7px 8px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
.rep-table input,.rep-table select,.rep-table textarea{width:100%;font-size:12px;padding:5px 7px;}
.rep-group-hd td{background:var(--panel-2);font-weight:700;color:var(--brand);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.result-select.PASS{color:var(--good);} .result-select.FAIL{color:var(--crit);}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.gallery figure{margin:0;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.gallery img{width:100%;height:110px;object-fit:cover;display:block;cursor:pointer;}
.gallery figcaption{font-size:10.5px;color:var(--muted);padding:6px 8px;}
.section-block{margin-bottom:16px;}
.row-add-btn{margin-top:8px;}
@media print{
  #tc-guard-bar,.topbar,.tabs,.filters,.btn,.close-x{display:none !important;}
  body{background:#fff;color:#000;}
  .panel,.modal{border:1px solid #ccc;box-shadow:none;background:#fff;color:#000;}
  .modal-bg{position:static;background:none;backdrop-filter:none;padding:0;}
}
body.pdf-mode #tc-guard-bar, body.pdf-mode .topbar, body.pdf-mode .tabs, body.pdf-mode .filters,
body.pdf-mode .btn, body.pdf-mode .close-x, body.pdf-mode input[type=file]{display:none !important;}
body.pdf-mode{background:#fff;color:#000;}
body.pdf-mode .panel, body.pdf-mode .modal{border:1px solid #ccc;box-shadow:none;background:#fff;color:#000;}
body.pdf-mode .rep-table th, body.pdf-mode .field-label{color:#555;}
/* Paired label/field rows, so 01. General Information reads exactly like the
   two-column layout of the master inspection workbook. */
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;}
@media (max-width:820px){.pair-grid{grid-template-columns:1fr;}}
.pair-grid .pair{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--border-soft);}
.pair-grid .pair > .pl{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.3;}
.pair-grid .pair input, .pair-grid .pair select{width:100%;}
.pair-grid .pair .hint{font-size:10px;color:var(--muted-2);display:block;font-weight:400;margin-top:1px;}
input[readonly]{background:var(--panel-2);color:var(--muted);}
</style>
</head>
<body>

<div id="tc-guard-bar" style="background:#1B211D;color:#F1F0EA;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.04em;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9999">
  <a href="dashboard.html" style="color:#F1F0EA;text-decoration:none">&larr; Back to Dashboard</a>
  <span>TAHER CONSULTING &middot; Module 7 &middot; Pre-Final Inspection</span>
  <span>
    <span id="tc-guard-user" style="color:#A9832F"></span>
    <span id="tc-guest-badge" style="display:none;background:#B84226;color:#F1F0EA;padding:3px 9px;border-radius:2px;margin-left:10px;font-size:10.5px;letter-spacing:.06em">VIEW ONLY &middot; GUEST</span>
  </span>
</div>
<script>
window.TC_IS_GUEST = false;
(function(){
  var raw = localStorage.getItem("tc_session") || sessionStorage.getItem("tc_session");
  if (!raw) {
    window.location.href = "login.html";
  } else {
    try {
      var s = JSON.parse(raw);
      window.TC_IS_GUEST = /guest|visitor/i.test(s.role || "");
      document.addEventListener("DOMContentLoaded", function(){
        var el = document.getElementById("tc-guard-user");
        if (el) el.textContent = s.name || "";
        var badge = document.getElementById("tc-guest-badge");
        if (badge && window.TC_IS_GUEST) badge.style.display = "inline-block";
      });
    } catch(e) {}
  }
})();
function tcBlockIfGuest(actionLabel) {
  if (window.TC_IS_GUEST) {
    alert("You're signed in as a Guest (View Only). " + (actionLabel || "This action") + " is disabled for guest accounts.\n\nAsk an administrator for a full account to " + (actionLabel ? actionLabel.toLowerCase() : "make changes") + ".");
    return true;
  }
  return false;
}
</script>

<script>
/* ============================= REFERENCE DATA ============================= */

/* ============================================================================
   ISO 2859-1 / ANSI-ASQ Z1.4 — sampling tables (single & double, normal)
   ----------------------------------------------------------------------------
   Table 1 gives the sample-size CODE LETTER from lot size x inspection level.
   Table 2-A gives sample size n and Ac/Re from code letter x AQL, with the
   standard arrow rule: if a cell has no plan, step DOWN a code letter (bigger
   sample) for AQLs that are too tight, or UP for AQLs that are too loose.
   Everything below is live data - edit a cell here if a buyer's chart differs.
   ========================================================================== */

// Full AQL column set of the master table (we expose a subset in the UI).
const AQL_COLS = [0.010,0.015,0.025,0.040,0.065,0.10,0.15,0.25,0.40,0.65,1.0,1.5,2.5,4.0,6.5,10];
const CODE_LETTERS = ['A','B','C','D','E','F','G','H','J','K','L','M','N','P','Q','R'];
const CODE_SIZE = { A:2,B:3,C:5,D:8,E:13,F:20,G:32,H:50,J:80,K:125,L:200,M:315,N:500,P:800,Q:1250,R:2000 };
// Column index (into AQL_COLS) where each code letter's Ac=0 / Re=1 plan sits.
// Everything to the LEFT of it is an arrow-down; 9 columns to the right is the
// Ac sequence below, after which it is an arrow-up.
const CODE_ZERO_COL = { A:15,B:14,C:13,D:12,E:11,F:11,G:10,H:9,J:8,K:7,L:6,M:5,N:4,P:3,Q:2,R:1 };
const AC_SEQ = [0,1,2,3,5,7,10,14,21];
// Table 3-A double sampling, indexed by (single Ac index - 1). n1 = n2 = the
// sample size one code letter below the single plan (approx 0.63 x n).
const DOUBLE_SEQ = [
  {ac1:0,re1:2,ac2:1,re2:2},{ac1:0,re1:3,ac2:3,re2:4},{ac1:1,re1:4,ac2:4,re2:5},
  {ac1:2,re1:5,ac2:6,re2:7},{ac1:3,re1:7,ac2:8,re2:9},{ac1:5,re1:9,ac2:12,re2:13},
  {ac1:7,re1:11,ac2:18,re2:19},{ac1:11,re1:16,ac2:26,re2:27}
];

// Table 1 - sample size code letters.
const LOT_BANDS = [
  {min:2,      max:8,       c:{'S-1':'A','S-2':'A','S-3':'A','S-4':'A','General I':'A','General II':'A','General III':'B'}},
  {min:9,      max:15,      c:{'S-1':'A','S-2':'A','S-3':'A','S-4':'A','General I':'A','General II':'B','General III':'C'}},
  {min:16,     max:25,      c:{'S-1':'A','S-2':'A','S-3':'B','S-4':'B','General I':'B','General II':'C','General III':'D'}},
  {min:26,     max:50,      c:{'S-1':'A','S-2':'B','S-3':'B','S-4':'C','General I':'C','General II':'D','General III':'E'}},
  {min:51,     max:90,      c:{'S-1':'B','S-2':'B','S-3':'C','S-4':'C','General I':'C','General II':'E','General III':'F'}},
  {min:91,     max:150,     c:{'S-1':'B','S-2':'B','S-3':'C','S-4':'D','General I':'D','General II':'F','General III':'G'}},
  {min:151,    max:280,     c:{'S-1':'B','S-2':'C','S-3':'D','S-4':'E','General I':'E','General II':'G','General III':'H'}},
  {min:281,    max:500,     c:{'S-1':'B','S-2':'C','S-3':'D','S-4':'E','General I':'F','General II':'H','General III':'J'}},
  {min:501,    max:1200,    c:{'S-1':'C','S-2':'C','S-3':'E','S-4':'F','General I':'G','General II':'J','General III':'K'}},
  {min:1201,   max:3200,    c:{'S-1':'C','S-2':'D','S-3':'E','S-4':'G','General I':'H','General II':'K','General III':'L'}},
  {min:3201,   max:10000,   c:{'S-1':'C','S-2':'D','S-3':'F','S-4':'G','General I':'J','General II':'L','General III':'M'}},
  {min:10001,  max:35000,   c:{'S-1':'C','S-2':'D','S-3':'F','S-4':'H','General I':'K','General II':'M','General III':'N'}},
  {min:35001,  max:150000,  c:{'S-1':'D','S-2':'E','S-3':'G','S-4':'J','General I':'L','General II':'N','General III':'P'}},
  {min:150001, max:500000,  c:{'S-1':'D','S-2':'E','S-3':'G','S-4':'J','General I':'M','General II':'P','General III':'Q'}},
  {min:500001, max:Infinity,c:{'S-1':'D','S-2':'E','S-3':'H','S-4':'K','General I':'N','General II':'Q','General III':'R'}}
];

const DEFECT_LIBRARY = [
  {category:'Assembling', code:'1C2-18', name:'Asymmetrical/Uneven or Deformed shape', sev:'Major'},
  {category:'Assembling', code:'1C2-16', name:'Uneven hem (Major >1/4", Minor <=1/4")', sev:'Minor'},
  {category:'Finishing', code:'1C4-8', name:'Oil stain', sev:'Major'},
  {category:'Finishing', code:'1C4-14', name:'Dirty/Glue/Pencil/Pen/Chalk mark, Dust', sev:'Minor'},
  {category:'Stitch and seam', code:'1C1-5', name:'Broken stitches on chain stitching', sev:'Major'},
  {category:'Stitch and seam', code:'1C1-4', name:'Skipped stitches on lock stitching', sev:'Major'},
  {category:'Fabric', code:'FAB-1', name:'Fabric defect (hole/slub/misweave)', sev:'Major'},
  {category:'Measurement', code:'MEAS-1', name:'Out of tolerance measurement', sev:'Major'},
  {category:'Labeling', code:'LBL-1', name:'Wrong or missing care/size label', sev:'Major'},
  {category:'Labeling', code:'LBL-2', name:'Missing/wrong component (label/button/print)', sev:'Critical'},
  {category:'Packing', code:'PACK-1', name:'Incorrect carton marking', sev:'Minor'},
  {category:'Others', code:'OTH-1', name:'Other defect (specify in remarks)', sev:'Minor'},

const SEV_META = {
  Critical:{label:'Critical', color:'var(--crit)', hex:'#B84226', dim:'var(--crit-dim)'},
  Major:{label:'Major', color:'var(--maj)', hex:'#A9832F', dim:'var(--maj-dim)'},
  Minor:{label:'Minor', color:'var(--min)', hex:'#2C5A86', dim:'var(--min-dim)'},
};

// ---- Report structure config (matches JMF_PreFinal_Final_Inspection_Report.xlsx) ----
const INSPECTION_TYPES = ['Pre-Final Inspection'];
const MODULE_KIND = 'prefinal';
const MODULE_STORAGE_KEY = 'prefinal-reports-fallback';
const SAMPLING_PLANS = ['Single','Double'];
const INSPECTION_LEVELS = ['General I','General II','General III','S-1','S-2','S-3','S-4'];
const AQL_OPTIONS = [0,0.065,0.1,0.15,0.25,0.4,0.65,1.0,1.5,2.5,4.0,6.5,10];
const DEFECT_GROUPS = ['Critical Red Flag','Group-A','Group-B','Group-C','Group-D'];
const DEFECT_CATEGORIES = ['Assembling / Sewing','Finishing','Stitch & Seam','Fabric / Material','Embellishment / Print / Trims','Measurement-related','Packing-related','Other'];
const SIGNOFF_ROLES = ['Inspector','Factory QA / Representative','Quality Manager (JMF)','Buyer / Client Representative'];

const QUANTITY_PACKING_CHECKPOINTS = [
  'Available Quantity Check (vs. Packing List / Order)','Shipment Quantity Tolerance (Short / Over shipment)',
  'Random Carton Selection','Carton Assortment, Dimensions & Weight','Outer Packaging Conformity (carton seal / tape)',
  'Shipping Front Marks','Shipping Side Marks','Carton Markings / Barcode Check','Retail Carton Sticker (if applicable)',
  'Unit Packing (polybag, folding, hangtag placement)','Inner Packing (if applicable)','PPS / Black Seal Availability',
  'PPS Approval Comment Availability','SHS / Gold Seal Availability (hard line only)','SHS Approval Comment Availability',
  'Sealed Good Cartons (after inspection)','Carton Drop Test','Country of Origin / Compliance Labelling'
];

// Same Google Apps Script + Sheet that powers the QA Process /
// Style Tracking dashboard — this tool reads its OrderInfo (SBU→
// Buyer→IR) master data and writes its results into the same
// spreadsheet, so Style Tracking's rollup sees Pre-Final/Final
// Inspection entries too.
const QA_API_URL = "https://script.google.com/macros/s/AKfycbyb327WgNo5OGXOyBTlkU0rWHMu9gx47SsZF3kwqAZ-ss40GosCB0OECvuzXNmPjd1l0g/exec";

// Apps Script can be briefly slow/overloaded (quota, cold start, a sheet
// someone has open for editing), which surfaces here as a failed fetch or a
// non-JSON response. Retry once before giving up, and log the real response
// body to the console so a persistent failure can actually be diagnosed.
async function qaApi(payload){
  if (QA_API_URL.indexOf("PASTE_YOUR") === 0) throw new Error("Backend not connected yet");
  let lastErr = null;
  for (let attempt = 1; attempt <= 2; attempt++){
    try{
      const res = await fetch(QA_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      const rawText = await res.text();
      try{
        return JSON.parse(rawText);
      }catch(parseErr){
        console.error('[qaApi] Unexpected response (HTTP ' + res.status + '):', rawText.slice(0, 300));
        throw new Error('non_json_response');
      }
    }catch(e){
      lastErr = e;
      console.error('[qaApi] Attempt ' + attempt + ' failed for action "' + (payload && payload.action) + '":', e);
      if (attempt < 2) await new Promise(r => setTimeout(r, 1000));
    }
  }
  throw lastErr;
}

// A report belongs to this module only if its inspection type is one this
// module issues. Stops Pre-Final and Final ever showing each other's data.
function isOwnReport_(r){
  const t = (r && r.header && r.header.inspectionType) || '';
  return !t || INSPECTION_TYPES.indexOf(t) !== -1;
}

async function loadReports(){
  try{
    const res = await qaApi({ action: "listPreFinal" });
    if (!res.ok) throw new Error(res.error || "Failed to load reports");
    state.reports = (Array.isArray(res.reports) ? res.reports : []).filter(isOwnReport_);
  }catch(e){
    try{
      const raw = localStorage.getItem(MODULE_STORAGE_KEY);
      state.reports = (raw ? JSON.parse(raw) : []).filter(isOwnReport_);
    }catch(e2){ state.reports = []; }
    showToast(QA_API_URL.indexOf("PASTE_YOUR")===0 ? 'Backend not connected yet — saving to this browser only' : 'Could not reach server — showing this browser\'s last saved copy');
  }
  state.storageReady = true;
  render();
  loadSbuOptions();
}

async function persistReports(){
  try{
    const res = await qaApi({ action: "savePreFinal", reports: state.reports });
    if (!res.ok) throw new Error(res.error || "Save failed");
  }catch(e){
    try{ localStorage.setItem(MODULE_STORAGE_KEY, JSON.stringify(state.reports)); }catch(e2){}
    showToast(QA_API_URL.indexOf("PASTE_YOUR")===0 ? 'Backend not connected yet — saved to this browser only' : 'Could not reach server — saved to this browser only');
  }
}

/* ============================= AQL LOGIC ============================= */

function codeLetterFor(lotSize, level){
  const q = Number(lotSize)||0;
  if (q < 2) return '';
  const band = LOT_BANDS.find(b => q >= b.min && q <= b.max);
  if (!band) return '';
  return band.c[level] || band.c['General II'];
}

function aqlColIndex(aql){
  const v = Number(aql);
  let best = 0, bd = Infinity;
  AQL_COLS.forEach((c,i)=>{ const d = Math.abs(c - v); if (d < bd){ bd = d; best = i; } });
  return best;
}

// Single sampling plan, normal inspection. Follows the arrows, so the returned
// code/n can differ from the starting code letter - that is the standard.
function singlePlan(codeLetter, aql){
  if (!codeLetter) return null;
  if (Number(aql) === 0){
    return { code: codeLetter, n: CODE_SIZE[codeLetter], ac: 0, re: 1, shifted:false, zeroTolerance:true };
  }
  const ai = aqlColIndex(aql);
  let ci = CODE_LETTERS.indexOf(codeLetter);
  const start = ci;
  let guard = 0;
  while (ci >= 0 && ci < CODE_LETTERS.length && guard++ < 40){
    const L = CODE_LETTERS[ci];
    const k = ai - CODE_ZERO_COL[L];
    if (k < 0){ ci++; continue; }
    if (k > AC_SEQ.length - 1){ ci--; continue; }
    return { code:L, n:CODE_SIZE[L], ac:AC_SEQ[k], re:AC_SEQ[k]+1, shifted: ci !== start };
  }
  return null;
}

function doublePlan(codeLetter, aql){
  const s = singlePlan(codeLetter, aql);
  if (!s) return null;
  const ci = CODE_LETTERS.indexOf(s.code);
  const n1 = ci > 0 ? CODE_SIZE[CODE_LETTERS[ci-1]] : CODE_SIZE[s.code];
  const k = AC_SEQ.indexOf(s.ac);
  const d = (k >= 1) ? DOUBLE_SEQ[k-1] : null;
  if (!d) return { code:s.code, n1:n1, n2:n1, unavailable:true, single:s };
  return { code:s.code, n1:n1, n2:n1, ac1:d.ac1, re1:d.re1, ac2:d.ac2, re2:d.re2, single:s };
}

function planLabel(p, isDouble){
  if (!p) return '-';
  if (isDouble){
    if (p.unavailable) return 'use single plan';
    return '1st ' + p.n1 + ' (Ac ' + p.ac1 + '/Re ' + p.re1 + ') - 2nd +' + p.n2 + ' (cum Ac ' + p.ac2 + '/Re ' + p.re2 + ')';
  }
  return p.n + ' pcs - Ac ' + p.ac + ' / Re ' + p.re;
}

// The lot size that sampling is drawn from: OFFER QTY first (that is what is
// actually presented for inspection), then available qty, then order qty.
function lotBasisQty(S){
  S = S || state;
  const h = S.header || {};
  const offer = Number(h.offerQty) || 0;
  if (offer > 0) return offer;
  const avail = (S.sampleOverview||[]).reduce((s,r)=>s+(Number(r.availableQty)||0),0);
  if (avail > 0) return avail;
  return Number(h.orderQty) || 0;
}

function computeAQL(lotQty, critical, major, minor, aqlCritical, aqlMajor, aqlMinor, level, plan){
  level = level || 'General II';
  plan  = plan  || 'Single';
  const lot  = Number(lotQty) || 0;
  const code = codeLetterFor(lot, level);
  const pC = singlePlan(code, aqlCritical);
  const pM = singlePlan(code, aqlMajor);
  const pN = singlePlan(code, aqlMinor);
  const sampleSize = Math.max(pC?pC.n:0, pM?pM.n:0, pN?pN.n:0);
  const criticalAllowed = Number(aqlCritical) > 0 ? (pC?pC.ac:0) : 0;
  const majorAllowed = pM ? pM.ac : 0;
  const minorAllowed = pN ? pN.ac : 0;
  const dbl = plan === 'Double'
    ? { critical: doublePlan(code, aqlCritical), major: doublePlan(code, aqlMajor), minor: doublePlan(code, aqlMinor) }
    : null;
  const fail = critical > criticalAllowed || major > majorAllowed || minor > minorAllowed;
  return {
    sampleSize: sampleSize, codeLetter: code, lotQty: lot, level: level, plan: plan,
    criticalAllowed: criticalAllowed, majorAllowed: majorAllowed, minorAllowed: minorAllowed,
    singlePlans: { critical:pC, major:pM, minor:pN }, doublePlans: dbl,
    result: (critical||major||minor) ? (fail ? 'FAIL' : 'PASS') : ''
  };
}

function aqlFor(S){
  S = S || state;
  const h = S.header, t = defectTotals(S.defects);
  return computeAQL(lotBasisQty(S), t.Critical, t.Major, t.Minor,
                    h.aqlCritical, h.aqlMajor, h.aqlMinor, h.inspectionLevel, h.samplingPlan);
}

/* ---- Measurement AQL (own inspection level, own sample size, auto Ac/Re) ---- */
function computeMeasurement(S){
  S = S || state;
  const h = S.header, m = S.measurements;
  const lot = lotBasisQty(S);
  const level = h.inspectionLevelMeasurements || 'S-2';
  const code = codeLetterFor(lot, level);
  const plan = singlePlan(code, h.aqlMajor) || { n:0, ac:0, re:1, code:code };
  const pieces = Number(m.pieceCount) || plan.n || 0;

  // One garment is "out of tolerance" if ANY of its POMs is outside spec.
  const pieceOot = [];
  for (let j = 0; j < pieces; j++){
    let bad = false;
    (m.poms||[]).forEach(p => {
      const v = p.m[j];
      if (v === '' || v === undefined || v === null) return;
      if (p.spec === '' || p.spec === undefined) return;
      const val = Number(v), spec = Number(p.spec);
      const lo = p.tolMinus !== '' && p.tolMinus !== undefined ? spec + Number(p.tolMinus) : null;
      const hi = p.tolPlus  !== '' && p.tolPlus  !== undefined ? spec + Number(p.tolPlus)  : null;
      if ((lo !== null && val < lo) || (hi !== null && val > hi)) bad = true;
    });
    pieceOot.push(bad);
  }
  const oot = pieceOot.filter(Boolean).length;

  // Total POM Readings Taken / POM Readings Out of Tolerance are entered
  // manually by the inspector rather than auto-counted from the table.
  const readings = (m.readingsManual === '' || m.readingsManual == null) ? 0 : (Number(m.readingsManual) || 0);
  const ootReadings = (m.ootReadingsManual === '' || m.ootReadingsManual == null) ? 0 : (Number(m.ootReadingsManual) || 0);

  const maxAllowed = plan.ac;
  const result = readings ? (oot <= maxAllowed ? 'PASS' : 'FAIL') : '';
  return {
    level: level, codeLetter: plan.code || code, sampleSize: plan.n, pieces: pieces,
    ac: plan.ac, re: plan.re, maxAllowed: maxAllowed,
    pieceOot: pieceOot, ootPieces: oot, readings: readings, ootReadings: ootReadings,
    pctOot: readings ? (ootReadings / readings * 100) : null, result: result
  };
}

// Keeps every POM row's measurement array the same width as the piece count.
function normalizeMeasurementColumns_(S){
  S = S || state;
  const m = S.measurements;
  if (!m) return;
  if (!m.pieceCount){
    const auto = computeMeasurement(S);
    m.pieceCount = Math.min(Math.max(auto.sampleSize || 5, 1), 15);
  }
  const n = Math.min(Math.max(Number(m.pieceCount) || 5, 1), 15);
  m.pieceCount = n;
  (m.poms||[]).forEach(p => {
    if (!Array.isArray(p.m)) p.m = [];
    while (p.m.length < n) p.m.push('');
    if (p.m.length > n) p.m = p.m.slice(0, n);
  });
}

function defectTotals(defects){
  const t = {Critical:0, Major:0, Minor:0};
  (defects||[]).forEach(d => { if (t[d.severity]!==undefined) t[d.severity] += Number(d.qty)||1; });
  return t;
}

// Prefer the in-session data URL (always renders), then Drive's thumbnail
// endpoint (renders in an <img>), and only then the plain Drive view link.
function picThumbSrc_(p){
  return p.dataUrl || p.thumbUrl || p.url || '';
}

function compressImageToBase64(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('That file could not be read as an image.'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('That file could not be read.'));
    reader.readAsDataURL(file);
  });
}

async function handlePictureUpload(section, idx, file){
  showToast('Uploading photo\u2026');
  let dataUrl = null;
  try{
    dataUrl = await compressImageToBase64(file, 1400, 0.7);
  }catch(e){
    showToast('Could not read that photo \u2014 try a JPG or PNG. (' + e.message + ')');
    render();
    return;
  }
  const base64 = dataUrl.split(',')[1];
  const target = resolvePictureTarget(section, idx);
  if (!target){ render(); return; }
  target.pictures = target.pictures || [];
  try{
    const res = await qaApi({ action: 'uploadImage', base64: base64, filename: file.name, mimeType: 'image/jpeg' });
    if (!res.ok) throw new Error(res.error || 'Upload failed');
    target.pictures.push({ url: res.url, thumbUrl: res.thumbUrl, fileId: res.fileId, name: file.name, dataUrl: dataUrl });
    showToast('Photo added.');
  }catch(e){
    // Keep the photo in the report even if Drive is unreachable - it still
    // renders on screen and still goes into the PDF for this session.
    target.pictures.push({ url:'', thumbUrl:'', fileId:'', name: file.name, dataUrl: dataUrl, localOnly:true });
    showToast('Photo kept locally \u2014 could not reach Drive (' + e.message + ')');
  }
  render();
}

function picsOf_(label, arr){ return (arr||[]).map(p => Object.assign({}, p, { label: label })); }

// Photos belonging to one report section, used to place them next to the
// matching section in the PDF rather than dumping them all at the end.
function sectionPics_(S, section){
  S = S || state;
  switch(section){
    case '01': return picsOf_('All Ready Carton', S.allQtyCheck.pictures);
    case '02': return picsOf_('Carton / Quantity Selection', (S.cartonQtySelection && S.cartonQtySelection.pictures) || []);
    case '03': return [].concat.apply([], S.packingCheckpoints.map(c => picsOf_(c.label, c.pictures)));
    case '04': return [].concat.apply([], S.defects.map((d,i) => picsOf_('Defect #' + (i+1) + (d.description ? ' \u2014 ' + d.description : ''), d.pictures)));
    case '05': return [].concat.apply([], S.testCheckpoints.map(c => picsOf_(c.label, c.pictures)));
    case '06': return picsOf_('Measurement Report', S.measurements.pictures);
  }
  return [];
}

// Same idea as sectionPics_, but keeps every checkpoint/option that CAN carry
// a photo - even ones with none attached yet - so the photo appendix at the
// end of the PDF lists every option and simply leaves the empty ones blank,
// instead of silently dropping them.
function sectionPicGroups_(S, section){
  S = S || state;
  switch(section){
    case '01': return [
        { label: 'All Ready Carton', pics: S.allQtyCheck.pictures || [] }
      ];
    case '02': return [{ label: 'Carton / Quantity Selection', pics: (S.cartonQtySelection && S.cartonQtySelection.pictures) || [] }];
    case '03': return S.packingCheckpoints.map(c => ({ label: c.label, pics: c.pictures || [] }));
    case '04': return S.defects.map((d,i) => ({ label: 'Defect #' + (i+1) + (d.description ? ' \u2014 ' + d.description : ''), pics: d.pictures || [] }));
    case '05': return S.testCheckpoints.map(c => ({ label: c.label, pics: c.pictures || [] }));
    case '06': return [{ label: 'Measurement Report', pics: S.measurements.pictures || [] }];
  }
  return [];
}

function collectAllPicturesFrom_(S){
  S = S || state;
  return ['01','02','03','04','05','06'].reduce((out, sec) => out.concat(sectionPics_(S, sec)), []);
}
function collectAllPictures(){ return collectAllPicturesFrom_(state); }

async function fetchImageBase64_(fileId){
  const res = await qaApi({ action: 'fetchImageBase64', fileId: fileId });
  if (!res.ok) throw new Error(res.error || 'Could not fetch image');
  return 'data:' + (res.mimeType || 'image/jpeg') + ';base64,' + res.base64;
}

// jsPDF is fussy about image encodings, and a photo straight off a phone can
// be a format it refuses ("picture could not be recognized"). Re-drawing every
// image through a canvas guarantees a plain baseline JPEG it will always take.
function normalizeToJpegDataUrl_(dataUrl){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try{
        const scale = Math.min(1, 1400 / (img.width || 1));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round((img.width||1) * scale));
        c.height = Math.max(1, Math.round((img.height||1) * scale));
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.75));
      }catch(err){ reject(err); }
    };
    img.onerror = () => reject(new Error('image decode failed'));
    img.src = dataUrl;
  });
}

const PIC_JPEG_CACHE = {};
async function picJpegDataUrl_(p){
  const key = p.fileId || p.url || p.name || JSON.stringify(p).slice(0, 60);
  if (PIC_JPEG_CACHE[key]) return PIC_JPEG_CACHE[key];
  let raw = p.dataUrl || null;
  if (!raw && p.fileId){
    try { raw = await fetchImageBase64_(p.fileId); } catch(e){ raw = null; }
  }
  if (!raw) return null;
  try {
    const jpeg = await normalizeToJpegDataUrl_(raw);
    PIC_JPEG_CACHE[key] = jpeg;
    return jpeg;
  } catch(e){ return null; }
}

// Strips the in-memory data URLs before a report is saved - the full image
// already lives in Drive, and keeping the copies would blow the row size.
function stripPictureData_(obj){
  if (Array.isArray(obj)) { obj.forEach(stripPictureData_); return obj; }
  if (obj && typeof obj === 'object'){
    if (Array.isArray(obj.pictures)) obj.pictures.forEach(p => { if (p && p.fileId) delete p.dataUrl; });
    Object.keys(obj).forEach(k => { if (k !== 'pictures') stripPictureData_(obj[k]); });
  }
  return obj;
}

function computeOverallResult_(S){
  S = S || state;
  const t = defectTotals(S.defects);
  const aql = aqlFor(S);
  const meas = computeMeasurement(S);
  const packingResults = S.packingCheckpoints.map(c=>c.result).filter(Boolean);
  const packingResult = packingResults.includes('Fail') ? 'FAIL' : (packingResults.length ? 'PASS' : 'N/A');
  const testResults = S.testCheckpoints.map(c=>c.result).filter(Boolean);
  const testsResult = testResults.includes('Fail') ? 'FAIL' : (testResults.length ? 'PASS' : 'N/A');
  const measResult = meas.result || 'N/A';
  const failCount = [packingResult, aql.result, testsResult, measResult].filter(r=>r==='FAIL').length;
  const anyResult = [packingResult, aql.result, testsResult, measResult].some(r=>r==='PASS'||r==='FAIL');
  return { overall: failCount > 0 ? 'FAIL' : (anyResult ? 'PASS' : 'PENDING'), aql, packingResult, testsResult, meas, measResult };
}

    if (S.remarks){
      heading('Overall Remarks');
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      const lines = doc.splitTextToSize(S.remarks, pageW - margin*2);
      ensureRoom(lines.length*4.5);
      doc.text(lines, margin, ctx.y); ctx.y += lines.length*4.5 + 4;
    }

    // ---------------- Photos & Attachments (all sections, at the end) ----------
    doc.addPage(); ctx.y = 16;
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(20,20,20);
    doc.text('Photos & Attachments', margin, ctx.y); ctx.y += 7;
    await photos('01', 'Photos \u2014 Quantity & Carton Selection');
    await photos('02', 'Photos \u2014 Carton & Quantity Selection');
    await photos('03', 'Photos \u2014 Quantity & Packing Checkpoints');
    await photos('05', 'Photos \u2014 Checkpoints & Tests');
    await photos('04', 'Photos \u2014 Defects');
    await photos('06', 'Photos \u2014 Measurement Report');

    // ---------------- Footer on every page ----------------------------------------
    const total = doc.internal.getNumberOfPages();
    for (let i = 1; i <= total; i++){
      doc.setPage(i);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(130,130,130);
      doc.text('J.M. FABRICS LTD. \u00b7 Pre-Shipment Inspection Report \u00b7 ' + (h.ir||'') + ' \u00b7 ' + (h.date||''), margin, pageH - 7);
      doc.text('Page ' + i + ' of ' + total, pageW - margin, pageH - 7, { align:'right' });
    }

    const name = `Pre-Shipment_Inspection_${(h.ir || 'report').replace(/[^a-zA-Z0-9]/g,'_')}_${h.date || ''}.pdf`;
    doc.save(name);
    showToast('PDF downloaded.');
  }catch(e){
    showToast('PDF generation failed \u2014 ' + e.message);
  }
}

function filteredReports(){
  let list = state.reports.slice();
  if (state.dashType !== 'All') list = list.filter(r => r.header.inspectionType === state.dashType);
  if (state.dashRange !== 'all'){
    const days = Number(state.dashRange);
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
    list = list.filter(r => new Date(r.header.date) >= cutoff);
  }
  return list.sort((a,b)=> new Date(b.header.date)-new Date(a.header.date));
}

    <div class="panel panel-pad"><h2 class="section-title">Defects by Severity</h2><div class="chart-wrap tall"><canvas id="sevDonut"></canvas></div></div>
  </div>

    <div class="panel panel-pad"><h2 class="section-title">Defect Pareto <span class="tag">top categories</span></h2><div class="chart-wrap tall"><canvas id="paretoChart"></canvas></div></div>

function drawDashboardCharts(){
  const reports = filteredReports();
  if (reports.length===0) return;
  Chart.defaults.color = '#5E665F';
  Chart.defaults.font.family = "'Inter', sans-serif";
  Chart.defaults.borderColor = '#E5E2D8';

  const byDate = {};
  reports.forEach(r=>{
    const d = r.header.date;
    if (!byDate[d]) byDate[d] = {pass:0,fail:0};
    byDate[d][r.result==='PASS'?'pass':'fail']++;
  });
  const dates = Object.keys(byDate).sort();
  new Chart(document.getElementById('trendChart'), {
    type:'bar',
    data:{ labels:dates, datasets:[
      {label:'Pass', data:dates.map(d=>byDate[d].pass), backgroundColor:'#2F6E52', borderRadius:3, stack:'s'},
      {label:'Fail', data:dates.map(d=>byDate[d].fail), backgroundColor:'#B84226', borderRadius:3, stack:'s'}
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'top', labels:{boxWidth:10,usePointStyle:true}}},
      scales:{ y:{beginAtZero:true, grid:{color:'#E5E2D8'}}, x:{grid:{display:false}, stacked:true }, x2:{} } }
  });

  let c=0,mj=0,mn=0;
  reports.forEach(r=>{ const t=defectTotals(r.defects); c+=t.Critical; mj+=t.Major; mn+=t.Minor; });
  new Chart(document.getElementById('sevDonut'), {
    type:'doughnut',
    data:{ labels:['Critical','Major','Minor'], datasets:[{ data:[c,mj,mn], backgroundColor:['#B84226','#A9832F','#2C5A86'], borderColor:'#FFFFFF', borderWidth:2 }]},
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'bottom', labels:{boxWidth:9,usePointStyle:true,font:{size:10.5}}}} }
  });

  const byCat = {};
  reports.forEach(r=> (r.defects||[]).forEach(d=>{ byCat[d.category] = (byCat[d.category]||0) + (Number(d.qty)||1); }));
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,8);
  new Chart(document.getElementById('paretoChart'), {
    type:'bar',
    data:{ labels: catEntries.map(e=>e[0]), datasets:[{ data: catEntries.map(e=>e[1]), backgroundColor:'#2F6E52', borderRadius:3 }]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ x:{beginAtZero:true, grid:{color:'#E5E2D8'}}, y:{grid:{display:false}} } }
  });
}

function renderSection00(h, aql){
  const isDouble = h.samplingPlan === 'Double';

              : ((state.sampleOverview||[]).reduce((s,r)=>s+(Number(r.availableQty)||0),0) > 0 ? 'Available Qty (Section 02)' : 'Order Qty');

  const P = isDouble ? (aql.doublePlans||{}) : (aql.singlePlans||{});
  const shifted = ['critical','major','minor'].some(k => {
    const p = (aql.singlePlans||{})[k];
    return p && p.shifted;

  const row = (sev, aqlVal, key) => {
    const p = P[key];
    const single = (aql.singlePlans||{})[key];
    return `<tr>

      <div class="f"><span class="field-label">AQL &mdash; Critical</span><select data-h="aqlCritical">${AQL_OPTIONS.map(o=>`<option value="${o}" ${Number(h.aqlCritical)===o?'selected':''}>${o}</option>`).join('')}</select></div>

/* ---- 06. MEASUREMENTS ---- */
function renderSection06(){
  const m = state.measurements;
  const meas = computeMeasurement(state);
  const n = meas.pieces;
  const pieceHead = Array.from({length:n}, (_,j)=>`<th style="${meas.pieceOot[j]?'color:var(--crit)':''}">#${j+1}</th>`).join('');

  const isOot = (p, j) => {
    const v = p.m[j];
    if (v === '' || v === undefined || v === null || p.spec === '' || p.spec === undefined) return false;
    const val = Number(v), spec = Number(p.spec);
    const lo = p.tolMinus !== '' && p.tolMinus !== undefined ? spec + Number(p.tolMinus) : null;
    const hi = p.tolPlus  !== '' && p.tolPlus  !== undefined ? spec + Number(p.tolPlus)  : null;
    return (lo !== null && val < lo) || (hi !== null && val > hi);
  };

  return `
  <div class="panel panel-pad section-block">
    <h2 class="section-title">06. Measurements <span class="tag">AQL ${esc(String(state.header.aqlMajor))} &middot; level ${esc(meas.level)} &middot; code ${esc(meas.codeLetter||'-')}</span></h2>

    <div class="row" style="align-items:flex-end;margin-bottom:10px;">
      <div class="f"><span class="field-label">Measurement Sample Size (auto, per AQL)</span><input type="text" value="${meas.sampleSize || '-'}" readonly></div>
      <div class="f"><span class="field-label">Pieces Measured (columns shown)</span><input type="number" min="1" max="15" data-mm="pieceCount" value="${esc(String(m.pieceCount||n))}"></div>
      <div class="f"><span class="field-label">Max Allowed OOT Pieces (auto, Ac)</span><input type="text" value="${meas.maxAllowed}" readonly></div>
    </div>

    <h3 class="section-title" style="font-size:12.5px;">Point-of-Measure (POM) Findings</h3>
    <div style="overflow-x:auto;">
    <table class="rep-table">
      <thead><tr><th>POM Description</th><th>Size</th><th>Tol (-)</th><th>Tol (+)</th><th>Spec</th>${pieceHead}<th>OOT?</th><th></th></tr></thead>
      <tbody>
        ${m.poms.map((p,i)=>`
          <tr>
            <td><input type="text" data-pom="${i}:description" value="${esc(p.description)}"></td>
            <td><input type="text" data-pom="${i}:size" value="${esc(p.size)}" style="width:50px"></td>
            <td><input type="number" step="0.01" data-pom="${i}:tolMinus" value="${esc(p.tolMinus)}" style="width:55px"></td>
            <td><input type="number" step="0.01" data-pom="${i}:tolPlus" value="${esc(p.tolPlus)}" style="width:55px"></td>
            <td><input type="number" step="0.01" data-pom="${i}:spec" value="${esc(p.spec)}" style="width:60px"></td>
            ${p.m.slice(0,n).map((v,mi)=>`<td><input type="number" step="0.01" data-pomm="${i}:${mi}" value="${esc(v)}" style="width:52px;${isOot(p,mi)?'color:var(--crit);font-weight:600;':''}"></td>`).join('')}
            <td>${p.m.slice(0,n).some((v,mi)=>isOot(p,mi)) ? `<span class="badge fail">OOT</span>` : ''}</td>
            <td>${m.poms.length>1?`<button type="button" class="btn danger small" data-pom-remove="${i}">&times;</button>`:''}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    </div>
    <button type="button" class="btn ghost small row-add-btn" data-action="add-pom-row">+ Add POM Row</button>

    <div class="row" style="align-items:flex-end;margin-top:14px;">
      <div class="f"><span class="field-label">Or Measurement Report Pictures</span>${pictureWidget('measurements', '0')}</div>
    </div>

    <h3 class="section-title" style="margin-top:20px;font-size:12.5px;">Measurement Summary <span class="tag">manual entry</span></h3>
    <div class="header-grid">
      <div class="f"><span class="field-label">Total Sample Size (Pcs)</span><input type="text" value="${meas.pieces}" readonly></div>
      <div class="f"><span class="field-label">Total POM Readings Taken</span><input type="number" data-mm="readingsManual" value="${esc(m.readingsManual)}"></div>
      <div class="f"><span class="field-label">POM Reading Out of Tolerance (Defective)</span><input type="number" data-mm="ootReadingsManual" value="${esc(m.ootReadingsManual)}"></div>
      <div class="f"><span class="field-label">Pieces Out of Tolerance (defective)</span><input type="text" value="${meas.ootPieces}" readonly></div>
      <div class="f"><span class="field-label">Max Allowed (per AQL)</span><input type="text" value="${meas.maxAllowed}" readonly></div>
      <div class="f"><span class="field-label">% POM Out of Tolerance</span><input type="text" value="${meas.pctOot!=null?fmt1(meas.pctOot)+'%':''}" readonly></div>
      <div class="f"><span class="field-label">Measurement Result (auto)</span><input type="text" value="${meas.result}" readonly></div>
    </div>
    <div class="subtle-note" style="margin-top:8px;">A piece counts as one measurement defective if <b>any</b> of its POMs falls outside tolerance &mdash; that count is what is compared against the Accept number, exactly as the AQL chart intends.</div>
  </div>`;
}

      <td>${esc(r.header.styleName)}</td>
      <td>${esc(r.header.ir)}</td>
      <td>${r.status==='Draft' ? '<span class="pill" style="color:var(--maj);border-color:#3a2a10;background:var(--maj-dim);">Draft</span>' : '<span class="pill" style="color:var(--good);border-color:#164a3a;background:#122a20;">Submitted</span>'}</td>
      <td><span class="badge ${r.result==='PASS'?'pass':r.result==='FAIL'?'fail':''}">${esc(r.result||'PENDING')}</span></td>
      <td class="actions-cell">
        <button class="btn ghost small" data-view="${r.id}">View</button>
        <button class="btn ghost small" data-edit="${r.id}">${r.status==='Draft'?'Resume':'Edit'}</button>
        <button class="btn ghost small" data-download-pdf-saved="${r.id}">PDF</button>
        <button class="btn danger small" data-delete="${r.id}">Delete</button>
      </td>
    </tr>`).join('');
  return `
  <div class="panel panel-pad">
    <h2 class="section-title">All Inspection Reports</h2>
    <table class="log">
      <tr><th>Date</th><th>Type</th><th>Buyer</th><th>Style</th><th>IR</th><th>Status</th><th>Result</th><th></th></tr>
      ${rows || '<tr><td colspan="8" class="subtle-note">No reports yet.</td></tr>'}
    </table>
  </div>`;
}

/* ============================= REPORT MODAL (view / print) ============================= */

function renderReportModal(){
  const r = state.reports.find(x=>x.id===state.viewingId);
  if (!r) return '';
  const t = defectTotals(r.defects);
  const defectRows = (r.defects||[]).map(d => `
    <tr><td>${esc(d.severity)}</td><td>${esc(d.category)}</td><td>${esc(d.description)}</td><td>${esc(d.area)}</td><td>${esc(d.qty)}</td></tr>`).join('');
  const pics = [];
  (r.packingCheckpoints||[]).forEach(cp => (cp.pictures||[]).forEach(p=>pics.push(p)));
  (r.testCheckpoints||[]).forEach(cp => (cp.pictures||[]).forEach(p=>pics.push(p)));
  (r.defects||[]).forEach(d => (d.pictures||[]).forEach(p=>pics.push(p)));
  (r.allQtyCheck && r.allQtyCheck.pictures || []).forEach(p=>pics.push(p));
  (r.styleOverviewPics && r.styleOverviewPics.pictures || []).forEach(p=>pics.push(p));
  (r.cartonSelection && r.cartonSelection.pictures || []).forEach(p=>pics.push(p));
  (r.cartonQtySelection && r.cartonQtySelection.pictures || []).forEach(p=>pics.push(p));
  (r.measurements && r.measurements.pictures || []).forEach(p=>pics.push(p));
  return `
  <div class="modal-bg" data-close-modal="1">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div><b>Inspection Report</b> <span class="badge ${r.result==='PASS'?'pass':r.result==='FAIL'?'fail':''}">${esc(r.result||'PENDING')}</span></div>
        <div>
          <button class="btn ghost small" data-download-pdf-saved="${r.id}">Download PDF</button>
          <button class="close-x" data-close-modal="1">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="header-grid">
          <div><div class="field-label">Type</div>${esc(r.header.inspectionType)}</div>
          <div><div class="field-label">Date</div>${esc(r.header.date)}</div>
          <div><div class="field-label">SBU</div>${esc(r.header.sbu)}</div>
          <div><div class="field-label">Buyer</div>${esc(r.header.buyer)}</div>
          <div><div class="field-label">IR No</div>${esc(r.header.ir)}</div>
          <div><div class="field-label">Style</div>${esc(r.header.styleName)}</div>
          <div><div class="field-label">Season</div>${esc(r.header.season)}</div>
          <div><div class="field-label">PO No</div>${esc(r.header.poNo)}</div>
          <div><div class="field-label">Sample Size</div>${esc(r.sampleSize)}</div>
          <div><div class="field-label">Inspector</div>${esc(r.header.inspectorName)}</div>
        </div>
        <h2 class="section-title" style="margin-top:20px;">Defects</h2>
        <table class="log"><tr><th>Severity</th><th>Category</th><th>Description</th><th>Area</th><th>Qty</th></tr>
        ${defectRows || '<tr><td colspan="5">No defects recorded.</td></tr>'}</table>
        ${pics.length ? `<h2 class="section-title" style="margin-top:20px;">Pictorial Evidence (${pics.length})</h2><div class="gallery">${pics.map(p=>`<figure><img src="${esc(picThumbSrc_(p))}" onclick="${p.url ? `window.open('${esc(p.url)}','_blank')` : ''}"></figure>`).join('')}</div>` : ''}
        <h2 class="section-title" style="margin-top:20px;">Overall Remarks</h2>
        <p>${esc(r.remarks)||'-'}</p>
      </div>
    </div>
  </div>`;
}

/* ============================= EVENTS ============================= */

function bindEvents(){
  document.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => { state.tab = el.dataset.tab; render(); });
  const gotoEntry = document.querySelector('[data-action="goto-entry"]');
  if (gotoEntry) gotoEntry.onclick = () => { state.tab='entry'; render(); };

  document.querySelectorAll('[data-dashtype]').forEach(el => el.onclick = () => { state.dashType = el.dataset.dashtype; render(); });
  const rangeSel = document.querySelector('[data-dashrange]');
  if (rangeSel) rangeSel.onchange = (e) => { state.dashRange = e.target.value; render(); };

  // ---- 01/general header ----
  document.querySelectorAll('[data-h]').forEach(el => el.onchange = (e) => {
    const key = el.dataset.h;
    const val = e.target.value;
    state.header[key] = val;
    if (key === 'sbu') {
      state.header.buyer = ''; state.header.ir = '';
      state.header.styleId = ''; state.header.styleName = ''; state.header.styleDescription = ''; state.header.item = '';
      state.header.productDept = ''; state.header.season = ''; state.header.actualOrderQty = ''; state.header.orderQty = ''; state.colorQty = [];
      loadBuyerOptions(val);
    } else if (key === 'buyer') {
      state.header.ir = '';
      state.header.styleId = ''; state.header.styleName = ''; state.header.styleDescription = ''; state.header.item = '';
      state.header.productDept = ''; state.header.season = ''; state.header.actualOrderQty = ''; state.header.orderQty = ''; state.colorQty = [];
      loadIrOptions(state.header.sbu, val);
    } else if (key === 'ir') {
      loadStyleDetail(state.header.sbu, state.header.buyer, val);
    } else {
      render();
    }
  });

  // ---- All Quantities / Carton Selection / Carton-Quantity Selection ----
  document.querySelectorAll('[data-aq]').forEach(el => el.onchange = (e) => { state.allQtyCheck[el.dataset.aq] = e.target.value; render(); });
  document.querySelectorAll('[data-cs]').forEach(el => el.onchange = (e) => { state.cartonSelection[el.dataset.cs] = e.target.value; render(); });
  document.querySelectorAll('[data-cqs]').forEach(el => el.onchange = (e) => { state.cartonQtySelection[el.dataset.cqs] = e.target.value; render(); });
  document.querySelectorAll('[data-cq]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.cq.split(':');
    state.colorQty[Number(i)][field] = e.target.value;
    render();
  });

  // ---- 02. Sample overview rows ----
  document.querySelectorAll('[data-so]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.so.split(':');
    state.sampleOverview[Number(i)][field] = e.target.value;
    render();
  });
  document.querySelectorAll('[data-so-remove]').forEach(el => el.onclick = () => {
    state.sampleOverview.splice(Number(el.dataset.soRemove), 1);
    render();
  });
  const addOverviewBtn = document.querySelector('[data-action="add-overview-row"]');
  if (addOverviewBtn) addOverviewBtn.onclick = () => {
    state.sampleOverview.push({ styleId:'', styleName:'', orderQty:'', availableQty:'', cartonsAvailable:'', cartonsSelected:'', actualSampleInspected:'', remarks:'' });
    render();
  };

  // ---- 03. Packing checkpoints / carton dims ----
  document.querySelectorAll('[data-pk]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.pk.split(':');
    state.packingCheckpoints[Number(i)][field] = e.target.value;
    render();
  });
  document.querySelectorAll('[data-cd]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.cd.split(':');
    state.cartonDims[Number(i)][field] = e.target.value;
    render();
  });
  document.querySelectorAll('[data-cd-remove]').forEach(el => el.onclick = () => {
    state.cartonDims.splice(Number(el.dataset.cdRemove), 1);
    render();
  });
  const addCartonDimBtn = document.querySelector('[data-action="add-cartondim-row"]');
  if (addCartonDimBtn) addCartonDimBtn.onclick = () => {
    state.cartonDims.push({ poNumber:'', cartonNo:'', dims:'', comments:'' });
    render();
  };

  // ---- 04. Defect log ----
  const addBtn = document.querySelector('[data-action="add-defect"]');
  if (addBtn) addBtn.onclick = () => {
    if (tcBlockIfGuest('Adding a defect')) return;
    state.defects.push({group:'Group-B',category:'Assembling / Sewing',description:'',area:'',severity:'Major',qty:1,pictures:[]});
    render();
  };
  document.querySelectorAll('[data-defect-pick]').forEach(el => el.onchange = (e) => {
    const i = Number(el.dataset.defectPick);
    if (!e.target.value) return;
    const [category,description,severity] = e.target.value.split('|||');
    Object.assign(state.defects[i], {category,description,severity});
    render();
  });
  document.querySelectorAll('[data-def]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.def.split(':');
    state.defects[Number(i)][field] = e.target.value;
    render();
  });
  document.querySelectorAll('[data-remove-defect]').forEach(el => el.onclick = () => {
    if (tcBlockIfGuest('Removing a defect')) return;
    state.defects.splice(Number(el.dataset.removeDefect),1);
    render();
  });

  // ---- 05. Test checkpoints ----
  document.querySelectorAll('[data-tc]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.tc.split(':');
    state.testCheckpoints[Number(i)][field] = e.target.value;
    render();
  });

  // ---- 06. Measurements ----
  document.querySelectorAll('[data-pom]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.pom.split(':');
    state.measurements.poms[Number(i)][field] = e.target.value;
    render();
  });
  document.querySelectorAll('[data-pomm]').forEach(el => el.onchange = (e) => {
    const [i, mi] = el.dataset.pomm.split(':');
    state.measurements.poms[Number(i)].m[Number(mi)] = e.target.value;
    render();
  });
  document.querySelectorAll('[data-pom-remove]').forEach(el => el.onclick = () => {
    state.measurements.poms.splice(Number(el.dataset.pomRemove), 1);
    render();
  });
  const addPomBtn = document.querySelector('[data-action="add-pom-row"]');
  if (addPomBtn) addPomBtn.onclick = () => {
    state.measurements.poms.push({ description:'', size:'', tolMinus:'', tolPlus:'', spec:'', m:[] });
    normalizeMeasurementColumns_();
    render();
  };
  document.querySelectorAll('[data-mm]').forEach(el => el.onchange = (e) => {
    state.measurements[el.dataset.mm] = el.dataset.mm === 'pieceCount' ? Math.min(Math.max(Number(e.target.value)||1,1),15) : e.target.value;
    normalizeMeasurementColumns_(state);
    render();
  });

  // ---- 08. Sign-off ----
  document.querySelectorAll('[data-so2]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.so2.split(':');
    state.signOff[Number(i)][field] = e.target.value;
  });

  // ---- Pictures (every section) ----
  document.querySelectorAll('[data-pic-add]').forEach(el => el.onclick = () => {
    document.querySelector(`[data-pic-input="${el.dataset.picAdd}"]`).click();
  });
  document.querySelectorAll('[data-pic-input]').forEach(el => el.onchange = async (e) => {
    if (tcBlockIfGuest('Adding a photo')) return;
    const [section, idx] = el.dataset.picInput.split(':');
    const file = e.target.files[0];
    if (!file) return;
    await handlePictureUpload(section, idx, file);
  });
  document.querySelectorAll('[data-pic-del]').forEach(el => el.onclick = () => {
    const [section, idx, pi] = el.dataset.picDel.split(':');
    const target = resolvePictureTarget(section, idx);
    if (target && target.pictures) target.pictures.splice(Number(pi), 1);
    render();
  });

  // ---- Save draft / submit final / PDF / cancel ----
  const draftBtn = document.querySelector('[data-action="save-draft"]');
  if (draftBtn) draftBtn.onclick = () => {
    if (tcBlockIfGuest('Saving a draft')) return;
    state.remarks = document.getElementById('f_remarks').value;
    saveCurrentReport_(false);
  };
  const submitBtn = document.querySelector('[data-action="submit-final"]');
  if (submitBtn) submitBtn.onclick = () => {
    if (tcBlockIfGuest('Submitting a report')) return;
    state.remarks = document.getElementById('f_remarks').value;
    saveCurrentReport_(true);
  };
  const pdfBtn = document.querySelector('[data-action="download-pdf"]');
  if (pdfBtn) pdfBtn.onclick = () => {
    state.remarks = document.getElementById('f_remarks').value;
    generatePdfReport();
  };
  const cancelBtn = document.querySelector('[data-action="cancel-edit"]');
  if (cancelBtn) cancelBtn.onclick = () => { resetEntryForm_(); render(); };

  document.querySelectorAll('[data-view]').forEach(el => el.onclick = () => { state.viewingId = el.dataset.view; render(); });
  document.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => {
    if (tcBlockIfGuest('Editing a report')) return;
    loadReportIntoForm_(el.dataset.edit);
  });
  document.querySelectorAll('[data-download-pdf-saved]').forEach(el => el.onclick = () => {
    loadReportIntoForm_(el.dataset.downloadPdfSaved, true);
  });
  document.querySelectorAll('[data-delete]').forEach(el => el.onclick = () => {
    if (tcBlockIfGuest('Deleting a report')) return;
    if (!confirm('Delete this report? This cannot be undone.')) return;
    state.reports = state.reports.filter(x=>x.id!==el.dataset.delete);
    persistReports();
    render();
  });
  document.querySelectorAll('[data-close-modal]').forEach(el => el.onclick = () => { state.viewingId = null; render(); });
}

function loadReportIntoForm_(reportId, thenDownloadPdf){
  const r = state.reports.find(x=>x.id===reportId);
  if (!r) return;
  Object.assign(state, emptyReportState(), JSON.parse(JSON.stringify(r)));
  state.editingId = r.id;
  state.tab = 'entry';
  state.viewingId = null;
  render();
  const h = state.header;
  const afterLoad = () => { if (thenDownloadPdf) generatePdfReport(); };
  if (h.sbu) {
    loadBuyerOptions(h.sbu).then(() => {
      if (h.buyer) loadIrOptions(h.sbu, h.buyer).then(() => {
        if (h.ir) loadStyleDetail(h.sbu, h.buyer, h.ir).then(afterLoad);
        else afterLoad();
      });
      else afterLoad();
    });
  } else afterLoad();
}

function resetEntryForm_(){
  Object.assign(state, emptyReportState());
  state.editingId = null;
  state.styleDetail = null;
  state.buyerOptions = []; state.irOptions = [];
}

async function saveCurrentReport_(isFinal){
  const { overall, aql } = computeOverallResult_();

  const record = Object.assign({}, JSON.parse(JSON.stringify(emptyReportState())), JSON.parse(JSON.stringify({
    header: state.header, allQtyCheck: state.allQtyCheck, cartonSelection: state.cartonSelection, colorQty: state.colorQty,
    sampleOverview: state.sampleOverview, styleOverviewPics: state.styleOverviewPics, cartonQtySelection: state.cartonQtySelection, packingCheckpoints: state.packingCheckpoints,
    cartonDims: state.cartonDims, defects: state.defects, testCheckpoints: state.testCheckpoints, measurements: state.measurements,
    signOff: state.signOff, remarks: state.remarks,
  })));
  stripPictureData_(record);
  record.id = state.editingId || uid();
  record.sampleSize = aql.sampleSize;
  record.result = overall === 'PENDING' ? (aql.result || 'PENDING') : overall;
  record.status = isFinal ? 'Submitted' : 'Draft';
  record.savedAt = new Date().toISOString();

  if (state.editingId){
    state.reports = state.reports.map(r => r.id===state.editingId ? record : r);
  } else {
    state.reports.push(record);
  }
  persistReports();

  if (isFinal){
    showToast('Report submitted — overall result: ' + record.result + '. Preparing PDF…');
    await generatePdfReport(record); // snapshot passed explicitly — the form gets reset right after
  } else {
    showToast('Draft saved — you can resume it any time from the Reports Log.');
  }
  resetEntryForm_();
  state.tab = 'log';
  render();
}

/* ============================= INIT ============================= */

// Pre-fill from Style Tracking's "+ Add Entry" link (?sbu=&buyer=&ir=)
(function applyUrlPrefill(){
  const p = new URLSearchParams(window.location.search);
  const sbu = p.get('sbu'), buyer = p.get('buyer'), ir = p.get('ir');
  if (!sbu && !buyer && !ir) return;
  state.tab = 'entry';
  if (sbu) state.header.sbu = sbu;
  if (buyer) state.header.buyer = buyer;
  if (ir) state.header.ir = ir;
})();

loadReports().then(() => {
  const h = state.header;
  if (h.sbu) loadBuyerOptions(h.sbu).then(() => {
    if (h.buyer) loadIrOptions(h.sbu, h.buyer).then(() => {
      if (h.ir) loadStyleDetail(h.sbu, h.buyer, h.ir);
    });
  });
});
</script>
