<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pre-Final Inspection — Taher Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#0F1216; --panel:#171B21; --panel-2:#1D222A; --border:#2A303B; --border-soft:#232833;
  --text:#E7EAEE; --muted:#8A93A3; --muted-2:#5E6675;
  --brand:#2DD4BF; --brand-dim:#164E48;
  --crit:#EF4444; --crit-dim:#3A1B1B;
  --maj:#F5A524; --maj-dim:#3A2A10;
  --min:#38BDF8; --min-dim:#132A38;
  --good:#34D399;
  --radius:10px;
  --shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:radial-gradient(1200px 500px at 90% -10%, rgba(45,212,191,0.06), transparent), var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;}
.mono{font-family:'IBM Plex Mono',monospace;}
.display{font-family:'Space Grotesk',sans-serif;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2A303B;border-radius:8px;}
#app{max-width:1320px;margin:0 auto;padding:20px 22px 80px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--border-soft);}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(155deg,var(--brand),#0EA5A0);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;color:#06201D;font-size:13px;box-shadow:0 4px 14px rgba(45,212,191,0.25);flex:none;}
.brand h1{font-family:'Space Grotesk';font-size:16.5px;font-weight:600;margin:0;letter-spacing:.2px;}
.brand .sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
.tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:11px;border:1px solid var(--border-soft);}
.tab-btn{border:none;background:transparent;color:var(--muted);font-family:'Inter';font-weight:600;font-size:13px;padding:8px 15px;border-radius:8px;cursor:pointer;transition:.15s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{background:var(--panel-2);color:var(--text);box-shadow:0 0 0 1px var(--border);}
.panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);box-shadow:var(--shadow);}
.panel-pad{padding:18px 20px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
h2.section-title{font-family:'Space Grotesk';font-size:14px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px;color:var(--text);}
h2.section-title .tag{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);font-weight:400;background:var(--panel-2);border:1px solid var(--border);padding:2px 7px;border-radius:5px;}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
@media (max-width:1000px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;}
.kpi .k-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.kpi .k-value{font-family:'Space Grotesk';font-size:26px;font-weight:700;margin-top:6px;}
.kpi .k-sub{font-size:11px;color:var(--muted-2);margin-top:3px;font-family:'IBM Plex Mono';}
.kpi .k-bar{position:absolute;left:0;top:0;bottom:0;width:3px;}
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px;}
@media (max-width:980px){.dash-grid{grid-template-columns:1fr;}}
.chart-wrap{position:relative;height:260px;}
.chart-wrap.tall{height:300px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
select, input[type=text], input[type=number], input[type=date], textarea{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 10px;font-family:'Inter';font-size:12.5px;outline:none;}
select:focus, input:focus, textarea:focus{border-color:var(--brand);}
.field-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;display:block;margin-bottom:5px;}
.dept-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.dept-toggle button{background:var(--panel-2);border:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer;font-family:'Inter';}
.dept-toggle button.active{background:var(--brand);color:#06201D;}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .big{font-size:34px;margin-bottom:8px;}
.empty .t1{font-family:'Space Grotesk';font-size:15px;color:var(--text);font-weight:600;margin-bottom:4px;}
.empty .t2{font-size:12.5px;}
.btn{background:var(--brand);color:#06201D;border:none;border-radius:8px;padding:9px 16px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:'Inter';transition:.15s;}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);font-weight:600;}
.btn.ghost:hover{border-color:var(--brand);}
.btn.danger{background:transparent;color:#F87171;border:1px solid #4A2323;}
.btn.small{padding:5px 10px;font-size:11.5px;border-radius:6px;}
.header-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media (max-width:900px){.header-grid{grid-template-columns:repeat(2,1fr);}}
.header-grid .f{display:flex;flex-direction:column;}
.header-grid input, .header-grid select{width:100%;}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;color:#06201D;}
.badge.pass{background:var(--good);}
.badge.fail{background:var(--crit);color:#fff;}
.aql-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0;}
.aql-cell{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:center;}
.aql-cell .al{font-size:10px;color:var(--muted);text-transform:uppercase;}
.aql-cell .av{font-family:'Space Grotesk';font-size:20px;font-weight:700;margin-top:3px;}
.defect-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.defect-row select{flex:2;min-width:220px;}
.defect-row select.sev{flex:1;min-width:100px;}
.defect-row input{flex:1;min-width:70px;}
table.log{width:100%;border-collapse:collapse;font-size:12.5px;}
table.log th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--border);font-weight:600;}
table.log td{padding:10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
table.log tr:hover td{background:rgba(255,255,255,0.015);}
.pill{font-family:'IBM Plex Mono';font-size:10.5px;padding:3px 8px;border-radius:100px;border:1px solid var(--border);}
.pill.prefinal{color:var(--min);border-color:#164450;background:var(--min-dim);}
.pill.final{color:#A78BFA;border-color:#332a55;background:#261F3D;}
.actions-cell{display:flex;gap:6px;}
.modal-bg{position:fixed;inset:0;background:rgba(6,8,11,0.7);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:920px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,0.5);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border-soft);}
.modal-body{padding:18px 20px;max-height:70vh;overflow:auto;}
.close-x{cursor:pointer;color:var(--muted);font-size:18px;background:none;border:none;}
.close-x:hover{color:var(--text);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel-2);border:1px solid var(--border);padding:11px 16px;border-radius:9px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;z-index:100;}
.toast .d{width:7px;height:7px;border-radius:50%;background:var(--good);}
.subtle-note{font-size:11px;color:var(--muted-2);margin-top:8px;line-height:1.5;}
::placeholder{color:var(--muted-2);}
.pic-widget{display:flex;flex-direction:column;gap:6px;}
.pic-thumbs{display:flex;flex-wrap:wrap;gap:6px;}
.pic-thumb{position:relative;width:44px;height:44px;border-radius:6px;overflow:hidden;border:1px solid var(--border);}
.pic-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer;}
.pic-thumb .pic-del{position:absolute;top:0;right:0;background:rgba(0,0,0,.6);color:#fff;border:none;width:15px;height:15px;line-height:14px;font-size:11px;cursor:pointer;padding:0;}
.rep-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px;}
.rep-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--border);font-weight:600;}
.rep-table td{padding:7px 8px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
.rep-table input,.rep-table select,.rep-table textarea{width:100%;font-size:12px;padding:5px 7px;}
.rep-group-hd td{background:var(--panel-2);font-weight:700;color:var(--brand);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.result-select.PASS{color:var(--good);} .result-select.FAIL{color:var(--crit);}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.gallery figure{margin:0;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.gallery img{width:100%;height:110px;object-fit:cover;display:block;cursor:pointer;}
.gallery figcaption{font-size:10.5px;color:var(--muted);padding:6px 8px;}
.section-block{margin-bottom:16px;}
.row-add-btn{margin-top:8px;}
@media print{
  #tc-guard-bar,.topbar,.tabs,.filters,.btn,.close-x{display:none !important;}
  body{background:#fff;color:#000;}
  .panel,.modal{border:1px solid #ccc;box-shadow:none;background:#fff;color:#000;}
  .modal-bg{position:static;background:none;backdrop-filter:none;padding:0;}
}
body.pdf-mode #tc-guard-bar, body.pdf-mode .topbar, body.pdf-mode .tabs, body.pdf-mode .filters,
body.pdf-mode .btn, body.pdf-mode .close-x, body.pdf-mode input[type=file]{display:none !important;}
body.pdf-mode{background:#fff;color:#000;}
body.pdf-mode .panel, body.pdf-mode .modal{border:1px solid #ccc;box-shadow:none;background:#fff;color:#000;}
body.pdf-mode .rep-table th, body.pdf-mode .field-label{color:#555;}
</style>
</head>

<div id="tc-guard-bar" style="background:#1B211D;color:#F1F0EA;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.04em;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9999">

  <span>
    <span id="tc-guard-user" style="color:#A9832F"></span>
    <span id="tc-guest-badge" style="display:none;background:#B84226;color:#F1F0EA;padding:3px 9px;border-radius:2px;margin-left:10px;font-size:10.5px;letter-spacing:.06em">VIEW ONLY &middot; GUEST</span>
  </span>
</div>
<script>
window.TC_IS_GUEST = false;
(function(){
  var raw = localStorage.getItem("tc_session") || sessionStorage.getItem("tc_session");
  if (!raw) {
    window.location.href = "login.html";
  } else {
    try {
      var s = JSON.parse(raw);
      window.TC_IS_GUEST = /guest|visitor/i.test(s.role || "");
      document.addEventListener("DOMContentLoaded", function(){
        var el = document.getElementById("tc-guard-user");
        if (el) el.textContent = s.name || "";
        var badge = document.getElementById("tc-guest-badge");
        if (badge && window.TC_IS_GUEST) badge.style.display = "inline-block";
      });
    } catch(e) {}
  }
})();
function tcBlockIfGuest(actionLabel) {
  if (window.TC_IS_GUEST) {
    alert("You're signed in as a Guest (View Only). " + (actionLabel || "This action") + " is disabled for guest accounts.\n\nAsk an administrator for a full account to " + (actionLabel ? actionLabel.toLowerCase() : "make changes") + ".");
    return true;
  }
  return false;
}
</script>

/* ============================= AQL LOGIC ============================= */

function lookupSampleSize(qty){
  const row = AQL_LOT_TABLE.find(r => qty >= r.min && qty <= r.max);
  return row || {code:'', size:0};
}

function lookupAcceptReject(sampleSize){
  const candidates = AQL_ACCEPT_TABLE.filter(r => r.size <= sampleSize);
  return candidates.length ? candidates[candidates.length-1] : AQL_ACCEPT_TABLE[0];
}

function nearestAqlColumn(aql){
  const supported = [1.0,1.5,2.5,4.0];
  let best = supported[0], bestDiff = Infinity;
  supported.forEach(v => { const d = Math.abs(v - Number(aql)); if (d < bestDiff){ bestDiff = d; best = v; } });
  return best;
}
function acceptForAql(acc, aql){
  const col = nearestAqlColumn(aql);
  if (col === 1.0) return acc.a1_0;
  if (col === 1.5) return acc.a1_5;
  if (col === 2.5) return acc.a2_5;
  return acc.a4_0;
}

function computeAQL(availableQty, critical, major, minor, aqlCritical, aqlMajor, aqlMinor){
  const lot = lookupSampleSize(Number(availableQty)||0);
  const acc = lookupAcceptReject(lot.size);
  const criticalAllowed = Number(aqlCritical) > 0 ? acceptForAql(acc, aqlCritical) : 0;
  const majorAllowed = acceptForAql(acc, aqlMajor != null ? aqlMajor : 2.5);
  const minorAllowed = acceptForAql(acc, aqlMinor != null ? aqlMinor : 4.0);
  const fail = critical > criticalAllowed || major > majorAllowed || minor > minorAllowed;
  return { sampleSize: lot.size, codeLetter: lot.code, criticalAllowed, majorAllowed, minorAllowed, result: (critical||major||minor) ? (fail ? 'FAIL' : 'PASS') : '' };
}

function defectTotals(defects){
  const t = {Critical:0, Major:0, Minor:0};
  (defects||[]).forEach(d => { if (t[d.severity]!==undefined) t[d.severity] += Number(d.qty)||1; });
  return t;
}

function compressImageToBase64(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePictureUpload(section, idx, file){
  showToast('Uploading photo…');
  try{
    const base64 = await compressImageToBase64(file, 1000, 0.62);
    const res = await qaApi({ action: 'uploadImage', base64: base64, filename: file.name, mimeType: 'image/jpeg' });
    if (!res.ok) throw new Error(res.error || 'Upload failed');
    const target = resolvePictureTarget(section, idx);
    if (target){ target.pictures = target.pictures || []; target.pictures.push({ url: res.url, fileId: res.fileId, name: file.name }); }

  }catch(e){
    showToast('Could not upload photo — ' + e.message);
  }
  render();
}

/* ============================= PDF EXPORT (professional, generated from data) ============================= */

function computeOverallResult_(S){
  S = S || state;
  const t = defectTotals(S.defects);
  const totalAvail = S.sampleOverview.reduce((s,r)=>s+(Number(r.availableQty)||0),0) || S.header.orderQty;
  const aql = computeAQL(totalAvail, t.Critical, t.Major, t.Minor, S.header.aqlCritical, S.header.aqlMajor, S.header.aqlMinor);
  const packingResults = S.packingCheckpoints.map(c=>c.result).filter(Boolean);
  const packingResult = packingResults.includes('Fail') ? 'FAIL' : (packingResults.length ? 'PASS' : 'N/A');
  const testResults = S.testCheckpoints.map(c=>c.result).filter(Boolean);
  const testsResult = testResults.includes('Fail') ? 'FAIL' : (testResults.length ? 'PASS' : 'N/A');
  const failCount = [packingResult, aql.result, testsResult].filter(r=>r==='FAIL').length;
  const anyResult = [packingResult, aql.result, testsResult].some(r=>r==='PASS'||r==='FAIL');
  return { overall: failCount > 0 ? 'FAIL' : (anyResult ? 'PASS' : 'PENDING'), aql, packingResult, testsResult };
}

function collectAllPicturesFrom_(S){
  S = S || state;
  const out = [];
  const push = (label, pics) => (pics||[]).forEach(p => out.push({ label, url: p.url, fileId: p.fileId }));
  push('All Quantities & Cartons Available', S.allQtyCheck.pictures);
  push('Selected Carton', S.cartonSelection.pictures);
  S.packingCheckpoints.forEach(cp => push(cp.label, cp.pictures));
  S.testCheckpoints.forEach(cp => push(cp.label, cp.pictures));
  S.defects.forEach((d,i) => push('Defect #' + (i+1) + (d.description ? ' — ' + d.description : ''), d.pictures));
  push('Measurement Report', S.measurements.pictures);
  return out;
}

async function generatePdfReport(srcData){
  const S = srcData || state;
  if (!window.jspdf){ showToast('PDF library did not load — check your internet connection and retry.'); return; }
  showToast('Generating PDF…');
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p','mm','a4');
    const pageW = doc.internal.pageSize.getWidth();

    const margin = 12;
    let y = 16;
    const h = S.header;
    const { overall, aql, packingResult, testsResult } = computeOverallResult_(S);

    function ensureRoom(need){ if (y + need > pageH - 14){ doc.addPage(); y = 16; } }
    function heading(text){
      ensureRoom(12);
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(20,20,20);
      doc.text(text, margin, y); y += 5.5;
    }
    function note(text){
      ensureRoom(8);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(90,90,90);
      doc.text(text, margin, y); y += 5;
    }
    function table(opts){
      ensureRoom(14);
      doc.autoTable(Object.assign({ startY: y, margin: { left: margin, right: margin }, styles: { fontSize: 8.5, cellPadding: 1.6 } }, opts));
      y = doc.lastAutoTable.finalY + 6;
    }

    // ---- Title ----
    doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(20,20,20);
    doc.text('Taher Consulting', margin, y); y += 6.5;
    doc.setFontSize(11); doc.setFont('helvetica','normal');
    doc.text(h.inspectionType || 'Pre-Final Inspection Report', margin, y); y += 5;
    doc.setDrawColor(210); doc.line(margin, y, pageW-margin, y); y += 6;

    table({ theme:'plain', body:[
      ['SBU', h.sbu||'—', 'Buyer', h.buyer||'—'],
      ['IR No', h.ir||'—', 'Style', h.styleName||'—'],
      ['Season', h.season||'—', 'Item / Dept', [h.item,h.productDept].filter(Boolean).join(' / ')||'—'],
      ['Date', h.date||'—', 'Inspector', h.inspectorName||'—'],
      ['Factory', h.factoryName||'—', 'PO No', h.poNo||'—'],
    ], columnStyles:{0:{fontStyle:'bold',cellWidth:26},2:{fontStyle:'bold',cellWidth:26}} });

    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.setTextColor(overall==='FAIL'?200:overall==='PASS'?20:120, overall==='PASS'?120:overall==='FAIL'?30:120, 20);
    ensureRoom(8);
    doc.text('OVERALL RESULT: ' + overall, margin, y); y += 8;
    doc.setTextColor(20,20,20);

    // ---- 01 quantities & AQL ----
    heading('01. General Information');
    table({ theme:'grid', head:[['PO Qty','Order Qty','Offer Qty','AQL Crit','AQL Major','AQL Minor','Sample Size']],
      body:[[h.poQty||'—',h.orderQty||'—',h.offerQty||'—',h.aqlCritical,h.aqlMajor,h.aqlMinor, aql.sampleSize+' (code '+aql.codeLetter+')']] });
    if (S.allQtyCheck.result || S.allQtyCheck.comments){
      table({ theme:'plain', body:[['All Qty/Cartons Available', S.allQtyCheck.result||'—', S.allQtyCheck.comments||'']] });
    }
    if (S.colorQty.length){
      table({ theme:'grid', head:[['Color','Order Qty','Carton Qty','Selected Carton No.']],
        body: S.colorQty.map(c=>[c.color,c.qty,c.cartonQty||'—',c.selectedCartonNo||'—']) });
    }

    // ---- 02 sample overview ----
    heading('02. Sample Selection & AQL Plan');
    table({ theme:'grid', head:[['Style ID','Style Name','Order Qty','Avail. Qty','Cartons Avail.','Cartons Sel.','Sample Insp.','Remarks']],
      body: S.sampleOverview.map(r=>[r.styleId,r.styleName,r.orderQty,r.availableQty,r.cartonsAvailable,r.cartonsSelected,r.actualSampleInspected,r.remarks]) });

    // ---- 03 packing checkpoints ----
    heading('03. Quantity & Packing Checkpoints — Section Result: ' + packingResult);
    table({ theme:'grid', head:[['Checkpoint','Result','Comments']],
      body: S.packingCheckpoints.map(c=>[c.label,c.result||'—',c.comments||'']),
      columnStyles:{0:{cellWidth:80}} });
    if (S.cartonDims.some(r=>r.poNumber||r.cartonNo||r.dims)){

        body: S.cartonDims.map(r=>[r.poNumber,r.cartonNo,r.dims,r.comments]) });

    table({ theme:'grid', head:[['Group','Checkpoint / Test','Applicable','Result','Comments / Report #']],

    ]});
    table({ theme:'grid', head:[['Role','Name','Signature / Date']],
      body: S.signOff.map(s=>[s.role,s.name||'—',s.signature||'—']) });
    if (S.remarks){
      heading('Overall Remarks');
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      const lines = doc.splitTextToSize(S.remarks, pageW - margin*2);
      ensureRoom(lines.length*4.5);
      doc.text(lines, margin, y); y += lines.length*4.5 + 4;
    }

    // ---- 07 pictorial evidence (fetched server-side to dodge Drive CORS) ----
    const pics = collectAllPicturesFrom_(S);
    if (pics.length){
      doc.addPage(); y = 16;
      doc.setFont('helvetica','bold'); doc.setFontSize(13);
      doc.text('07. Pictorial / Evidence', margin, y); y += 8;
      for (const p of pics){
        try{
          const dataUrl = await fetchImageBase64_(p.fileId);
          const props = doc.getImageProperties(dataUrl);
          const w = pageW - margin*2;
          const hgt = Math.min(90, w * props.height / props.width);
          ensureRoom(hgt + 10);
          doc.addImage(dataUrl, props.fileType || 'JPEG', margin, y, w, hgt);
          y += hgt + 2;
          doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(90,90,90);
          doc.text(p.label, margin, y); y += 6;
          doc.setTextColor(20,20,20);
        }catch(e){
          ensureRoom(6);
          doc.setFontSize(8.5); doc.text('[Photo unavailable: ' + p.label + ']', margin, y); y += 6;
        }
      }
    }

    const name = `Inspection_${(h.ir || 'report').replace(/[^a-zA-Z0-9]/g,'_')}_${h.date || ''}.pdf`;
    doc.save(name);
    showToast('PDF downloaded.');
  }catch(e){
    showToast('PDF generation failed — ' + e.message);
  }
}

function filteredReports(){
  let list = state.reports.slice();
  if (state.dashType !== 'All') list = list.filter(r => r.header.inspectionType === state.dashType);
  if (state.dashRange !== 'all'){
    const days = Number(state.dashRange);
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
    list = list.filter(r => new Date(r.header.date) >= cutoff);
  }
  return list.sort((a,b)=> new Date(b.header.date)-new Date(a.header.date));
}

  const passRate = reports.length ? passCount/reports.length*100 : 0;
  const totalDefects = reports.reduce((s,r)=>{ const t=defectTotals(r.defects); return s+t.Critical+t.Major+t.Minor; },0);

    <div class="kpi"><div class="k-bar" style="background:var(--brand)"></div><div class="k-label">Inspections</div><div class="k-value">${reports.length}</div><div class="k-sub">in selected range</div></div>
    <div class="kpi"><div class="k-bar" style="background:var(--good)"></div><div class="k-label">Pass Rate</div><div class="k-value">${fmt1(passRate)}%</div><div class="k-sub">${passCount} of ${reports.length} passed</div></div>
    <div class="kpi"><div class="k-bar" style="background:var(--crit)"></div><div class="k-label">Total Defects</div><div class="k-value">${totalDefects}</div><div class="k-sub">critical+major+minor</div></div>
    <div class="kpi"><div class="k-bar" style="background:var(--maj)"></div><div class="k-label">Order Qty (logged)</div><div class="k-value">${totalInspected.toLocaleString()}</div><div class="k-sub">across logged lots</div></div>
    <div class="kpi"><div class="k-bar" style="background:var(--min)"></div><div class="k-label">Failed Inspections</div><div class="k-value">${reports.length-passCount}</div><div class="k-sub">need CAPA follow-up</div></div>
  </div>

  <div class="dash-grid">
    <div class="panel panel-pad"><h2 class="section-title">Pass / Fail Trend <span class="tag">by inspection date</span></h2><div class="chart-wrap tall"><canvas id="trendChart"></canvas></div></div>
    <div class="panel panel-pad"><h2 class="section-title">Defects by Severity</h2><div class="chart-wrap tall"><canvas id="sevDonut"></canvas></div></div>
  </div>
  <div class="dash-grid" style="margin-top:14px;">
    <div class="panel panel-pad"><h2 class="section-title">Defect Pareto <span class="tag">top categories</span></h2><div class="chart-wrap tall"><canvas id="paretoChart"></canvas></div></div>
  </div>`;
}

function drawDashboardCharts(){
  const reports = filteredReports();
  if (reports.length===0) return;
  Chart.defaults.color = '#8A93A3';
  Chart.defaults.font.family = "'Inter', sans-serif";
  Chart.defaults.borderColor = '#232833';

  const byDate = {};
  reports.forEach(r=>{
    const d = r.header.date;
    if (!byDate[d]) byDate[d] = {pass:0,fail:0};
    byDate[d][r.result==='PASS'?'pass':'fail']++;
  });
  const dates = Object.keys(byDate).sort();
  new Chart(document.getElementById('trendChart'), {
    type:'bar',
    data:{ labels:dates, datasets:[
      {label:'Pass', data:dates.map(d=>byDate[d].pass), backgroundColor:'#34D399', borderRadius:4, stack:'s'},
      {label:'Fail', data:dates.map(d=>byDate[d].fail), backgroundColor:'#EF4444', borderRadius:4, stack:'s'}
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'top', labels:{boxWidth:10,usePointStyle:true}}},
      scales:{ y:{beginAtZero:true, grid:{color:'#1D222A'}}, x:{grid:{display:false}, stacked:true }, x2:{} } }
  });

  let c=0,mj=0,mn=0;
  reports.forEach(r=>{ const t=defectTotals(r.defects); c+=t.Critical; mj+=t.Major; mn+=t.Minor; });
  new Chart(document.getElementById('sevDonut'), {
    type:'doughnut',
    data:{ labels:['Critical','Major','Minor'], datasets:[{ data:[c,mj,mn], backgroundColor:['#EF4444','#F5A524','#38BDF8'], borderColor:'#171B21', borderWidth:2 }]},
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'bottom', labels:{boxWidth:9,usePointStyle:true,font:{size:10.5}}}} }
  });

  const byCat = {};
  reports.forEach(r=> (r.defects||[]).forEach(d=>{ byCat[d.category] = (byCat[d.category]||0) + (Number(d.qty)||1); }));
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,8);
  new Chart(document.getElementById('paretoChart'), {
    type:'bar',
    data:{ labels: catEntries.map(e=>e[0]), datasets:[{ data: catEntries.map(e=>e[1]), backgroundColor:'#2DD4BF', borderRadius:4 }]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ x:{beginAtZero:true, grid:{color:'#1D222A'}}, y:{grid:{display:false}} } }
  });
}

/* ---- 06. MEASUREMENTS ---- */
function renderSection06(){
  const m = state.measurements;
  const pomsWithOot = m.poms.map(p => {
    const vals = p.m.map(Number).filter(v => !isNaN(v) && p.m[p.m.indexOf(v)] !== '');
    const nums = p.m.filter(x=>x!=='').map(Number);
    let oot = '';
    if (p.spec !== '' && nums.length){
      const min = Math.min(...nums), max = Math.max(...nums);
      const lo = p.tolMinus !== '' ? Number(p.spec) + Number(p.tolMinus) : null;
      const hi = p.tolPlus !== '' ? Number(p.spec) + Number(p.tolPlus) : null;
      if ((lo!==null && min<lo) || (hi!==null && max>hi)) oot = 'OOT';
    }
    return oot;
  });
  const totalOOT = pomsWithOot.filter(x=>x==='OOT').length;
  const pctOOT = m.totalPOMsMeasured ? (totalOOT / Number(m.totalPOMsMeasured) * 100) : null;
  const measResult = m.maxAllowedOOT !== '' ? (totalOOT <= Number(m.maxAllowedOOT) ? 'PASS' : 'FAIL') : '';
  return `
  <div class="panel panel-pad section-block">
    <h2 class="section-title">06. Measurements</h2>
    <h3 class="section-title" style="font-size:12.5px;">Point-of-Measure (POM) Findings</h3>
    <table class="rep-table">
      <thead><tr><th>POM Description</th><th>Size</th><th>Tol (-)</th><th>Tol (+)</th><th>Spec</th><th>M1</th><th>M2</th><th>M3</th><th>M4</th><th>M5</th><th>OOT?</th><th></th></tr></thead>
      <tbody>
        ${m.poms.map((p,i)=>`
          <tr>
            <td><input type="text" data-pom="${i}:description" value="${esc(p.description)}"></td>
            <td><input type="text" data-pom="${i}:size" value="${esc(p.size)}" style="width:50px"></td>
            <td><input type="number" step="0.1" data-pom="${i}:tolMinus" value="${esc(p.tolMinus)}" style="width:55px"></td>
            <td><input type="number" step="0.1" data-pom="${i}:tolPlus" value="${esc(p.tolPlus)}" style="width:55px"></td>
            <td><input type="number" step="0.1" data-pom="${i}:spec" value="${esc(p.spec)}" style="width:60px"></td>
            ${p.m.map((v,mi)=>`<td><input type="number" step="0.1" data-pomm="${i}:${mi}" value="${esc(v)}" style="width:55px"></td>`).join('')}
            <td>${pomsWithOot[i] ? `<span class="badge fail">OOT</span>` : ''}</td>
            <td>${m.poms.length>1?`<button type="button" class="btn danger small" data-pom-remove="${i}">✕</button>`:''}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    <button type="button" class="btn ghost small row-add-btn" data-action="add-pom-row">+ Add POM Row</button>

    <div class="row" style="align-items:flex-end;margin-top:14px;">
      <div class="f"><span class="field-label">Or Measurement Report Pictures</span>${pictureWidget('measurements', '0')}</div>
    </div>

    <h3 class="section-title" style="margin-top:20px;font-size:12.5px;">Measurement Summary</h3>
    <div class="header-grid">
      <div class="f"><span class="field-label">Total Sample Size (Pcs)</span><input type="number" data-mm="totalSampleSize" value="${esc(m.totalSampleSize)}"></div>
      <div class="f"><span class="field-label">Total POMs Measured</span><input type="number" data-mm="totalPOMsMeasured" value="${esc(m.totalPOMsMeasured)}"></div>
      <div class="f"><span class="field-label">Total Pieces Out of Tolerance (auto)</span><input type="text" value="${totalOOT}" readonly></div>
      <div class="f"><span class="field-label">Maximum Allowed (per AQL)</span><input type="number" data-mm="maxAllowedOOT" value="${esc(m.maxAllowedOOT)}"></div>
      <div class="f"><span class="field-label">% POM Out of Tolerance (auto)</span><input type="text" value="${pctOOT!=null?fmt1(pctOOT)+'%':''}" readonly></div>
      <div class="f"><span class="field-label">Result (auto)</span><input type="text" value="${measResult}" readonly></div>
    </div>
  </div>`;
}

/* ---- 08. SUMMARY & SIGN-OFF ---- */
function renderSection08(aql){
  const packingResults = state.packingCheckpoints.map(c=>c.result).filter(Boolean);
  const packingResult = packingResults.includes('Fail') ? 'FAIL' : (packingResults.length ? 'PASS' : 'N/A');
  const testResults = state.testCheckpoints.map(c=>c.result).filter(Boolean);
  const testsResult = testResults.includes('Fail') ? 'FAIL' : (testResults.length ? 'PASS' : 'N/A');
  const m = state.measurements;
  const failCount = [packingResult, aql.result, testsResult].filter(r=>r==='FAIL').length;
  const anyResult = [packingResult, aql.result, testsResult].some(r=>r==='PASS'||r==='FAIL');
  const overall = failCount > 0 ? 'FAIL' : (anyResult ? 'PASS' : 'PENDING');
  return `
  <div class="panel panel-pad section-block">
    <h2 class="section-title">08. Summary & Sign-Off</h2>
    <table class="rep-table">
      <thead><tr><th>Section</th><th>Result</th></tr></thead>
      <tbody>
        <tr><td>1. Quantity & Packing</td><td><span class="badge ${packingResult==='FAIL'?'fail':packingResult==='PASS'?'pass':''}">${packingResult}</span></td></tr>
        <tr><td>2. Workmanship</td><td>${aql.result ? `<span class="badge ${aql.result==='FAIL'?'fail':'pass'}">${aql.result}</span>` : 'N/A'}</td></tr>
        <tr><td>3. Checkpoints & Tests</td><td><span class="badge ${testsResult==='FAIL'?'fail':testsResult==='PASS'?'pass':''}">${testsResult}</span></td></tr>
        <tr><td>4. Measurements</td><td>${(() => {
          if (m.maxAllowedOOT === '') return 'N/A';
          const oot = state.measurements.poms.filter(p => {
            const nums = p.m.filter(x=>x!=='').map(Number);
            if (p.spec==='' || !nums.length) return false;
            const min = Math.min(...nums), max = Math.max(...nums);
            const lo = p.tolMinus!=='' ? Number(p.spec)+Number(p.tolMinus) : null;
            const hi = p.tolPlus!=='' ? Number(p.spec)+Number(p.tolPlus) : null;
            return (lo!==null && min<lo) || (hi!==null && max>hi);
          }).length;
          const r = oot <= Number(m.maxAllowedOOT) ? 'PASS' : 'FAIL';
          return `<span class="badge ${r==='FAIL'?'fail':'pass'}">${r}</span>`;
        })()}</td></tr>
      </tbody>
    </table>
    <div class="subtle-note" style="margin:10px 0 16px;"><b>Overall Inspection Result:</b> <span class="badge ${overall==='FAIL'?'fail':overall==='PASS'?'pass':''}">${overall}</span></div>

    <h3 class="section-title" style="font-size:12.5px;">Acknowledgements & Sign-Off</h3>
    <table class="rep-table">
      <thead><tr><th>Role</th><th>Name</th><th>Signature / Date</th></tr></thead>
      <tbody>
        ${state.signOff.map((s,i)=>`
          <tr>
            <td>${esc(s.role)}</td>
            <td><input type="text" data-so2="${i}:name" value="${esc(s.name)}"></td>
            <td><input type="text" data-so2="${i}:signature" value="${esc(s.signature)}" placeholder="Name / date"></td>
          </tr>`).join('')}
      </tbody>
    </table>

    <h3 class="section-title" style="margin-top:20px;font-size:12.5px;">Overall Remarks</h3>
    <textarea id="f_remarks" rows="3" style="width:100%;">${esc(state.remarks)}</textarea>
  </div>`;
}

/* ============================= EVENTS ============================= */

function bindEvents(){
  document.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => { state.tab = el.dataset.tab; render(); });
  const gotoEntry = document.querySelector('[data-action="goto-entry"]');
  if (gotoEntry) gotoEntry.onclick = () => { state.tab='entry'; render(); };

  document.querySelectorAll('[data-dashtype]').forEach(el => el.onclick = () => { state.dashType = el.dataset.dashtype; render(); });
  const rangeSel = document.querySelector('[data-dashrange]');
  if (rangeSel) rangeSel.onchange = (e) => { state.dashRange = e.target.value; render(); };

  // ---- 01/general header ----
  document.querySelectorAll('[data-h]').forEach(el => el.onchange = (e) => {
    const key = el.dataset.h;
    const val = e.target.value;
    state.header[key] = val;
    if (key === 'sbu') {
      state.header.buyer = ''; state.header.ir = '';
      state.header.styleId = ''; state.header.styleName = ''; state.header.styleDescription = ''; state.header.item = '';
      state.header.productDept = ''; state.header.season = ''; state.header.orderQty = ''; state.colorQty = [];
      loadBuyerOptions(val);
    } else if (key === 'buyer') {
      state.header.ir = '';
      state.header.styleId = ''; state.header.styleName = ''; state.header.styleDescription = ''; state.header.item = '';
      state.header.productDept = ''; state.header.season = ''; state.header.orderQty = ''; state.colorQty = [];
      loadIrOptions(state.header.sbu, val);
    } else if (key === 'ir') {
      loadStyleDetail(state.header.sbu, state.header.buyer, val);
    } else {
      render();
    }
  });

  // ---- All Quantities / Carton Selection / Carton-Quantity Selection ----
  document.querySelectorAll('[data-aq]').forEach(el => el.onchange = (e) => { state.allQtyCheck[el.dataset.aq] = e.target.value; render(); });
  document.querySelectorAll('[data-cs]').forEach(el => el.onchange = (e) => { state.cartonSelection[el.dataset.cs] = e.target.value; render(); });
  document.querySelectorAll('[data-cqs]').forEach(el => el.onchange = (e) => { state.cartonQtySelection[el.dataset.cqs] = e.target.value; render(); });
  document.querySelectorAll('[data-cq]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.cq.split(':');
    state.colorQty[Number(i)][field] = e.target.value;
    render();
  });

  // ---- 02. Sample overview rows ----
  document.querySelectorAll('[data-so]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.so.split(':');
    state.sampleOverview[Number(i)][field] = e.target.value;
    render();
  });
  document.querySelectorAll('[data-so-remove]').forEach(el => el.onclick = () => {
    state.sampleOverview.splice(Number(el.dataset.soRemove), 1);
    render();
  });
  const addOverviewBtn = document.querySelector('[data-action="add-overview-row"]');
  if (addOverviewBtn) addOverviewBtn.onclick = () => {
    state.sampleOverview.push({ styleId:'', styleName:'', orderQty:'', availableQty:'', cartonsAvailable:'', cartonsSelected:'', actualSampleInspected:'', remarks:'' });
    render();
  };

  // ---- 03. Packing checkpoints / carton dims ----
  document.querySelectorAll('[data-pk]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.pk.split(':');
    state.packingCheckpoints[Number(i)][field] = e.target.value;
    render();
  });
  document.querySelectorAll('[data-cd]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.cd.split(':');
    state.cartonDims[Number(i)][field] = e.target.value;
    render();
  });
  document.querySelectorAll('[data-cd-remove]').forEach(el => el.onclick = () => {
    state.cartonDims.splice(Number(el.dataset.cdRemove), 1);
    render();
  });
  const addCartonDimBtn = document.querySelector('[data-action="add-cartondim-row"]');
  if (addCartonDimBtn) addCartonDimBtn.onclick = () => {
    state.cartonDims.push({ poNumber:'', cartonNo:'', dims:'', comments:'' });
    render();
  };

  // ---- 04. Defect log ----
  const addBtn = document.querySelector('[data-action="add-defect"]');
  if (addBtn) addBtn.onclick = () => {
    if (tcBlockIfGuest('Adding a defect')) return;
    state.defects.push({group:'Group-B',category:'Assembling / Sewing',description:'',area:'',severity:'Major',qty:1,pictures:[]});
    render();
  };
  document.querySelectorAll('[data-defect-pick]').forEach(el => el.onchange = (e) => {
    const i = Number(el.dataset.defectPick);
    if (!e.target.value) return;
    const [category,description,severity] = e.target.value.split('|||');
    Object.assign(state.defects[i], {category,description,severity});
    render();
  });
  document.querySelectorAll('[data-def]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.def.split(':');
    state.defects[Number(i)][field] = e.target.value;
    render();
  });
  document.querySelectorAll('[data-remove-defect]').forEach(el => el.onclick = () => {
    if (tcBlockIfGuest('Removing a defect')) return;
    state.defects.splice(Number(el.dataset.removeDefect),1);
    render();
  });

  // ---- 05. Test checkpoints ----
  document.querySelectorAll('[data-tc]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.tc.split(':');
    state.testCheckpoints[Number(i)][field] = e.target.value;
    render();
  });

  // ---- 06. Measurements ----
  document.querySelectorAll('[data-pom]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.pom.split(':');
    state.measurements.poms[Number(i)][field] = e.target.value;
    render();
  });
  document.querySelectorAll('[data-pomm]').forEach(el => el.onchange = (e) => {
    const [i, mi] = el.dataset.pomm.split(':');
    state.measurements.poms[Number(i)].m[Number(mi)] = e.target.value;
    render();
  });
  document.querySelectorAll('[data-pom-remove]').forEach(el => el.onclick = () => {
    state.measurements.poms.splice(Number(el.dataset.pomRemove), 1);
    render();
  });
  const addPomBtn = document.querySelector('[data-action="add-pom-row"]');
  if (addPomBtn) addPomBtn.onclick = () => {
    state.measurements.poms.push({ description:'', size:'', tolMinus:'', tolPlus:'', spec:'', m:['','','','',''] });
    render();
  };
  document.querySelectorAll('[data-mm]').forEach(el => el.onchange = (e) => { state.measurements[el.dataset.mm] = e.target.value; render(); });

  // ---- 08. Sign-off ----
  document.querySelectorAll('[data-so2]').forEach(el => el.onchange = (e) => {
    const [i, field] = el.dataset.so2.split(':');
    state.signOff[Number(i)][field] = e.target.value;
  });

  // ---- Pictures (every section) ----
  document.querySelectorAll('[data-pic-add]').forEach(el => el.onclick = () => {
    document.querySelector(`[data-pic-input="${el.dataset.picAdd}"]`).click();
  });
  document.querySelectorAll('[data-pic-input]').forEach(el => el.onchange = async (e) => {
    if (tcBlockIfGuest('Adding a photo')) return;
    const [section, idx] = el.dataset.picInput.split(':');
    const file = e.target.files[0];
    if (!file) return;
    await handlePictureUpload(section, idx, file);
  });
  document.querySelectorAll('[data-pic-del]').forEach(el => el.onclick = () => {
    const [section, idx, pi] = el.dataset.picDel.split(':');
    const target = resolvePictureTarget(section, idx);
    if (target && target.pictures) target.pictures.splice(Number(pi), 1);
    render();
  });

  // ---- Save draft / submit final / PDF / cancel ----
  const draftBtn = document.querySelector('[data-action="save-draft"]');
  if (draftBtn) draftBtn.onclick = () => {
    if (tcBlockIfGuest('Saving a draft')) return;
    state.remarks = document.getElementById('f_remarks').value;
    saveCurrentReport_(false);
  };
  const submitBtn = document.querySelector('[data-action="submit-final"]');
  if (submitBtn) submitBtn.onclick = () => {
    if (tcBlockIfGuest('Submitting a report')) return;
    state.remarks = document.getElementById('f_remarks').value;
    saveCurrentReport_(true);
  };
  const pdfBtn = document.querySelector('[data-action="download-pdf"]');
  if (pdfBtn) pdfBtn.onclick = () => {
    state.remarks = document.getElementById('f_remarks').value;
    generatePdfReport();
  };
  const cancelBtn = document.querySelector('[data-action="cancel-edit"]');
  if (cancelBtn) cancelBtn.onclick = () => { resetEntryForm_(); render(); };

  document.querySelectorAll('[data-view]').forEach(el => el.onclick = () => { state.viewingId = el.dataset.view; render(); });
  document.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => {
    if (tcBlockIfGuest('Editing a report')) return;
    loadReportIntoForm_(el.dataset.edit);
  });
  document.querySelectorAll('[data-download-pdf-saved]').forEach(el => el.onclick = () => {
    loadReportIntoForm_(el.dataset.downloadPdfSaved, true);
  });
  document.querySelectorAll('[data-delete]').forEach(el => el.onclick = () => {
    if (tcBlockIfGuest('Deleting a report')) return;
    if (!confirm('Delete this report? This cannot be undone.')) return;
    state.reports = state.reports.filter(x=>x.id!==el.dataset.delete);
    persistReports();
    render();
  });
  document.querySelectorAll('[data-close-modal]').forEach(el => el.onclick = () => { state.viewingId = null; render(); });
}

function loadReportIntoForm_(reportId, thenDownloadPdf){
  const r = state.reports.find(x=>x.id===reportId);
  if (!r) return;
  Object.assign(state, emptyReportState(), JSON.parse(JSON.stringify(r)));
  state.editingId = r.id;
  state.tab = 'entry';
  state.viewingId = null;
  render();
  const h = state.header;
  const afterLoad = () => { if (thenDownloadPdf) generatePdfReport(); };
  if (h.sbu) {
    loadBuyerOptions(h.sbu).then(() => {
      if (h.buyer) loadIrOptions(h.sbu, h.buyer).then(() => {
        if (h.ir) loadStyleDetail(h.sbu, h.buyer, h.ir).then(afterLoad);
        else afterLoad();
      });
      else afterLoad();
    });
  } else afterLoad();
}

function resetEntryForm_(){
  Object.assign(state, emptyReportState());
  state.editingId = null;
  state.styleDetail = null;
  state.buyerOptions = []; state.irOptions = [];
}

async function saveCurrentReport_(isFinal){
  const { overall, aql } = computeOverallResult_();

  const record = Object.assign({}, JSON.parse(JSON.stringify(emptyReportState())), JSON.parse(JSON.stringify({
    header: state.header, allQtyCheck: state.allQtyCheck, cartonSelection: state.cartonSelection, colorQty: state.colorQty,
    sampleOverview: state.sampleOverview, cartonQtySelection: state.cartonQtySelection, packingCheckpoints: state.packingCheckpoints,
    cartonDims: state.cartonDims, defects: state.defects, testCheckpoints: state.testCheckpoints, measurements: state.measurements,
    signOff: state.signOff, remarks: state.remarks,
  })));
  record.id = state.editingId || uid();
  record.sampleSize = aql.sampleSize;
  record.result = overall === 'PENDING' ? (aql.result || 'PENDING') : overall;
  record.status = isFinal ? 'Submitted' : 'Draft';
  record.savedAt = new Date().toISOString();

  if (state.editingId){
    state.reports = state.reports.map(r => r.id===state.editingId ? record : r);
  } else {
    state.reports.push(record);
  }
  persistReports();

  if (isFinal){
    showToast('Report submitted — overall result: ' + record.result + '. Preparing PDF…');
    await generatePdfReport(record); // snapshot passed explicitly — the form gets reset right after
  } else {
    showToast('Draft saved — you can resume it any time from the Reports Log.');
  }
  resetEntryForm_();
  state.tab = 'log';
  render();
}

/* ============================= INIT ============================= */

// Pre-fill from Style Tracking's "+ Add Entry" link (?sbu=&buyer=&ir=)
(function applyUrlPrefill(){
  const p = new URLSearchParams(window.location.search);
  const sbu = p.get('sbu'), buyer = p.get('buyer'), ir = p.get('ir');
  if (!sbu && !buyer && !ir) return;
  state.tab = 'entry';
  if (sbu) state.header.sbu = sbu;
  if (buyer) state.header.buyer = buyer;
  if (ir) state.header.ir = ir;
})();

loadReports().then(() => {
  const h = state.header;
  if (h.sbu) loadBuyerOptions(h.sbu).then(() => {
    if (h.buyer) loadIrOptions(h.sbu, h.buyer).then(() => {
      if (h.ir) loadStyleDetail(h.sbu, h.buyer, h.ir);
    });
  });
});
</script>
