<script>
window.TC_IS_GUEST = false;
(function(){
  var raw = localStorage.getItem("tc_session") || sessionStorage.getItem("tc_session");
  if (!raw) {
    window.location.href = "login.html";
  } else {
    try {
      var s = JSON.parse(raw);
      window.TC_IS_GUEST = /guest|visitor/i.test(s.role || "");
      document.addEventListener("DOMContentLoaded", function(){
        var el = document.getElementById("tc-guard-user");
        if (el) el.textContent = s.name || "";
        var badge = document.getElementById("tc-guest-badge");
        if (badge && window.TC_IS_GUEST) badge.style.display = "inline-block";
      });
    } catch(e) {}
  }
})();
function tcBlockIfGuest(actionLabel) {
  if (window.TC_IS_GUEST) {
    alert("You're signed in as a Guest (View Only). " + (actionLabel || "This action") + " is disabled for guest accounts.\n\nAsk an administrator for a full account to " + (actionLabel ? actionLabel.toLowerCase() : "make changes") + ".");
    return true;
  }
  return false;
}

<script>
/* ============================= REFERENCE DATA ============================= */

// ISO 2859-1 General Inspection Level II sample-size-by-lot-size table.
// Capped at 315 for very large lots — common garment-industry practice
// (matches the sample buyer reports this was built from). Edit here if a
// buyer requires the uncapped standard sizes (500/800/1250).
const AQL_LOT_TABLE = [
  {min:2,max:8,code:'A',size:2},{min:9,max:15,code:'B',size:3},{min:16,max:25,code:'C',size:5},
  {min:26,max:50,code:'D',size:8},{min:51,max:90,code:'E',size:13},{min:91,max:150,code:'F',size:20},
  {min:151,max:280,code:'G',size:32},{min:281,max:500,code:'H',size:50},{min:501,max:1200,code:'J',size:80},
  {min:1201,max:3200,code:'K',size:125},{min:3201,max:10000,code:'L',size:200},{min:10001,max:35000,code:'M',size:315},
  {min:35001,max:150000,code:'N',size:315},{min:150001,max:500000,code:'P',size:315},{min:500001,max:Infinity,code:'Q',size:315}
];
// Ac (accept) / Re (reject) numbers, Normal inspection, single sampling.
const AQL_ACCEPT_TABLE = [
  {size:2,  a1_0:0,r1_0:1, a1_5:0,r1_5:1, a2_5:0,r2_5:1, a4_0:0,r4_0:1},
  {size:3,  a1_0:0,r1_0:1, a1_5:0,r1_5:1, a2_5:0,r2_5:1, a4_0:0,r4_0:1},
  {size:5,  a1_0:0,r1_0:1, a1_5:0,r1_5:1, a2_5:0,r2_5:1, a4_0:1,r4_0:2},
  {size:8,  a1_0:0,r1_0:1, a1_5:0,r1_5:1, a2_5:1,r2_5:2, a4_0:1,r4_0:2},
  {size:13, a1_0:0,r1_0:1, a1_5:1,r1_5:2, a2_5:1,r2_5:2, a4_0:2,r4_0:3},
  {size:20, a1_0:1,r1_0:2, a1_5:1,r1_5:2, a2_5:2,r2_5:3, a4_0:3,r4_0:4},
  {size:32, a1_0:1,r1_0:2, a1_5:2,r1_5:3, a2_5:3,r2_5:4, a4_0:5,r4_0:6},
  {size:50, a1_0:2,r1_0:3, a1_5:3,r1_5:4, a2_5:5,r2_5:6, a4_0:7,r4_0:8},
  {size:80, a1_0:2,r1_0:3, a1_5:3,r1_5:4, a2_5:5,r2_5:6, a4_0:7,r4_0:8},
  {size:125,a1_0:3,r1_0:4, a1_5:5,r1_5:6, a2_5:7,r2_5:8, a4_0:10,r4_0:11},
  {size:200,a1_0:5,r1_0:6, a1_5:7,r1_5:8, a2_5:10,r2_5:11, a4_0:14,r4_0:15},
  {size:315,a1_0:7,r1_0:8, a1_5:10,r1_5:11, a2_5:14,r2_5:15, a4_0:21,r4_0:22},
  {size:500,a1_0:10,r1_0:11, a1_5:14,r1_5:15, a2_5:21,r2_5:22, a4_0:21,r4_0:22},
  {size:800,a1_0:14,r1_0:15, a1_5:21,r1_5:22, a2_5:21,r2_5:22, a4_0:21,r4_0:22},
  {size:1250,a1_0:21,r1_0:22, a1_5:21,r1_5:22, a2_5:21,r2_5:22, a4_0:21,r4_0:22}
];

const DEFECT_LIBRARY = [
  {category:'Assembling', code:'1C2-18', name:'Asymmetrical/Uneven or Deformed shape', sev:'Major'},
  {category:'Assembling', code:'1C2-16', name:'Uneven hem (Major >1/4", Minor <=1/4")', sev:'Minor'},
  {category:'Finishing', code:'1C4-8', name:'Oil stain', sev:'Major'},
  {category:'Finishing', code:'1C4-14', name:'Dirty/Glue/Pencil/Pen/Chalk mark, Dust', sev:'Minor'},
  {category:'Stitch and seam', code:'1C1-5', name:'Broken stitches on chain stitching', sev:'Major'},
  {category:'Stitch and seam', code:'1C1-4', name:'Skipped stitches on lock stitching', sev:'Major'},
  {category:'Fabric', code:'FAB-1', name:'Fabric defect (hole/slub/misweave)', sev:'Major'},
  {category:'Measurement', code:'MEAS-1', name:'Out of tolerance measurement', sev:'Major'},
  {category:'Labeling', code:'LBL-1', name:'Wrong or missing care/size label', sev:'Major'},
  {category:'Labeling', code:'LBL-2', name:'Missing/wrong component (label/button/print)', sev:'Critical'},
  {category:'Packing', code:'PACK-1', name:'Incorrect carton marking', sev:'Minor'},
  {category:'Others', code:'OTH-1', name:'Other defect (specify in remarks)', sev:'Minor'},
];

const SEV_META = {
  Critical:{label:'Critical', color:'var(--crit)', hex:'#EF4444', dim:'var(--crit-dim)'},
  Major:{label:'Major', color:'var(--maj)', hex:'#F5A524', dim:'var(--maj-dim)'},
  Minor:{label:'Minor', color:'var(--min)', hex:'#38BDF8', dim:'var(--min-dim)'},
};

/* ============================= STATE ============================= */

let state = {
  reports: [],
  storageReady: false,
  tab: 'dashboard',
  dashRange: '90',
  dashType: 'All',
  header: emptyHeader(),
  defects: [],
  remarks: '',
  editingId: null,
  viewingId: null,
  toast: null,
  sbuOptions: [],
  buyerOptions: [],
  irOptions: [],
  styleDetail: null,
};

function emptyHeader(){
  return { sbu:'', date:new Date().toISOString().slice(0,10), inspectionType:'Final',
    buyer:'', ir:'', styleNo:'', styleDescription:'', item:'', productDept:'', season:'',
    supplier:'', poNumber:'', color:'', availableQty:'', cartonsPulled:'', inspectorName:'' };
}

/* ============================= STORAGE ============================= */

// Same Google Apps Script + Sheet that powers the QA Process /
// Style Tracking dashboard — this tool reads its OrderInfo (SBU→
// Buyer→IR) master data and writes its results into the same
// spreadsheet, so Style Tracking's rollup sees Pre-Final/Final
// Inspection entries too.
const QA_API_URL = "https://script.google.com/macros/s/AKfycbwsPJcvf_0pa3Pyt3fhR3AOOo5TfDkoiGq_gwDpH9Tgpd5uJ2MQM_rzhFHIavPtnUakxw/exec";

async function qaApi(payload){
  if (QA_API_URL.indexOf("PASTE_YOUR") === 0) throw new Error("Backend not connected yet");
  const res = await fetch(QA_API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  });
  return res.json();
}

async function loadReports(){
  try{
    const res = await qaApi({ action: "listPreFinal" });
    if (!res.ok) throw new Error(res.error || "Failed to load reports");
    state.reports = Array.isArray(res.reports) ? res.reports : [];
  }catch(e){
    try{
      const raw = localStorage.getItem('prefinal-reports-fallback');
      state.reports = raw ? JSON.parse(raw) : [];
    }catch(e2){ state.reports = []; }
    showToast(QA_API_URL.indexOf("PASTE_YOUR")===0 ? 'Backend not connected yet — saving to this browser only' : 'Could not reach server — showing this browser\'s last saved copy');
  }
  state.storageReady = true;
  render();
  loadSbuOptions();
}

async function persistReports(){
  try{
    const res = await qaApi({ action: "savePreFinal", reports: state.reports });
    if (!res.ok) throw new Error(res.error || "Save failed");
  }catch(e){
    try{ localStorage.setItem('prefinal-reports-fallback', JSON.stringify(state.reports)); }catch(e2){}
    showToast(QA_API_URL.indexOf("PASTE_YOUR")===0 ? 'Backend not connected yet — saved to this browser only' : 'Could not reach server — saved to this browser only');
  }
}

/* ============================= STYLE LOOKUP (SBU → Buyer → IR) ============================= */

async function loadSbuOptions(){
  try{
    const res = await qaApi({ action: "listSbus" });
    state.sbuOptions = res.ok ? res.sbus : [];
  }catch(e){ state.sbuOptions = []; }
  render();
}

async function loadBuyerOptions(sbu){
  state.buyerOptions = []; state.irOptions = []; state.styleDetail = null;
  render();
  try{
    const res = await qaApi({ action: "listBuyers", sbu: sbu });
    state.buyerOptions = res.ok ? res.buyers : [];
  }catch(e){ state.buyerOptions = []; }
  render();
}

async function loadIrOptions(sbu, buyer){
  state.irOptions = []; state.styleDetail = null;
  render();
  try{
    const res = await qaApi({ action: "listIrs", sbu: sbu, buyer: buyer });
    state.irOptions = res.ok ? res.irs : [];
  }catch(e){ state.irOptions = []; }
  render();
}

async function loadStyleDetail(sbu, buyer, ir){
  state.styleDetail = null;
  render();
  try{
    const res = await qaApi({ action: "getOrderDetail", sbu: sbu, buyer: buyer, ir: ir });
    state.styleDetail = res.ok ? res.detail : null;
  }catch(e){ state.styleDetail = null; }
  if (state.styleDetail){
    const d = state.styleDetail;
    state.header.styleNo = d.styleName || '';
    state.header.styleDescription = d.styleDescription || '';
    state.header.item = d.item || '';
    state.header.productDept = d.productDept || '';
    state.header.season = d.season || '';
    if (d.colors && d.colors.length === 1){
      state.header.color = d.colors[0].color;
      state.header.availableQty = d.colors[0].qty;
    }
  }
  render();
}

/* ============================= AQL LOGIC ============================= */

function lookupSampleSize(qty){
  const row = AQL_LOT_TABLE.find(r => qty >= r.min && qty <= r.max);
  return row || {code:'', size:0};
}

function lookupAcceptReject(sampleSize){
  const candidates = AQL_ACCEPT_TABLE.filter(r => r.size <= sampleSize);
  return candidates.length ? candidates[candidates.length-1] : AQL_ACCEPT_TABLE[0];
}

function computeAQL(availableQty, critical, major, minor){
  const lot = lookupSampleSize(Number(availableQty)||0);
  const acc = lookupAcceptReject(lot.size);
  const criticalAllowed = 0;
  const majorAllowed = acc.a2_5;
  const minorAllowed = acc.a4_0;
  const fail = critical > criticalAllowed || major > majorAllowed || minor > minorAllowed;
  return { sampleSize: lot.size, codeLetter: lot.code, criticalAllowed, majorAllowed, minorAllowed, result: fail ? 'FAIL' : 'PASS' };
}

function defectTotals(defects){
  const t = {Critical:0, Major:0, Minor:0};
  (defects||[]).forEach(d => { if (t[d.sev]!==undefined) t[d.sev] += Number(d.qty)||1; });
  return t;
}

/* ============================= UTIL ============================= */

function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
function showToast(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2600); }

function filteredReports(){
  let list = state.reports.slice();
  if (state.dashType !== 'All') list = list.filter(r => r.header.inspectionType === state.dashType);
  if (state.dashRange !== 'all'){
    const days = Number(state.dashRange);
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
    list = list.filter(r => new Date(r.header.date) >= cutoff);
  }
  return list.sort((a,b)=> new Date(b.header.date)-new Date(a.header.date));
}

  app.innerHTML = `

function drawDashboardCharts(){
  const reports = filteredReports();
  if (reports.length===0) return;
  Chart.defaults.color = '#8A93A3';
  Chart.defaults.font.family = "'Inter', sans-serif";
  Chart.defaults.borderColor = '#232833';

  const byDate = {};
  reports.forEach(r=>{
    const d = r.header.date;
    if (!byDate[d]) byDate[d] = {pass:0,fail:0};
    byDate[d][r.result==='PASS'?'pass':'fail']++;
  });
  const dates = Object.keys(byDate).sort();
  new Chart(document.getElementById('trendChart'), {
    type:'bar',
    data:{ labels:dates, datasets:[
      {label:'Pass', data:dates.map(d=>byDate[d].pass), backgroundColor:'#34D399', borderRadius:4, stack:'s'},
      {label:'Fail', data:dates.map(d=>byDate[d].fail), backgroundColor:'#EF4444', borderRadius:4, stack:'s'}
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'top', labels:{boxWidth:10,usePointStyle:true}}},
      scales:{ y:{beginAtZero:true, grid:{color:'#1D222A'}}, x:{grid:{display:false}, stacked:true }, x2:{} } }
  });

  let c=0,mj=0,mn=0;
  reports.forEach(r=>{ const t=defectTotals(r.defects); c+=t.Critical; mj+=t.Major; mn+=t.Minor; });
  new Chart(document.getElementById('sevDonut'), {
    type:'doughnut',
    data:{ labels:['Critical','Major','Minor'], datasets:[{ data:[c,mj,mn], backgroundColor:['#EF4444','#F5A524','#38BDF8'], borderColor:'#171B21', borderWidth:2 }]},
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'bottom', labels:{boxWidth:9,usePointStyle:true,font:{size:10.5}}}} }
  });

  const byCat = {};
  reports.forEach(r=> (r.defects||[]).forEach(d=>{ byCat[d.category] = (byCat[d.category]||0) + (Number(d.qty)||1); }));
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,8);
  new Chart(document.getElementById('paretoChart'), {
    type:'bar',
    data:{ labels: catEntries.map(e=>e[0]), datasets:[{ data: catEntries.map(e=>e[1]), backgroundColor:'#2DD4BF', borderRadius:4 }]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ x:{beginAtZero:true, grid:{color:'#1D222A'}}, y:{grid:{display:false}} } }
  });

  const types = ['Pre-Final','Final'];
  const typeStats = types.map(t=>{
    const rs = state.reports.filter(r=>r.header.inspectionType===t);
    const pass = rs.filter(r=>r.result==='PASS').length;
    return rs.length ? pass/rs.length*100 : 0;
  });
  new Chart(document.getElementById('typeChart'), {
    type:'bar',
    data:{ labels:types, datasets:[{label:'Pass Rate %', data:typeStats, backgroundColor:['#38BDF8','#A78BFA'], borderRadius:5}]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ y:{beginAtZero:true, max:100, grid:{color:'#1D222A'}}, x:{grid:{display:false}} } }
  });
}

/* ============================= EVENTS ============================= */

function bindEvents(){
  document.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => { state.tab = el.dataset.tab; render(); });
  const gotoEntry = document.querySelector('[data-action="goto-entry"]');
  if (gotoEntry) gotoEntry.onclick = () => { state.tab='entry'; render(); };

  document.querySelectorAll('[data-dashtype]').forEach(el => el.onclick = () => { state.dashType = el.dataset.dashtype; render(); });
  const rangeSel = document.querySelector('[data-dashrange]');
  if (rangeSel) rangeSel.onchange = (e) => { state.dashRange = e.target.value; render(); };

  document.querySelectorAll('[data-h]').forEach(el => el.onchange = (e) => {
    const key = el.dataset.h;
    const val = e.target.value;
    state.header[key] = val;
    if (key === 'sbu') {
      state.header.buyer = ''; state.header.ir = '';
      state.header.styleNo = ''; state.header.styleDescription = ''; state.header.item = '';
      state.header.productDept = ''; state.header.season = ''; state.header.color = ''; state.header.availableQty = '';
      loadBuyerOptions(val);
    } else if (key === 'buyer') {
      state.header.ir = '';
      state.header.styleNo = ''; state.header.styleDescription = ''; state.header.item = '';
      state.header.productDept = ''; state.header.season = ''; state.header.color = ''; state.header.availableQty = '';
      loadIrOptions(state.header.sbu, val);
    } else if (key === 'ir') {
      loadStyleDetail(state.header.sbu, state.header.buyer, val);
    } else if (key === 'color') {
      const cd = (state.styleDetail && state.styleDetail.colors || []).find(c => c.color === val);
      if (cd) state.header.availableQty = cd.qty;
      render();
    } else {
      render();
    }
  });

  const addBtn = document.querySelector('[data-action="add-defect"]');
  if (addBtn) addBtn.onclick = () => {
    if (tcBlockIfGuest('Adding a defect')) return;
    state.defects.push({category:'',code:'',name:'',sev:'Major',itemId:'',size:'',qty:1});
    redrawDefects_();
    updateAqlPreview_();
  };

  redrawDefects_();
  document.querySelectorAll('[data-defect-pick]').forEach(el => el.onchange = (e) => {
    const i = Number(el.dataset.defectPick);
    if (!e.target.value) return;
    const [category,code,name,sev] = e.target.value.split('|||');
    Object.assign(state.defects[i], {category,code,name,sev});
    redrawDefects_();
    updateAqlPreview_();
  });
  document.querySelectorAll('[data-defect-sev]').forEach(el => el.onchange = (e) => { state.defects[Number(el.dataset.defectSev)].sev = e.target.value; updateAqlPreview_(); });
  document.querySelectorAll('[data-defect-item]').forEach(el => el.onchange = (e) => { state.defects[Number(el.dataset.defectItem)].itemId = e.target.value; });
  document.querySelectorAll('[data-defect-size]').forEach(el => el.onchange = (e) => { state.defects[Number(el.dataset.defectSize)].size = e.target.value; });
  document.querySelectorAll('[data-defect-qty]').forEach(el => el.onchange = (e) => { state.defects[Number(el.dataset.defectQty)].qty = e.target.value; updateAqlPreview_(); });
  document.querySelectorAll('[data-remove-defect]').forEach(el => el.onclick = () => {
    if (tcBlockIfGuest('Removing a defect')) return;
    state.defects.splice(Number(el.dataset.removeDefect),1);
    redrawDefects_();
    render();
  });

  const saveBtn = document.querySelector('[data-action="save-report"]');
  if (saveBtn) saveBtn.onclick = () => {
    if (tcBlockIfGuest('Saving a report')) return;
    state.remarks = document.getElementById('f_remarks').value;
    saveCurrentReport_();
  };
  const cancelBtn = document.querySelector('[data-action="cancel-edit"]');
  if (cancelBtn) cancelBtn.onclick = () => { resetEntryForm_(); render(); };

  document.querySelectorAll('[data-view]').forEach(el => el.onclick = () => { state.viewingId = el.dataset.view; render(); });
  document.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => {
    if (tcBlockIfGuest('Editing a report')) return;
    const r = state.reports.find(x=>x.id===el.dataset.edit);
    if (!r) return;
    state.header = Object.assign(emptyHeader(), r.header);
    state.defects = (r.defects||[]).map(d=>Object.assign({},d));
    state.remarks = r.remarks||'';
    state.editingId = r.id;
    state.tab = 'entry';
    render();
    if (state.header.sbu) loadBuyerOptions(state.header.sbu).then(() => {
      if (state.header.buyer) loadIrOptions(state.header.sbu, state.header.buyer).then(() => {
        if (state.header.ir) loadStyleDetail(state.header.sbu, state.header.buyer, state.header.ir);
      });
    });
  });
  document.querySelectorAll('[data-delete]').forEach(el => el.onclick = () => {
    if (tcBlockIfGuest('Deleting a report')) return;
    if (!confirm('Delete this report? This cannot be undone.')) return;
    state.reports = state.reports.filter(x=>x.id!==el.dataset.delete);
    persistReports();
    render();
  });
  document.querySelectorAll('[data-close-modal]').forEach(el => el.onclick = () => { state.viewingId = null; render(); });
}

function updateAqlPreview_(){
  // cheapest correct approach: just re-render the entry tab section values in place
  if (state.tab !== 'entry') return;
  const h = state.header;
  const t = defectTotals(state.defects);
  const aql = computeAQL(h.availableQty, t.Critical, t.Major, t.Minor);
  const cells = document.querySelectorAll('.aql-preview .av');
  if (cells.length === 4){
    cells[0].textContent = `${t.Critical} / ${aql.criticalAllowed}`;
    cells[1].textContent = `${t.Major} / ${aql.majorAllowed}`;
    cells[2].textContent = `${t.Minor} / ${aql.minorAllowed}`;
    cells[3].innerHTML = `<span class="badge ${aql.result==='PASS'?'pass':'fail'}">${aql.result}</span>`;
  }
}

function resetEntryForm_(){
  state.header = emptyHeader();
  state.defects = [];
  state.remarks = '';
  state.editingId = null;
}

function saveCurrentReport_(){
  const t = defectTotals(state.defects);
  const aql = computeAQL(state.header.availableQty, t.Critical, t.Major, t.Minor);
  const record = {
    id: state.editingId || uid(),
    header: Object.assign({}, state.header),
    defects: state.defects.map(d=>Object.assign({},d)),
    remarks: state.remarks,
    sampleSize: aql.sampleSize,
    criticalAllowed: aql.criticalAllowed,
    majorAllowed: aql.majorAllowed,
    minorAllowed: aql.minorAllowed,
    result: aql.result,
    savedAt: new Date().toISOString()
  };
  if (state.editingId){
    state.reports = state.reports.map(r => r.id===state.editingId ? record : r);
  } else {
    state.reports.push(record);
  }
  persistReports();
  showToast('Report saved — result: ' + aql.result);
  resetEntryForm_();
  state.tab = 'log';
  render();
}

/* ============================= INIT ============================= */
loadReports();
</script>
</body>
</html>
