<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Process — Taher Consulting</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  body{background:var(--paper);}
  .qa-shell{display:flex;min-height:calc(100vh - 44px);}
  .qa-side{width:260px;flex:none;background:var(--ink);color:#C7CCC7;padding:22px 0;overflow-y:auto;transition:width .2s,padding .2s;}
  .qa-shell.collapsed .qa-side{width:0;padding:0;overflow:hidden;border:none;}
  .qa-side h6{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding:14px 20px 8px;}
  .qa-side button{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
    color:#C7CCC7;font-family:var(--body);font-size:13.5px;padding:9px 20px;cursor:pointer;border-left:3px solid transparent;
  }
  .qa-side button:hover{background:rgba(255,255,255,.06);color:#fff;}
  .qa-side button.active{background:rgba(47,110,82,.18);color:#fff;border-left-color:var(--pass);font-weight:600;}
  .qa-side button .dot{width:6px;height:6px;border-radius:50%;background:#5b6459;flex:none;}
  .qa-side button.active .dot{background:var(--pass);}
  .qa-main{flex:1;padding:32px 36px 60px;overflow-y:auto;max-width:1180px;}
  .qa-head{margin-bottom:26px;}
  .qa-head .eyebrow{margin-bottom:8px;}
  .qa-head h1{font-size:26px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
  .stat-card{background:var(--card);border:1.5px solid var(--ink);border-radius:5px;padding:18px 16px;}
  .stat-card span{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.05em;}
  .stat-card b{display:block;font-family:var(--display);font-size:28px;margin-top:6px;}

  .panel-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:28px;}
  .panel{background:var(--card);border:1.5px solid var(--ink);border-radius:5px;padding:22px;}
  .panel h3{font-family:var(--display);font-size:16px;margin-bottom:14px;}

  table.qa-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.qa-table th{
    text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink-soft);border-bottom:1.5px solid var(--ink);padding:8px 10px;
  }
  table.qa-table td{padding:8px 10px;border-bottom:1px solid var(--line);}
  table.qa-table tr:last-child td{border-bottom:none;}

  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 20px;}
  .form-grid .field{margin-bottom:16px;}
  .complexity-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line);}
  .complexity-row label{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;}
  .sd-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:13.5px;}
  .sd-grid .sd-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);}
  .sd-grid .sd-row span{color:var(--ink-soft);}
  .sd-colors{margin-top:14px;font-size:13.5px;}
  .sd-colors .sd-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line);}
  .sd-colors .sd-row span{color:var(--ink-soft);}
  .sd-total{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1.5px solid var(--ink);font-size:14.5px;}
  .status-pill{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;}
  .status-pill.Open{background:var(--reject-dim);color:var(--reject);}
  .status-pill.In-Progress{background:#F4EBD2;color:var(--gold);}
  .status-pill.Done{background:var(--pass-dim);color:var(--pass);}

  .color-row{display:grid;gap:12px;align-items:end;margin-bottom:12px;}
  .color-row.ss{grid-template-columns:1fr auto;max-width:520px;}
  .color-row.pp{grid-template-columns:1fr 1fr 1fr auto;}
  .color-row .field{margin:0;}
  .color-row:first-child .cr-remove{visibility:hidden;}

  .insight-item{display:flex;gap:10px;font-size:13px;color:var(--ink-soft);margin-bottom:12px;}
  .insight-item b{color:var(--ink);}

  @media (max-width:920px){
    .qa-shell{flex-direction:column;}
    .qa-side{width:100%;display:flex;overflow-x:auto;padding:8px;}
    .qa-side h6{display:none;}
    .qa-side button{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
    .qa-side button.active{border-left:none;border-bottom-color:var(--pass);}
    .stat-grid{grid-template-columns:1fr 1fr;}
    .panel-grid,.form-grid{grid-template-columns:1fr;}
    .color-row.pp{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="tc-guard-bar" style="background:#1B211D;color:#F1F0EA;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.04em;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9999">
  <a href="dashboard.html" style="color:#F1F0EA;text-decoration:none">&larr; Back to Dashboard</a>
  <span>J.M. FABRICS LIMITED &middot; QA Process</span>
  <span>
    <button id="menuToggle" style="font-family:var(--mono);font-size:11px;background:none;border:1px solid #F1F0EA;color:#F1F0EA;padding:5px 12px;border-radius:2px;cursor:pointer;margin-right:10px">☰ Hide Menu</button>
    <span id="tc-guard-user" style="color:#A9832F"></span>
    <span id="tc-guest-badge" style="display:none;background:#B84226;color:#F1F0EA;padding:3px 9px;border-radius:2px;margin-left:10px;font-size:10.5px;letter-spacing:.06em">VIEW ONLY &middot; GUEST</span>
  </span>
</div>
<script>
window.TC_IS_GUEST = false;
(function(){
  var raw = localStorage.getItem("tc_session") || sessionStorage.getItem("tc_session");
  if (!raw) {
    window.location.href = "login.html";
  } else {
    try {
      var s = JSON.parse(raw);
      window.TC_IS_GUEST = /guest|visitor/i.test(s.role || "");
      document.addEventListener("DOMContentLoaded", function(){
        var el = document.getElementById("tc-guard-user");
        if (el) el.textContent = s.name || "";
        var badge = document.getElementById("tc-guest-badge");
        if (badge && window.TC_IS_GUEST) badge.style.display = "inline-block";
      });
    } catch(e) {}
  }
})();

function tcBlockIfGuest(actionLabel) {
  if (window.TC_IS_GUEST) {
    alert("You're signed in as a Guest (View Only). " + (actionLabel || "This action") + " is disabled for guest accounts.\n\nAsk an administrator for a full account to " + (actionLabel ? actionLabel.toLowerCase() : "make changes") + ".");
    return true;
  }
  return false;
}
</script>

<div class="qa-shell" id="qaShell">
  <nav class="qa-side" id="qaSide">
    <div id="qaSideSticky" style="position:sticky;top:0;background:var(--ink);z-index:5;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:6px">
      <h6 style="padding-top:0">Dashboard</h6>
      <button data-tab="overview" class="active"><span class="dot"></span>Overview</button>
      <button data-tab="styletracking"><span class="dot"></span>Style Tracking</button>
    </div>
    <h6>Quality Process</h6>
    <div id="processNav"></div>
    <h6>QA Inspection</h6>
    <div id="qaNav"></div>
  </nav>

  <main class="qa-main">
    <div id="tabContent"></div>
  </main>
</div>

<script>
// ---------------------------------------------------------------
// Stage config — drives the sidebar nav and the shared stage-form
// template, so we don't hand-write 20 near-identical HTML blocks.
// ---------------------------------------------------------------
const PROCESS_STAGES = [
  { id: "pdc", label: "Product Development Center (PDC)" },
  { id: "ra", label: "Risk Assessment (RA)" },
  { id: "rm", label: "Raw Materials (Fabrics & Trims)" },
  { id: "sizeset", label: "Size-Set" },
  { id: "pilot", label: "Pilot Run" },
  { id: "ppmeeting", label: "PP Meeting" },
  { id: "cutting", label: "Cutting" },
  { id: "print", label: "Print" },
  { id: "embroidery", label: "Embroidery" },
  { id: "sewing", label: "Sewing" },
  { id: "wash", label: "Wash" },
  { id: "heatseal", label: "Heat-Seal" },
  { id: "physicalfunctional", label: "Physical/Functional Test" },
  { id: "testing", label: "Testing" },
  { id: "finishing", label: "Finishing" },
  { id: "packing", label: "Packing Accuracy" },
];
const QA_STAGES = [
  { id: "bundle1", label: "1st Bundle" },
  { id: "sewinginline", label: "Sewing Inline" },
  { id: "finishinginline", label: "Finishing Inline" },
  { id: "carton1", label: "1st Carton" },
  { id: "prefinal", label: "Pre-Final Inspection" },
  { id: "final", label: "Final Inspection" },
];
const ALL_STAGES = [...PROCESS_STAGES, ...QA_STAGES];

const QA_API_URL = "https://script.google.com/macros/s/AKfycbzZ2Kn-5XlYWyJL2x9eYwtuQwm9dWNX8okS47B4Bjh8OcMQkMhwuZEJapfPaW68ZVIZ/exec";

function esc(s){ return (s||"").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ---- Sidebar nav build ----
const processNav = document.getElementById("processNav");
PROCESS_STAGES.forEach(s => {
  const btn = document.createElement("button");
  btn.dataset.tab = s.id;
  btn.innerHTML = `<span class="dot"></span>${esc(s.label)}`;
  processNav.appendChild(btn);
});
const qaNav = document.getElementById("qaNav");
QA_STAGES.forEach(s => {
  const btn = document.createElement("button");
  btn.dataset.tab = s.id;
  btn.innerHTML = `<span class="dot"></span>${esc(s.label)}`;
  qaNav.appendChild(btn);
});

document.getElementById("menuToggle").addEventListener("click", () => {
  const shell = document.getElementById("qaShell");
  shell.classList.toggle("collapsed");
  document.getElementById("menuToggle").textContent = shell.classList.contains("collapsed") ? "☰ Show Menu" : "☰ Hide Menu";
});

document.getElementById("qaSide").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  document.querySelectorAll(".qa-side button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  loadTab(btn.dataset.tab);
});

async function qaApi(payload) {
  if (QA_API_URL.indexOf("PASTE_YOUR") === 0) {
    throw new Error("QA Process backend not connected yet — see qa-process-backend.gs for setup steps.");
  }
  const res = await fetch(QA_API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  });
  return res.json();
}

// ---------------------------------------------------------------
// Shared "Select Style" (SBU → Buyer → IR) + "Style Details" widget.
// Used on every RA-to-Final-Inspection stage page, the RA form, and
// Style Tracking, so the same lookup/preview looks identical everywhere.
// ---------------------------------------------------------------
async function fetchSbus() {
  const res = await qaApi({ action: "listSbus" });
  return res.ok ? res.sbus : [];
}
async function fetchBuyers(sbu) {
  const res = await qaApi({ action: "listBuyers", sbu });
  return res.ok ? res.buyers : [];
}
async function fetchIrs(sbu, buyer) {
  const res = await qaApi({ action: "listIrs", sbu, buyer });
  return res.ok ? res.irs : [];
}
async function fetchOrderDetail(sbu, buyer, ir) {
  const res = await qaApi({ action: "getOrderDetail", sbu, buyer, ir });
  return res.ok ? res.detail : null;
}

function styleDetailsHTML(detail) {
  if (!detail) return `<div style="color:var(--ink-soft)">No matching row found in OrderInfo for this SBU/Buyer/IR.</div>`;
  const rows = [
    ["Style Name", detail.styleName],
    ["Style Description", detail.styleDescription],
    ["Item / Product Dept", [detail.item, detail.productDept].filter(Boolean).join(" / ")],
    ["Season", detail.season],
    ["Embellishment Category", detail.embellishmentCategory],
  ];
  return `
    <div class="sd-grid">
      ${rows.map(([k, v]) => `<div class="sd-row"><span>${esc(k)}</span><b>${esc(v || "—")}</b></div>`).join("")}
    </div>
    <div class="sd-colors">
      <div style="font-family:var(--display);font-size:14px;margin-bottom:4px">Color-wise Order Qty</div>
      ${(detail.colors || []).map(c => `<div class="sd-row"><span>${esc(c.color)}</span><b>${esc(String(c.qty))}</b></div>`).join("")}
    </div>
    <div class="sd-total"><span>Total Style Order Qty</span><b>${esc(String(detail.totalQty || 0))}</b></div>
  `;
}

function styleSelectorHTML(prefix) {
  return `
    <div class="panel" style="margin-bottom:24px">
      <h3 style="display:flex;align-items:center;justify-content:space-between">
        <span>Select Style</span>
        <label style="font-weight:400;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="${prefix}ManualToggle" style="width:auto"> Manual Entry
        </label>
      </h3>
      <div id="${prefix}LookupFields" class="form-grid">
        <div class="field"><label>SBU</label><select id="${prefix}Sbu"><option value="">Loading…</option></select></div>
        <div class="field"><label>Buyer</label><select id="${prefix}Buyer"><option value="">Select SBU first</option></select></div>
        <div class="field"><label>IR No</label><select id="${prefix}Ir"><option value="">Select Buyer first</option></select></div>
      </div>
      <div id="${prefix}ManualFields" class="form-grid" style="display:none">
        <div class="field"><label>SBU</label><input type="text" id="${prefix}ManualSbu" placeholder="Type SBU"></div>
        <div class="field"><label>Buyer</label><input type="text" id="${prefix}ManualBuyer" placeholder="Type Buyer"></div>
        <div class="field"><label>IR No</label><input type="text" id="${prefix}ManualIr" placeholder="Type IR No"></div>
      </div>
    </div>
    <div class="panel" style="margin-bottom:24px">
      <h3>Style Details</h3>
      <div id="${prefix}Details" style="color:var(--ink-soft)">Select SBU → Buyer → IR to see style details.</div>
      <div id="${prefix}ManualDetails" class="form-grid" style="display:none">
        <div class="field"><label>Style Name</label><input type="text" id="${prefix}ManualStyleName"></div>
        <div class="field"><label>Style Description</label><input type="text" id="${prefix}ManualStyleDesc"></div>
        <div class="field"><label>Item</label><input type="text" id="${prefix}ManualItem"></div>
        <div class="field"><label>Product Dept</label><input type="text" id="${prefix}ManualProductDept"></div>
        <div class="field"><label>Season</label><input type="text" id="${prefix}ManualSeason"></div>
        <div class="field"><label>Embellishment Category</label><input type="text" id="${prefix}ManualEmbCat"></div>
        <div class="field"><label>Total Style Order Qty</label><input type="number" id="${prefix}ManualTotalQty" placeholder="0"></div>
      </div>
    </div>
  `;
}

// Wires up the three dropdowns rendered by styleSelectorHTML(prefix), PLUS
// the "Manual Entry" toggle and its free-text fields. onChange(sel) fires
// on every change with { sbu, buyer, ir, detail, manual }. Downstream code
// (SizeSet, PP Meeting, Testing, RA, Entries, Style Tracking) doesn't need
// to know which mode produced sel — it looks the same either way.
// Returns a controller with getSel() and setSel(presel) for prefill.
function wireStyleSelector(prefix, onChange) {
  const sbuEl = document.getElementById(prefix + "Sbu");
  const buyerEl = document.getElementById(prefix + "Buyer");
  const irEl = document.getElementById(prefix + "Ir");
  const detailsEl = document.getElementById(prefix + "Details");
  const manualToggle = document.getElementById(prefix + "ManualToggle");
  const lookupFieldsEl = document.getElementById(prefix + "LookupFields");
  const manualFieldsEl = document.getElementById(prefix + "ManualFields");
  const manualDetailsEl = document.getElementById(prefix + "ManualDetails");
  const mSbuEl = document.getElementById(prefix + "ManualSbu");
  const mBuyerEl = document.getElementById(prefix + "ManualBuyer");
  const mIrEl = document.getElementById(prefix + "ManualIr");
  const mStyleNameEl = document.getElementById(prefix + "ManualStyleName");
  const mStyleDescEl = document.getElementById(prefix + "ManualStyleDesc");
  const mItemEl = document.getElementById(prefix + "ManualItem");
  const mProductDeptEl = document.getElementById(prefix + "ManualProductDept");
  const mSeasonEl = document.getElementById(prefix + "ManualSeason");
  const mEmbCatEl = document.getElementById(prefix + "ManualEmbCat");
  const mTotalQtyEl = document.getElementById(prefix + "ManualTotalQty");
  let sel = { sbu: "", buyer: "", ir: "", detail: null, manual: false };

  async function refreshSbus() {
    sbuEl.innerHTML = `<option value="">Loading…</option>`;
    const sbus = await fetchSbus();
    sbuEl.innerHTML = `<option value="">Select SBU…</option>` + sbus.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  }
  async function refreshBuyers() {
    buyerEl.innerHTML = `<option value="">Loading…</option>`;
    irEl.innerHTML = `<option value="">Select Buyer first</option>`;
    const buyers = await fetchBuyers(sel.sbu);
    buyerEl.innerHTML = `<option value="">Select Buyer…</option>` + buyers.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join("");
  }
  async function refreshIrs() {
    irEl.innerHTML = `<option value="">Loading…</option>`;
    const irs = await fetchIrs(sel.sbu, sel.buyer);
    irEl.innerHTML = `<option value="">Select IR…</option>` + irs.map(i => `<option value="${esc(i)}">${esc(i)}</option>`).join("");
  }
  async function refreshDetail() {
    detailsEl.textContent = "Loading…";
    sel.detail = await fetchOrderDetail(sel.sbu, sel.buyer, sel.ir);
    detailsEl.innerHTML = styleDetailsHTML(sel.detail);
    onChange(sel);
  }

  sbuEl.addEventListener("change", () => {
    sel = { sbu: sbuEl.value, buyer: "", ir: "", detail: null, manual: false };
    detailsEl.innerHTML = `Select Buyer → IR to see style details.`;
    refreshBuyers();
    onChange(sel);
  });
  buyerEl.addEventListener("change", () => {
    sel.buyer = buyerEl.value; sel.ir = ""; sel.detail = null;
    detailsEl.innerHTML = `Select IR to see style details.`;
    refreshIrs();
    onChange(sel);
  });
  irEl.addEventListener("change", () => {
    sel.ir = irEl.value;
    if (sel.ir) refreshDetail();
    else { sel.detail = null; detailsEl.innerHTML = `Select IR to see style details.`; onChange(sel); }
  });

  // ---- Manual Entry mode ----
  function pushManualChange() {
    sel = {
      sbu: mSbuEl.value.trim(),
      buyer: mBuyerEl.value.trim(),
      ir: mIrEl.value.trim(),
      manual: true,
      detail: {
        styleName: mStyleNameEl.value.trim(),
        styleDescription: mStyleDescEl.value.trim(),
        item: mItemEl.value.trim(),
        productDept: mProductDeptEl.value.trim(),
        season: mSeasonEl.value.trim(),
        embellishmentCategory: mEmbCatEl.value.trim(),
        totalQty: Number(mTotalQtyEl.value || 0),
        colors: []
      }
    };
    onChange(sel);
  }
  [mSbuEl, mBuyerEl, mIrEl, mStyleNameEl, mStyleDescEl, mItemEl, mProductDeptEl, mSeasonEl, mEmbCatEl, mTotalQtyEl]
    .forEach(el => el.addEventListener("input", pushManualChange));

  manualToggle.addEventListener("change", () => {
    const isManual = manualToggle.checked;
    lookupFieldsEl.style.display = isManual ? "none" : "";
    detailsEl.style.display = isManual ? "none" : "";
    manualFieldsEl.style.display = isManual ? "" : "none";
    manualDetailsEl.style.display = isManual ? "" : "none";
    if (isManual) {
      pushManualChange();
    } else {
      sel = { sbu: "", buyer: "", ir: "", detail: null, manual: false };
      sbuEl.value = ""; buyerEl.innerHTML = `<option value="">Select SBU first</option>`; irEl.innerHTML = `<option value="">Select Buyer first</option>`;
      detailsEl.innerHTML = `Select SBU → Buyer → IR to see style details.`;
      onChange(sel);
    }
  });

  refreshSbus();

  return {
    getSel: () => sel,
    setSel: async (presel) => {
      if (!presel) return;
      await refreshSbus();
      if (presel.sbu) {
        sbuEl.value = presel.sbu; sel.sbu = presel.sbu;
        await refreshBuyers();
      }
      if (presel.buyer) {
        buyerEl.value = presel.buyer; sel.buyer = presel.buyer;
        await refreshIrs();
      }
      if (presel.ir) {
        irEl.value = presel.ir; sel.ir = presel.ir;
        await refreshDetail();
      }
    }
  };
}

// ---------------------------------------------------------------
// Tab router
// ---------------------------------------------------------------
function loadTab(id) {
  if (id === "overview") return renderOverview();
  if (id === "styletracking") return renderStyleTracking();
  if (id === "sizeset") return renderSizeSet();
  if (id === "ppmeeting") return renderPPMeeting();
  if (id === "physicalfunctional") return renderPhysicalFunctional();
  if (id === "testing") return renderTesting();
  if (id === "print" || id === "embroidery" || id === "wash" || id === "heatseal") {
    const st = ALL_STAGES.find(s => s.id === id);
    return renderAqlProcessStage(id, st.label);
  }
  if (id === "ra") return renderRiskAssessment();
  const stage = ALL_STAGES.find(s => s.id === id);
  if (stage) return renderStage(stage);
}

// ---------------------------------------------------------------
// Overview tab
// ---------------------------------------------------------------
async function renderOverview() {
  const el = document.getElementById("tabContent");
  const prevStart = document.getElementById("ovStart") ? document.getElementById("ovStart").value : "";
  const prevEnd = document.getElementById("ovEnd") ? document.getElementById("ovEnd").value : "";
  el.innerHTML = `
    <div class="qa-head">
      <div class="eyebrow">Quality Assurance</div>
      <h1>Overview</h1>
    </div>
    <div class="panel" style="margin-bottom:20px;display:flex;gap:14px;align-items:end;flex-wrap:wrap">
      <div class="field" style="margin:0"><label>Start Date</label><input type="date" id="ovStart" value="${prevStart}"></div>
      <div class="field" style="margin:0"><label>End Date</label><input type="date" id="ovEnd" value="${prevEnd}"></div>
      <button class="btn btn-primary" onclick="renderOverview()">Apply Filter →</button>
      <button class="btn btn-ghost" onclick="document.getElementById('ovStart').value='';document.getElementById('ovEnd').value='';renderOverview();">Clear</button>
    </div>
    <div class="stat-grid" id="qaStatGrid">
      <div class="stat-card"><span>Total QA Entries</span><b>—</b></div>
      <div class="stat-card"><span>Open</span><b>—</b></div>
      <div class="stat-card"><span>In Progress</span><b>—</b></div>
      <div class="stat-card"><span>Done</span><b>—</b></div>
    </div>
    <div class="panel" style="margin-bottom:28px"><h3>Entries by Stage</h3><canvas id="stageChart"></canvas></div>
    <div class="panel-grid" style="grid-template-columns:1.4fr 1fr">
      <div class="panel">
        <h3>Stage-wise Status Summary</h3>
        <table class="qa-table" id="stageTable">
          <thead><tr><th>Stage</th><th>Total</th><th>Open</th><th>In Progress</th><th>Done</th></tr></thead>
          <tbody><tr><td colspan="5" style="text-align:center;color:var(--ink-soft)">Loading…</td></tr></tbody>
        </table>
      </div>
      <div class="panel">
        <h3>Key Insights</h3>
        <div id="qaInsights"><div class="insight-item">Loading insights…</div></div>
      </div>
    </div>
  `;

  try {
    const res = await qaApi({ action: "overview", start: prevStart || null, end: prevEnd || null });
    if (!res.ok) throw new Error(res.error || "Failed to load overview");
    const s = res.summary;

    let openN = 0, progN = 0, doneN = 0;
    Object.keys(s.byStage || {}).forEach(k => {
      const d = s.byStage[k];
      openN += d.open || 0; progN += d.inProgress || 0; doneN += d.done || 0;
    });

    const grid = document.getElementById("qaStatGrid");
    grid.innerHTML = `
      <div class="stat-card"><span>Total QA Entries</span><b>${s.totalEntries}</b></div>
      <div class="stat-card"><span>Open</span><b>${openN}</b></div>
      <div class="stat-card"><span>In Progress</span><b>${progN}</b></div>
      <div class="stat-card"><span>Done</span><b>${doneN}</b></div>
    `;

    const stageLabels = ALL_STAGES.map(x => x.label);
    const stageCounts = ALL_STAGES.map(x => (s.byStage[x.id] || {}).total || 0);
    new Chart(document.getElementById("stageChart"), {
      type: "bar",
      data: { labels: stageLabels, datasets: [{ label: "Entries", data: stageCounts, backgroundColor: "#2F6E52" }] },
      options: { aspectRatio: 3, plugins: { legend: { display: false } }, scales: { x: { ticks: { font: { size: 9 } } } } }
    });

    const tbody = document.querySelector("#stageTable tbody");
    tbody.innerHTML = ALL_STAGES.map(x => {
      const d = s.byStage[x.id] || { total: 0, open: 0, inProgress: 0, done: 0 };
      return `<tr><td>${esc(x.label)}</td><td>${d.total}</td><td>${d.open}</td><td>${d.inProgress}</td><td>${d.done}</td></tr>`;
    }).join("");

    const busiest = ALL_STAGES.map(x => ({ label: x.label, total: (s.byStage[x.id] || {}).total || 0 })).sort((a, b) => b.total - a.total)[0];
    document.getElementById("qaInsights").innerHTML = `
      <div class="insight-item">📋 <span><b>${s.totalEntries}</b> QA entries logged across all stages.</span></div>
      <div class="insight-item">🎯 <span>Most active stage: <b>${busiest ? esc(busiest.label) : "—"}</b> (${busiest ? busiest.total : 0} entries).</span></div>
      <div class="insight-item">⏳ <span><b>${openN + progN}</b> entries are still Open or In Progress — follow these up first.</span></div>
    `;
  } catch (err) {
    document.getElementById("qaStatGrid").innerHTML = `<div class="stat-card" style="grid-column:1/-1"><span style="color:var(--reject)">${esc(err.message)}</span></div>`;
  }
}

// ---------------------------------------------------------------
// Style Tracking tab — SBU → Buyer → IR (this module's own OrderInfo
// master data), shows the Risk Assessment submitted in this Quality
// Process module for that IR, then rolls up every process/QA stage's
// Entries to flag what's missing, in progress, done, or logged more
// than once — plus a process-wise summary count at a glance.
// ---------------------------------------------------------------
let stSelected = { sbu: "", buyer: "", ir: "" };
let stkCtrl = null;

function renderStyleTracking() {
  const el = document.getElementById("tabContent");
  el.innerHTML = `
    <div class="qa-head">
      <div class="eyebrow">Quality Process</div>
      <h1>Style Tracking</h1>
    </div>
    ${styleSelectorHTML("stk")}
    <div id="stkResults"></div>
  `;
  stkCtrl = wireStyleSelector("stk", (sel) => {
    stSelected = { sbu: sel.sbu, buyer: sel.buyer, ir: sel.ir };
    if (sel.ir) loadStyleTrackingResults();
    else document.getElementById("stkResults").innerHTML = "";
  });
}

async function loadStyleTrackingResults() {
  const el = document.getElementById("stkResults");
  el.innerHTML = `<div class="panel">Loading style progress…</div>`;
  try {
    const [raListRes, statusRes] = await Promise.all([
      qaApi({ action: "listQualityRA" }),
      qaApi({ action: "styleStatus", irNo: stSelected.ir, styleNo: (stkCtrl.getSel().detail || {}).styleName || "" }),
    ]);
    const raEntry = (raListRes.ok ? raListRes.entries : []).find(e =>
      String(e.sbu).trim() === stSelected.sbu && String(e.buyer).trim() === stSelected.buyer && String(e.ir).trim() === stSelected.ir
    );
    const byStage = statusRes.ok ? statusRes.byStage : {};

    // Process-wise summary counts
    let doneN = 0, progN = 0, missN = 0, overlapN = 0;
    ALL_STAGES.forEach(s => {
      const rows = byStage[s.id] || [];
      if (rows.length > 1) overlapN++;
      else if (rows.length === 0) missN++;
      else if (rows[0].status === "Done") doneN++;
      else progN++;
    });

    el.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px">
        <div class="stat-card"><span>Done</span><div style="font-family:var(--display);font-size:22px;color:var(--pass)">${doneN}</div></div>
        <div class="stat-card"><span>In Progress / Open</span><div style="font-family:var(--display);font-size:22px;color:var(--gold)">${progN}</div></div>
        <div class="stat-card"><span>Missing</span><div style="font-family:var(--display);font-size:22px;color:var(--reject)">${missN}</div></div>
        <div class="stat-card"><span>⚠ Overlap</span><div style="font-family:var(--display);font-size:22px;color:var(--reject)">${overlapN}</div></div>
      </div>
      <div class="panel" style="margin-bottom:20px">
        <h3>Risk Assessment (RA)</h3>
        ${raEntry ? `
          <div style="margin-bottom:10px">
            <span class="status-pill ${raEntry.riskDecision === "Accept" ? "Done" : raEntry.riskDecision === "Reject" ? "Open" : "In-Progress"}">${esc(raEntry.riskDecision || "—")}</span>
            <span style="margin-left:10px;color:var(--ink-soft);font-size:13px">${esc(raEntry.orderType || "")} order &middot; RA by ${esc(raEntry.raBy || "—")} on ${esc(raEntry.raDate || "—")}</span>
          </div>
          <table class="qa-table">
            <thead><tr><th>Process</th><th>Changed?</th><th>Seasonal Changes (If Any)</th></tr></thead>
            <tbody>
              ${Object.keys(raEntry.changes || {}).map(k => `
                <tr><td>${esc(k)}</td><td>${esc((raEntry.changes[k]||{}).status || '—')}</td><td>${esc((raEntry.changes[k]||{}).notes || '')}</td></tr>
              `).join("")}
            </tbody>
          </table>
          ${raEntry.actionComments ? `<div style="margin-top:10px;font-size:13.5px"><b>Action and Comments:</b> ${esc(raEntry.actionComments)}</div>` : ""}
        ` : `<div style="color:var(--ink-soft)">No Risk Assessment submitted yet for this IR — go to the Risk Assessment (RA) stage.</div>`}
      </div>
      <div class="panel">
        <h3>Stage-by-Stage Progress</h3>
        <table class="qa-table">
          <thead><tr><th>Stage</th><th>Status</th><th>Entries</th><th>Last Update</th><th></th></tr></thead>
          <tbody>
            ${ALL_STAGES.map(s => {
              const rows = byStage[s.id] || [];
              let pillClass = "Open", label = "Missing";
              if (rows.length > 1) { pillClass = "Open"; label = "⚠ Overlap (" + rows.length + ")"; }
              else if (rows.length === 1) { label = rows[0].status || "Open"; pillClass = (rows[0].status || "Open").replace(" ", "-"); }
              const last = rows.length ? rows[rows.length - 1].timestamp : "—";
              return `
                <tr>
                  <td>${esc(s.label)}</td>
                  <td><span class="status-pill ${esc(pillClass)}">${esc(label)}</span></td>
                  <td>${rows.length}</td>
                  <td>${esc(String(last))}</td>
                  <td><button class="btn btn-ghost" style="padding:4px 10px;font-size:11.5px" onclick="goToStageForTracking('${s.id}')">+ Add Entry</button></td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  } catch (err) {
    el.innerHTML = `<div class="panel" style="color:var(--reject)">${esc(err.message)}</div>`;
  }
}

function goToStageForTracking(stageId) {
  const stage = ALL_STAGES.find(s => s.id === stageId);
  if (!stage) return;
  document.querySelectorAll(".qa-side button").forEach(b => b.classList.remove("active"));
  const detail = document.querySelector(`.qa-side button[data-tab="${stageId}"]`);
  if (detail) detail.classList.add("active");
  const presel = { sbu: stSelected.sbu, buyer: stSelected.buyer, ir: stSelected.ir };
  if (stageId === "ppmeeting") { renderPPMeeting(); ppSelCtrl.setSel(presel); return; }
  renderStage(stage, presel);
}

// ---------------------------------------------------------------
// Shared color-row helpers — Size-Set and PP Meeting both pick colors
// from the selected IR's Master Order Information (detail.colors) and
// let the user add more rows when a style has 2+ colors.
//   kind "ss" → color only
//   kind "pp" → color + fiber composition + fabric type
// ---------------------------------------------------------------
let colorDetail = { ss: null, pp: null, pf: null, aql: null };

function colorOptionsHTML(detail, selected) {
  const names = ((detail && detail.colors) || []).map(c => c.color).filter(Boolean);
  const head = names.length ? "Select color…" : "Select IR first, or choose Other";
  const opts = [`<option value="">${head}</option>`]
    .concat(names.map(n => `<option value="${esc(n)}"${n === selected ? " selected" : ""}>${esc(n)}</option>`))
    .concat([`<option value="__custom__"${selected === "__custom__" ? " selected" : ""}>Other (type manually)…</option>`]);
  return opts.join("");
}

function addColorRow(kind) {
  const box = document.getElementById(kind + "ColorRows");
  if (!box) return;
  const row = document.createElement("div");
  row.className = "color-row " + kind;
  row.innerHTML = `
    <div class="field"><label>${kind === "pp" ? "Color Name" : "Color"}</label>
      <select class="cr-color">${colorOptionsHTML(colorDetail[kind], "")}</select>
      <input class="cr-color-custom" placeholder="Type color name" style="display:none;margin-top:6px">
    </div>
    ${kind === "pp" ? `
    <div class="field"><label>Fiber Composition</label><input class="cr-fiber" placeholder="e.g. 92% Cotton 8% Elastane"></div>
    <div class="field"><label>Fabric Type</label><input class="cr-fabric" placeholder="e.g. Single Jersey"></div>` : ""}
    <button type="button" class="btn btn-ghost cr-remove" title="Remove this color" onclick="removeColorRow(this)">✕</button>
  `;
  box.appendChild(row);
  const selEl = row.querySelector(".cr-color");
  const customEl = row.querySelector(".cr-color-custom");
  selEl.addEventListener("change", () => {
    customEl.style.display = selEl.value === "__custom__" ? "" : "none";
  });
}

function removeColorRow(btn) {
  const row = btn.closest(".color-row");
  if (row) row.remove();
}

// Called whenever the SBU → Buyer → IR selection changes.
function refreshColorOptions(kind, detail) {
  colorDetail[kind] = detail || null;
  document.querySelectorAll(`#${kind}ColorRows .color-row`).forEach(row => {
    const selEl = row.querySelector(".cr-color");
    const customEl = row.querySelector(".cr-color-custom");
    const wasCustom = selEl.value === "__custom__";
    selEl.innerHTML = colorOptionsHTML(colorDetail[kind], selEl.value);
    if (customEl) customEl.style.display = wasCustom ? "" : "none";
  });
}

function getColorRows(kind) {
  return Array.from(document.querySelectorAll(`#${kind}ColorRows .color-row`)).map(r => {
    const selEl = r.querySelector(".cr-color");
    const customEl = r.querySelector(".cr-color-custom");
    const color = selEl.value === "__custom__" ? (customEl ? customEl.value.trim() : "") : selEl.value;
    return {
      color: color,
      fiber: r.querySelector(".cr-fiber") ? r.querySelector(".cr-fiber").value.trim() : "",
      fabric: r.querySelector(".cr-fabric") ? r.querySelector(".cr-fabric").value.trim() : "",
    };
  });
}

async function savePPMeeting() {
  if (typeof tcBlockIfGuest === 'function' && tcBlockIfGuest('Saving a PP Meeting entry')) return;
  const msg = document.getElementById("ppMsg");
  const sel = ppSelCtrl ? ppSelCtrl.getSel() : { ir: "", detail: null };
  if (!sel.ir) {
    msg.textContent = "Select SBU, Buyer, and IR first.";
    msg.className = "form-msg err show";
    return;
  }
  const d = sel.detail || {};
  const comments = {};
  PP_COMMENT_FIELDS.forEach((f, i) => { comments[f] = document.getElementById("ppc_" + i).value; });
  const entry = {
    date: document.getElementById("ppDate").value,
    ppBy: document.getElementById("ppBy").value,
    sbu: sel.sbu,
    buyer: sel.buyer,
    ir: sel.ir,
    styleNo: d.styleName || "",
    season: d.season || "",
    item: d.item || "",
    orderType: document.getElementById("ppOrderType").value,
    embellishmentType: document.getElementById("ppEmb").value,
    productType: document.getElementById("ppProductType").value,
    plannedQty: document.getElementById("ppPlannedQty").value,
    colors: getColorRows("pp").filter(r => r.color || r.fiber || r.fabric),
    requirementsReview: document.getElementById("ppReview").value,
    comments: comments,
  };
  try {
    const res = await qaApi({ action: "savePPMeeting", entry: entry });
    if (!res.ok) throw new Error(res.error || "Save failed");
    msg.textContent = "PP Meeting entry saved.";
    msg.className = "form-msg ok show";
    loadPPMeetingEntries();
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "form-msg err show";
  }
}

async function loadPPMeetingEntries() {
  const tbody = document.querySelector("#ppTable tbody");
  if (!tbody) return;
  try {
    const res = await qaApi({ action: "listPPMeeting" });
    if (!res.ok) throw new Error(res.error || "Failed to load");
    if (!res.entries.length) { tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--ink-soft)">No entries yet.</td></tr>`; return; }
    tbody.innerHTML = res.entries.slice().reverse().map(e => `
      <tr><td>${esc(e.date)}</td><td>${esc(e.sbu)}</td><td>${esc(e.buyer)}</td><td>${esc(e.ir)}</td><td>${esc(e.styleNo)}</td><td>${esc(e.ppBy)}</td><td>${esc(e.requirementsReview)}</td></tr>
    `).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--reject)">${esc(err.message)}</td></tr>`;
  }
}

// ---------------------------------------------------------------
// Physical/Functional Test tab (matches Physical__Functionality_
// Testing.xlsx). Sits right after Wash in the pipeline. Same shared
// Style Selector (with Manual Entry) as every other stage. Selecting a
// Checking Point auto-shows its Checking Method/Guideline; Defect %
// auto-calculates from Sample Checked / Fail Qty.
// ---------------------------------------------------------------
let pfSelCtrl = null;

const PF_CHECKPOINTS = [
  "Zipper Function", "Button Pull / Attachment", "Snap Function", "Seam Strength",
  "Elastic Recovery", "Drawcord Safety", "Velcro Function", "Print Durability",
  "Embroidery Safety", "Pocket Function", "Buckle / Adjuster", "Metal Detection"
];

const PF_CHECKPOINT_METHODS = {
  "Zipper Function": "Run zipper up & down 3–5 times to check smooth movement, auto-lock, and stopper security.",
  "Button Pull / Attachment": "Apply manual pull or gauge test to ensure secure attachment with no loosening or damage.",
  "Snap Function": "Open and close snap 3–5 times to verify proper locking, alignment, and durability.",
  "Seam Strength": "Apply light manual tension on stress areas to ensure no seam opening, slippage, or stitch breakage.",
  "Elastic Recovery": "Stretch elastic and release to check proper recovery and ensure no twisting inside casing.",
  "Drawcord Safety": "Measure length, pull both ends, and check stopper to ensure safety compliance and secure attachment.",
  "Velcro Function": "Attach and detach 3–5 times to verify adhesion strength and secure stitching.",
  "Print Durability": "Lightly stretch and rub printed area to check for cracking, peeling, or damage.",
  "Embroidery Safety": "Check for loose threads, trimmed ends, and secure stitching with no sharp backing.",
  "Pocket Function": "Insert hand to verify opening usability, proper depth, and secure stitching or closure.",
  "Buckle / Adjuster": "Operate multiple times to ensure smooth adjustment, proper locking, and no defects.",
  "Metal Detection": "Pass garment through metal detector to confirm no metal contamination and proper machine function."
};

function refreshPfColor(detail) {
  colorDetail.pf = detail || null;
  const sel = document.getElementById("pfColor");
  const custom = document.getElementById("pfColorCustom");
  if (!sel) return;
  const wasCustom = sel.value === "__custom__";
  sel.innerHTML = colorOptionsHTML(colorDetail.pf, sel.value);
  if (custom) custom.style.display = wasCustom ? "" : "none";
}

function updatePfMethods() {
  const checked = Array.from(document.querySelectorAll(".pf-cp:checked")).map(c => c.value);
  const methodsEl = document.getElementById("pfMethods");
  if (!methodsEl) return;
  if (!checked.length) { methodsEl.innerHTML = `Select checking points above to see the method.`; return; }
  methodsEl.innerHTML = checked.map(cp =>
    `<div class="sd-row"><span>${esc(cp)}</span><b>${esc(PF_CHECKPOINT_METHODS[cp] || "—")}</b></div>`
  ).join("");
}

function updatePfDefectPct() {
  const sample = Number(document.getElementById("pfSample").value || 0);
  const fail = Number(document.getElementById("pfFail").value || 0);
  const pct = sample > 0 ? ((fail / sample) * 100).toFixed(1) : "0.0";
  document.getElementById("pfDefectPct").value = pct + "%";
}

async function savePhysicalFunctional() {
  if (typeof tcBlockIfGuest === 'function' && tcBlockIfGuest('Saving a Physical/Functional Test entry')) return;
  const msg = document.getElementById("pfMsg");
  const sel = pfSelCtrl ? pfSelCtrl.getSel() : { ir: "", detail: null };
  if (!sel.ir) {
    msg.textContent = "Select SBU, Buyer, and IR first (or switch on Manual Entry above).";
    msg.className = "form-msg err show";
    return;
  }
  const d = sel.detail || {};
  const colorSel = document.getElementById("pfColor");
  const colorCustom = document.getElementById("pfColorCustom");
  const color = colorSel.value === "__custom__" ? colorCustom.value.trim() : colorSel.value;
  const sample = Number(document.getElementById("pfSample").value || 0);
  const pass = Number(document.getElementById("pfPass").value || 0);
  const fail = Number(document.getElementById("pfFail").value || 0);
  const defectPct = sample > 0 ? ((fail / sample) * 100).toFixed(1) : "0.0";
  const checkpoints = Array.from(document.querySelectorAll(".pf-cp:checked")).map(c => c.value);
  const entry = {
    date: document.getElementById("pfDate").value,
    time: document.getElementById("pfTime").value,
    auditBy: document.getElementById("pfAuditBy").value,
    line: document.getElementById("pfLine").value,
    sbu: sel.sbu,
    buyer: sel.buyer,
    ir: sel.ir,
    styleNo: d.styleName || "",
    color: color,
    checkpoints: checkpoints,
    sampleChecked: sample,
    passQty: pass,
    failQty: fail,
    defectPct: defectPct,
    defectType: document.getElementById("pfDefectType").value,
    comments: document.getElementById("pfComments").value,
    correctiveAction: document.getElementById("pfCorrectiveAction").value,
  };
  try {
    const res = await qaApi({ action: "savePhysicalFunctional", entry: entry });
    if (!res.ok) throw new Error(res.error || "Save failed");
    msg.textContent = "Entry saved.";
    msg.className = "form-msg ok show";
    loadPhysicalFunctionalEntries();
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "form-msg err show";
  }
}

async function loadPhysicalFunctionalEntries() {
  const tbody = document.querySelector("#pfTable tbody");
  if (!tbody) return;
  try {
    const res = await qaApi({ action: "listPhysicalFunctional" });
    if (!res.ok) throw new Error(res.error || "Failed to load");
    if (!res.entries.length) { tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:var(--ink-soft)">No entries yet.</td></tr>`; return; }
    tbody.innerHTML = res.entries.slice().reverse().map(e =>
      `<tr><td>${esc(e.date)}</td><td>${esc(e.sbu)}</td><td>${esc(e.buyer)}</td><td>${esc(e.ir)}</td><td>${esc(e.styleNo)}</td><td>${esc(e.color)}</td><td>${esc(e.sampleChecked)}</td><td>${esc(e.failQty)}</td><td>${esc(e.defectPct)}%</td></tr>`
    ).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:var(--reject)">${esc(err.message)}</td></tr>`;
  }
}

        <thead><tr><th>Date</th><th>Mode</th><th>SBU</th><th>Buyer</th><th>IR</th><th>Style</th><th>Color</th><th>Result</th></tr></thead>
        <tbody><tr><td colspan="8" style="text-align:center;color:var(--ink-soft)">Loading…</td></tr></tbody>
      </table>
    </div>
  `;

  aqlSelCtrl = wireStyleSelector("aql", (sel) => {
    refreshAqlColor(sel.detail);
    document.getElementById("aqlBuyer").value = sel.buyer || "";
    document.getElementById("aqlStyle").value = (sel.detail && sel.detail.styleName) || "";
  });
  document.getElementById("aqlColor").addEventListener("change", () => {
    document.getElementById("aqlColorCustom").style.display = document.getElementById("aqlColor").value === "__custom__" ? "" : "none";
  });
  addAqlFindingRow();
  loadAqlProcessEntries();
}

async function saveAqlProcessStage() {
  if (typeof tcBlockIfGuest === 'function' && tcBlockIfGuest('Saving an entry')) return;
  const msg = document.getElementById("aqlMsg");
  const sel = aqlSelCtrl ? aqlSelCtrl.getSel() : { ir: "", detail: null };
  if (!sel.ir) {
    msg.textContent = "Select SBU, Buyer, and IR first (or switch on Manual Entry above).";
    msg.className = "form-msg err show";
    return;
  }
  const d = sel.detail || {};
  const mode = document.querySelector('input[name="aqlMode"]:checked').value;
  const colorSel = document.getElementById("aqlColor");
  const colorCustom = document.getElementById("aqlColorCustom");
  const color = colorSel.value === "__custom__" ? colorCustom.value.trim() : colorSel.value;
  const checkPoints = AQL_CHECKPOINTS.map((cp, i) => ({
    point: cp,
    yn: document.getElementById(`aqlCp${i}Yn`).value,
    result: document.getElementById(`aqlCp${i}Result`).value,
    comments: document.getElementById(`aqlCp${i}Comments`).value
  }));
  const noDefect = document.getElementById("aqlNoDefect").checked;
  const findings = noDefect ? [] : getAqlFindingRows();
  const entry = {
    process: currentAqlStage,
    processLabel: document.getElementById("aqlProcess").value,
    mode: mode,
    checkContext: mode === "RMG" ? document.getElementById("aqlCheckContext").value : "",
    date: document.getElementById("aqlDate").value,
    inspectedBy: document.getElementById("aqlInspectedBy").value,
    line: document.getElementById("aqlLine").value,
    sbu: sel.sbu, buyer: sel.buyer, ir: sel.ir,
    styleNo: d.styleName || "", size: document.getElementById("aqlSize").value,
    color: color, compareWith: document.getElementById("aqlCompareWith").value,
    checkPoints: checkPoints,
    lotQty: document.getElementById("aqlLotQty").value,
    sampleSize: mode === "RMG" ? document.getElementById("aqlSampleSize").value : "",
    allowedCritical: document.getElementById("aqlAllowedCritical").value,
    allowedMajor: document.getElementById("aqlAllowedMajor").value,
    allowedMinor: document.getElementById("aqlAllowedMinor").value,
    foundCritical: document.getElementById("aqlFoundCritical").value,
    foundMajor: document.getElementById("aqlFoundMajor").value,
    foundMinor: document.getElementById("aqlFoundMinor").value,
    noDefectFound: noDefect,
    findings: findings,
    comments: document.getElementById("aqlComments").value,
    result: document.getElementById("aqlResult").value,
  };
  try {
    const res = await qaApi({ action: "saveAqlProcess", entry: entry });
    if (!res.ok) throw new Error(res.error || "Save failed");
    msg.textContent = "Entry saved.";
    msg.className = "form-msg ok show";
    loadAqlProcessEntries();
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "form-msg err show";
  }
}

async function loadAqlProcessEntries() {
  const tbody = document.querySelector("#aqlTable tbody");
  if (!tbody) return;
  try {
    const res = await qaApi({ action: "listAqlProcess", process: currentAqlStage });
    if (!res.ok) throw new Error(res.error || "Failed to load");
    if (!res.entries.length) { tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--ink-soft)">No entries yet.</td></tr>`; return; }
    tbody.innerHTML = res.entries.slice().reverse().map(e =>
      `<tr><td>${esc(e.date)}</td><td>${esc(e.mode)}</td><td>${esc(e.sbu)}</td><td>${esc(e.buyer)}</td><td>${esc(e.ir)}</td><td>${esc(e.styleNo)}</td><td>${esc(e.color)}</td><td>${esc(e.result)}</td></tr>`
    ).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--reject)">${esc(err.message)}</td></tr>`;
  }
}

async function saveTesting() {
  if (typeof tcBlockIfGuest === 'function' && tcBlockIfGuest('Saving a testing entry')) return;
  const msg = document.getElementById("tsMsg");
  const entry = {
    testType: activeTestingSubtab,
    sbu: document.getElementById("tsSbu").value,
    buyer: document.getElementById("tsBuyer").value,
    styleNo: document.getElementById("tsStyle").value,
    ir: document.getElementById("tsIr").value,
    season: document.getElementById("tsSeason").value,
    color: document.getElementById("tsColor").value,
    itemDescription: document.getElementById("tsItemDesc").value,
    embellishmentType: document.getElementById("tsEmb").value,
    additionalTrims: document.getElementById("tsTrims").value,
    logInDate: document.getElementById("tsLogIn").value,
    testedParty: document.getElementById("tsParty").value,
    trfNo: document.getElementById("tsTrf").value,
    result: document.getElementById("tsResult").value,
    logOutDate: document.getElementById("tsLogOut").value,
    remarks: document.getElementById("tsRemarks").value,
  };
  if (!entry.styleNo) { msg.textContent = "Style is required."; msg.className = "form-msg err show"; return; }
  try {
    const res = await qaApi({ action: "saveTesting", entry: entry });
    if (!res.ok) throw new Error(res.error || "Save failed");
    msg.textContent = "Entry saved.";
    msg.className = "form-msg ok show";
    loadTestingEntries();
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "form-msg err show";
  }
}

    if (!res.entries.length) { tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--ink-soft)">No entries yet for this test type.</td></tr>`; return; }

  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--reject)">${esc(err.message)}</td></tr>`;

}

let stageSelCtrl = null;

function renderStage(stage, prefill) {
  const el = document.getElementById("tabContent");
  el.innerHTML = `
    <div class="qa-head">
      <div class="eyebrow">Quality Process</div>
      <h1>${esc(stage.label)}</h1>
    </div>
    ${styleSelectorHTML("stg")}
    <div class="panel" style="margin-bottom:24px">
      <h3>New Entry</h3>
      <div class="form-grid">
        <div class="field"><label>Inspector</label><input id="stInspector"></div>
        <div class="field"><label>Status</label>
          <select id="stStatus"><option>Open</option><option>In Progress</option><option>Done</option></select>
        </div>
        <div class="field"><label>Score (optional, %)</label><input id="stScore" type="number" min="0" max="100"></div>
      </div>
      <div class="field"><label>Findings / Notes</label><textarea id="stNotes" rows="3"></textarea></div>

    </div>
    <div class="panel">
      <h3>Recent Entries — ${esc(stage.label)}</h3>

        <tbody><tr><td colspan="7" style="text-align:center;color:var(--ink-soft)">Loading…</td></tr></tbody>
      </table>
    </div>
  `;

  if (prefill && prefill.sbu) stageSelCtrl.setSel(prefill);

}

async function saveStageEntry(stageId) {
  if (typeof tcBlockIfGuest === 'function' && tcBlockIfGuest('Saving an entry')) return;
  const msg = document.getElementById("stageMsg");
  const sel = stageSelCtrl ? stageSelCtrl.getSel() : { ir: "", detail: null };
  if (!sel.ir) {
    msg.textContent = "Select SBU, Buyer, and IR first.";
    msg.className = "form-msg err show";
    return;
  }
  const entry = {
    stage: stageId,
    orderNo: "",
    styleNo: sel.detail ? sel.detail.styleName : "",
    irNo: sel.ir,
    inspector: document.getElementById("stInspector").value,
    status: document.getElementById("stStatus").value,
    score: document.getElementById("stScore").value,
    notes: document.getElementById("stNotes").value,
  };
  try {
    const res = await qaApi({ action: "saveEntry", entry: entry });
    if (!res.ok) throw new Error(res.error || "Save failed");
    msg.textContent = "Entry saved.";
    msg.className = "form-msg ok show";
    loadStageEntries(stageId);
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "form-msg err show";
  }
}

async function loadStageEntries(stageId) {
  const tbody = document.querySelector("#stageEntriesTable tbody");
  try {
    const res = await qaApi({ action: "listEntries", stage: stageId });
    if (!res.ok) throw new Error(res.error || "Failed to load");
    if (!res.entries.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--ink-soft)">No entries yet for this stage.</td></tr>`;
      return;
    }
    tbody.innerHTML = res.entries.map(e => `
      <tr>
        <td>${esc(e.timestamp)}</td><td>${esc(e.styleNo)}</td><td>${esc(e.irNo)}</td><td>${esc(e.inspector)}</td>
        <td><span class="status-pill ${esc((e.status||"Open").replace(" ","-"))}">${esc(e.status)}</span></td>
        <td>${esc(e.score)}</td><td>${esc(e.notes)}</td>
      </tr>
    `).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--reject)">${esc(err.message)}</td></tr>`;
  }
}
