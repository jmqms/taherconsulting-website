async function saveAqlProcessStage() {
  if (typeof tcBlockIfGuest === 'function' && tcBlockIfGuest('Saving an entry')) return;
  const msg = document.getElementById("aqlMsg");
  const sel = aqlSelCtrl ? aqlSelCtrl.getSel() : { ir: "", detail: null };
  if (!sel.ir) {
    msg.textContent = "Select SBU, Buyer, and IR first (or switch on Manual Entry above).";
    msg.className = "form-msg err show";
    return;
  }
  const d = sel.detail || {};
  const mode = document.querySelector('input[name="aqlMode"]:checked').value;
  if (mode === "RMG" && !aqlComputedResult) {
    msg.textContent = "Enter Found Defect counts, or tick 'No Defect Found', so the AQL result isn't left ambiguous.";
    msg.className = "form-msg err show";
    return;
  }
  const colorSel = document.getElementById("aqlColor");
  const colorCustom = document.getElementById("aqlColorCustom");
  const color = colorSel.value === "__custom__" ? colorCustom.value.trim() : colorSel.value;
  const checkPoints = AQL_CHECKPOINTS.map((cp, i) => ({
    point: cp,
    yn: document.getElementById(`aqlCp${i}Yn`).value,
    result: document.getElementById(`aqlCp${i}Result`).value,
    comments: document.getElementById(`aqlCp${i}Comments`).value
  }));
  const noDefect = document.getElementById("aqlNoDefect").checked;
  const findings = noDefect ? [] : getAqlFindingRows();
  const entry = {
    process: currentAqlStage,
    processLabel: document.getElementById("aqlProcess").value,
    mode: mode,
    checkContext: mode === "RMG" ? document.getElementById("aqlCheckContext").value : "",
    date: document.getElementById("aqlDate").value,
    inspectedBy: document.getElementById("aqlInspectedBy").value,
    line: document.getElementById("aqlLine").value,
    sbu: sel.sbu, buyer: sel.buyer, ir: sel.ir,
    styleNo: d.styleName || "", size: document.getElementById("aqlSize").value,
    color: color, compareWith: document.getElementById("aqlCompareWith").value,
    checkPoints: checkPoints,
    inspectionLevel: mode === "RMG" ? document.getElementById("aqlInspectionLevel").value : "",
    codeLetter: mode === "RMG" ? document.getElementById("aqlAutoCodeLetter").value : "",
    aqlCritical: mode === "RMG" ? document.getElementById("aqlAqlCritical").value : "",
    aqlMajor: mode === "RMG" ? document.getElementById("aqlAqlMajor").value : "",
    aqlMinor: mode === "RMG" ? document.getElementById("aqlAqlMinor").value : "",
    lotQty: document.getElementById("aqlLotQty").value,
    sampleSize: mode === "RMG" ? document.getElementById("aqlSampleSize").value : "",
    allowedCritical: document.getElementById("aqlAllowedCritical").value,
    allowedMajor: document.getElementById("aqlAllowedMajor").value,
    allowedMinor: document.getElementById("aqlAllowedMinor").value,
    foundCritical: document.getElementById("aqlFoundCritical").value,
    foundMajor: document.getElementById("aqlFoundMajor").value,
    foundMinor: document.getElementById("aqlFoundMinor").value,
    noDefectFound: noDefect,
    findings: findings,
    comments: document.getElementById("aqlComments").value,
    result: mode === "RMG" ? ({ PASS: "Pass", FAIL: "Fail" }[aqlComputedResult] || "") : document.getElementById("aqlResult").value,
  };
  await runSave(msg, () => qaApi({ action: "saveAqlProcess", entry: entry }), () => renderAqlProcessStage(currentAqlStage, (ALL_STAGES.find(x => x.id === currentAqlStage) || {}).label || ""), "Entry saved. Form cleared for the next entry.");
}

async function loadAqlProcessEntries() {
  const tbody = document.querySelector("#aqlTable tbody");
  if (!tbody) return;
  try {
    const res = await qaApi({ action: "listAqlProcess", process: currentAqlStage });
    if (!res.ok) throw new Error(res.error || "Failed to load");
    if (!res.entries.length) { tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--ink-soft)">No entries yet.</td></tr>`; return; }
    tbody.innerHTML = res.entries.slice().reverse().map(e =>
      `<tr><td>${esc(e.date)}</td><td>${esc(e.mode)}</td><td>${esc(e.sbu)}</td><td>${esc(e.buyer)}</td><td>${esc(e.ir)}</td><td>${esc(e.styleNo)}</td><td>${esc(e.color)}</td><td>${esc(e.result)}</td></tr>`
    ).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--reject)">${esc(err.message)}</td></tr>`;
  }
}

const TS_SECTIONS = ["RMG", "Printing Section", "Embroidery Section", "Washing Plant", "Raw Materials Part"];
const TS_TEST_ON = ["Printed Panel", "Embroidery Panel", "Heat-Seal Panel", "Complete Garments Home Laundry"];
const TS_OPTIONS = ["Solid", "with Print (AOP)", "with Print", "with Embroidery", "with Print & Embroidery", "with Heat-Seal", "with Wash", "with Wash and Print", "with Wash and Embroidery", "Wash with Print & Embroidery", "Heat-Seal with Print", "Heat-Seal with Embroidery", "Heat-Seal with Print & Embroidery", "Heat-Seal with Wash & Print", "Others"];
const TS_PE = ["Printing Section", "Embroidery Section"];
function tsIsPE() { return TS_PE.indexOf(tsSection) >= 0; }
function tsOptionChange() { const o = document.getElementById("tsOption"), x = document.getElementById("tsOptionOther"); if (o && x) x.style.display = o.value === "Others" ? "" : "none"; }
function tsOptionHTML() { return `<div class="field"><label>Options</label><select id="tsOption" onchange="tsOptionChange()">${TS_OPTIONS.map(o => `<option>${esc(o)}</option>`).join("")}</select><input id="tsOptionOther" placeholder="Specify other option" style="display:none;margin-top:6px"></div>`; }
const TS_REQUIREMENTS = ["Dimensional Stability to Washing", "Spirality / Skewness", "Appearance After Wash", "Colorfastness to Washing", "Colorfastness to Water", "Colorfastness to Perspiration", "Colorfastness to Rubbing/Crocking", "Colorfastness to Chlorine Bleach", "Colorfastness to Non-Chlorine Bleach", "Colorfastness to Saliva", "Phenolic Yellowing", "C/F to Actual Laundering", "Fabric Weight", "Thread Count", "ICI Pilling (10800/14400 cy)", "Random Tumble Pilling", "Bursting Strength", "PH Test", "Fabric Width", "Stretch Properties"];
const TS_SUBMISSIONS = Array.from({ length: 10 }, (_, i) => { const n = i + 1, t = n % 100; const suf = (t >= 11 && t <= 13) ? "th" : ({1:"st",2:"nd",3:"rd"}[n % 10] || "th"); return n + suf + " Submission"; });
const TS_SLA_DAYS = 2; // report expected within 1-2 days (calendar days, Fridays included)
function tsDays(a, b) { return (a && b) ? Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000) : null; }
// Open: days since Login Date until today (Bangladesh date). Closed: Login Date -> Report Date (turnaround).
function tsAge(r) {
  const login = String(r.logInDate || "").slice(0, 10); if (!login) return null;
  const end = r.status === "Closed" ? String(r.reportDate || "").slice(0, 10) : ovYmd(new Date());
  const d = tsDays(login, end); return d === null ? null : Math.max(0, d);
}
function tsAgeHTML(r) {
  const d = tsAge(r); if (d === null) return "—";
  const unit = d === 1 ? " day" : " days", over = d - TS_SLA_DAYS;
  if (r.status === "Closed") return `<b>${d}${unit}</b> <span class="status-pill ${over > 0 ? "Open" : "Done"}">${over > 0 ? "Late +" + over : "In SLA"}</span>`;
  return `<b>${d}${unit}</b> <span class="status-pill ${over > 0 ? "Open" : d === TS_SLA_DAYS ? "In-Progress" : "Done"}">${over > 0 ? "Overdue +" + over : d === TS_SLA_DAYS ? "Due today" : "On time"}</span>`;
}
let activeTestingSubtab = "new";
let tsSelCtrl = null, tsList = [], tsSection = TS_SECTIONS[0];

function renderTesting() {
  const el = document.getElementById("tabContent");
  el.innerHTML = `
    <div class="qa-head">
      <div class="eyebrow">Quality Process</div>

      <button class="btn ${activeTestingSubtab === "track" ? "btn-primary" : "btn-ghost"}" style="font-size:11.5px;padding:8px 14px" onclick="switchTestingSubtab('track')">Testing Tracking</button>
      <button class="btn ${activeTestingSubtab === "log" ? "btn-primary" : "btn-ghost"}" style="font-size:11.5px;padding:8px 14px" onclick="switchTestingSubtab('log')">Report Log</button>
    </div>
    <div id="testingSubtabContent"></div>`;
  if (activeTestingSubtab === "new") renderTestingNew(); else if (activeTestingSubtab === "log") renderReportLog(); else renderTestingTracking();
}
function switchTestingSubtab(t) { activeTestingSubtab = t; renderTesting(); }

function refreshTsColor(detail) {
  colorDetail.ts = detail || null;
  const sel = document.getElementById("tsColor"), custom = document.getElementById("tsColorCustom");
  if (!sel) return;
  const was = sel.value === "__custom__";
  sel.innerHTML = colorOptionsHTML(colorDetail.ts, sel.value);
  if (custom) custom.style.display = was ? "" : "none";
  tsUpdateSubmission();
}
// ---- Auto Submission number (Printing / Embroidery): count earlier requests of the same section + IR + colour ----
let tsSubCache = [];
function tsLoadSubCache() {
  qaApi({ action: "listTestRequests" }).then(res => { if (res && res.ok) { tsSubCache = res.entries || []; tsUpdateSubmission(); } }).catch(() => {});
}
function tsCurColor_() {
  const cs = document.getElementById("tsColor"); if (!cs) return "";
  return (cs.value === "__custom__" ? (document.getElementById("tsColorCustom") || {}).value : cs.value) || "";
}
function tsPrevSubs_(ir, color) {
  const nz = v => String(v == null ? "" : v).trim().toLowerCase();
  return tsSubCache.filter(r => nz(r.section) === nz(tsSection) && nz(r.ir) === nz(ir) && nz(r.color) === nz(color));
}
function tsUpdateSubmission() {
  const sel = document.getElementById("tsSubmission"), hint = document.getElementById("tsSubHint");
  if (!sel || !hint || !tsIsPE()) return;
  const ir = tsSelCtrl ? tsSelCtrl.getSel().ir : "", color = tsCurColor_();
  if (!ir || !color || color === "__custom__") { hint.style.color = "var(--ink-soft)"; hint.textContent = "Select IR and Color — Submission is set automatically."; return; }
  const prev = tsPrevSubs_(ir, color);
  const n = Math.min(prev.length + 1, TS_SUBMISSIONS.length);
  sel.value = TS_SUBMISSIONS[n - 1];
  if (prev.length) {
    hint.style.color = "#b45309";
    hint.textContent = "⚠ This IR + Color was already submitted " + prev.length + " time(s): " + prev.map(r => (r.submission || "?") + " (" + (r.logInDate || "-") + ")").join(", ") + " → this one is " + TS_SUBMISSIONS[n - 1] + ".";
  } else { hint.style.color = "#15803d"; hint.textContent = "✓ First submission for this IR + Color."; }
}
function tsPickSection(name) {
  tsSection = name;
  renderTestingNew(); // Printing / Embroidery use a different form
}

// Printing / Embroidery: no SBU — just Buyer + IR (SBU is looked up from the IR)
function tsPeSelectorHTML() {
  return `<div class="panel" style="margin-bottom:24px">
      <h3>Select Style</h3>
      <div class="form-grid">
        <div class="field"><label>Buyer</label><select id="tsPeBuyer"><option value="">Loading…</option></select></div>
        <div class="field"><label>IR No</label><select id="tsPeIr"><option value="">Select Buyer first</option></select></div>
      </div>
      <div id="tsPeDetails" style="color:var(--ink-soft);margin-top:8px">Select Buyer → IR to see style details.</div>
    </div>`;
}
function tsWirePE() {
  const bEl = document.getElementById("tsPeBuyer"), iEl = document.getElementById("tsPeIr"), dEl = document.getElementById("tsPeDetails");
  const sel = { sbu: "", buyer: "", ir: "", detail: null, manual: false };
  fetchBuyers("").then(b => { bEl.innerHTML = `<option value="">Select Buyer…</option>` + b.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join(""); });
  bEl.addEventListener("change", async () => {
    sel.buyer = bEl.value; sel.ir = ""; sel.sbu = ""; sel.detail = null; refreshTsColor(null);
    dEl.textContent = "Select IR to see style details.";
    iEl.innerHTML = `<option value="">Loading…</option>`;
    const irs = sel.buyer ? await fetchIrs("", sel.buyer) : [];
    iEl.innerHTML = `<option value="">Select IR…</option>` + irs.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("");
  });
  iEl.addEventListener("change", async () => {
    sel.ir = iEl.value; sel.detail = null; refreshTsColor(null);
    if (!sel.ir) { dEl.textContent = "Select IR to see style details."; return; }
    dEl.textContent = "Loading…";
    const map = await ovLoadIrMap();
    sel.sbu = (map[sel.ir] || {}).sbu || "";
    sel.detail = await fetchOrderDetail(sel.sbu, sel.buyer, sel.ir);
    dEl.innerHTML = styleDetailsHTML(sel.detail);
    refreshTsColor(sel.detail);
  });
  return { getSel: () => sel };
}

          <tr><td>Other Tests <input id="tsOther" placeholder="Please specify" style="margin-left:10px;width:60%"></td><td><input type="checkbox" id="tsOtherChk" style="width:auto"></td></tr>

let tsSubmitting = false;
async function saveTestRequest() {
  if (tsSubmitting) return;
  if (typeof tcBlockIfGuest === 'function' && tcBlockIfGuest('Submitting a test request')) return;
  const msg = document.getElementById("tsMsg");
  const sel = tsSelCtrl ? tsSelCtrl.getSel() : { ir: "", detail: null };
  const fail = (t) => { msg.textContent = t; msg.className = "form-msg err show"; };
  if (!sel.ir) return fail(tsIsPE() ? "Select Buyer and IR first." : "Select SBU, Buyer and IR first (or use Manual Entry).");
  if (document.getElementById("tsCycle").value === "") return fail("Enter the Test Cycle (number of washes).");
  const reqs = Array.from(document.querySelectorAll(".ts-req:checked")).map(c => c.value);
  const other = document.getElementById("tsOther").value.trim();
  if (document.getElementById("tsOtherChk").checked || other) reqs.push("Other: " + (other || "—"));
  if (!reqs.length) return fail("Tick at least one Test Requirement.");
  const d = sel.detail || {};
  const cs = document.getElementById("tsColor");
  const color = cs.value === "__custom__" ? document.getElementById("tsColorCustom").value.trim() : cs.value;
  const entry = {
    section: tsSection, sbu: sel.sbu, buyer: sel.buyer, ir: sel.ir,
    styleNo: d.styleName || "", season: d.season || "", item: d.item || "",
    logInDate: document.getElementById("tsLogIn").value || ovYmd(new Date()),
    color: color,
    line: tsIsPE() ? "" : document.getElementById("tsLine").value, size: tsIsPE() ? "" : document.getElementById("tsSize").value,
    printType: tsIsPE() ? document.getElementById("tsPrintType").value : "", gsm: tsIsPE() ? document.getElementById("tsGsm").value : "",
    submission: tsIsPE() ? document.getElementById("tsSubmission").value : "",
    testCycle: document.getElementById("tsCycle").value,
    fiber: document.getElementById("tsFiber").value, fabricType: document.getElementById("tsFabric").value,
    testOn: document.getElementById("tsTestOn").value,
    testOption: document.getElementById("tsOption").value === "Others" ? "Others: " + (document.getElementById("tsOptionOther").value.trim() || "—") : document.getElementById("tsOption").value,
    requirements: reqs, submittedBy: document.getElementById("tsBy").value
  };
  if (tsIsPE() && entry.submission) {
    const dup = tsPrevSubs_(entry.ir, entry.color).filter(r => r.submission === entry.submission);
    if (dup.length && !confirm("'" + entry.submission + "' already exists for this IR + Color (" + entry.section + ").\n\nSubmit again anyway?")) return;
  }
  tsSubmitting = true;
  const btn = document.getElementById("tsSubmitBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Submitting…"; }
  try {
    const res = await qaApi({ action: "saveTestRequest", entry: entry });
    if (!res.ok) throw new Error(res.error || "Save failed");
    // clear the whole form so the same data cannot be submitted twice
    renderTestingNew();
    const m2 = document.getElementById("tsMsg");
    m2.textContent = "Submitted (" + entry.ir + " · " + entry.section + "). The form is cleared; the request is Open in Testing Tracking.";
    m2.className = "form-msg ok show";
  } catch (err) {
    fail(err.message);
    if (btn) { btn.disabled = false; btn.textContent = "Submit →"; }
  } finally { tsSubmitting = false; }
}

  box.innerHTML = `

        <div class="field" style="margin:0"><label>SBU</label>

    </div>
    <div class="stat-grid" id="ttStats"></div>
    <div class="panel" style="margin-bottom:20px"><h3>Section-wise aging <span style="font-weight:400;font-size:12px;color:var(--ink-soft)">— SLA ${TS_SLA_DAYS} days from Login Date</span></h3><div style="overflow-x:auto" id="ttSecSummary"></div></div>
    <div id="ttClosePanel"></div>
    <div class="panel"><div style="overflow-x:auto"><table class="qa-table">

  ["ttStatus", "ttSection", "ttSbu", "ttAging", "ttFrom", "ttTo"].forEach(id => document.getElementById(id).addEventListener("change", ttDraw));

function ttDraw() {
  const st = document.getElementById("ttStatus").value, sec = document.getElementById("ttSection").value, sbuF = document.getElementById("ttSbu").value;
  const qb = document.getElementById("ttBuyer").value.trim().toLowerCase(), qi = document.getElementById("ttIr").value.trim().toLowerCase(), qs = document.getElementById("ttStyle").value.trim().toLowerCase();
  const has = (v, q) => !q || String(v || "").toLowerCase().indexOf(q) >= 0;
  const nOpen = tsList.filter(r => r.status !== "Closed").length;
  const openRows = tsList.filter(r => r.status !== "Closed"), closedRows = tsList.filter(r => r.status === "Closed");
  const nOver = openRows.filter(r => (tsAge(r) || 0) > TS_SLA_DAYS).length;
  const tats = closedRows.map(tsAge).filter(v => v !== null);
  const avgTat = tats.length ? (tats.reduce((a, b) => a + b, 0) / tats.length).toFixed(1) : "—";
  const oldest = openRows.slice().sort((a, b) => (tsAge(b) || 0) - (tsAge(a) || 0))[0];
  document.getElementById("ttStats").innerHTML = `
    <div class="stat-card"><span>Open</span><b>${nOpen}</b></div>
    <div class="stat-card"><span>Overdue (&gt;${TS_SLA_DAYS} days)</span><b style="color:${nOver ? "var(--reject)" : "inherit"}">${nOver}</b></div>
    <div class="stat-card"><span>Closed</span><b>${tsList.length - nOpen}</b></div>
    <div class="stat-card"><span>Avg turnaround</span><b>${avgTat}${tats.length ? " d" : ""}</b></div>
    <div class="stat-card"><span>Longest pending</span><b>${oldest ? (tsAge(oldest) || 0) + " d" : "—"}</b><div style="font-size:11px;color:var(--ink-soft)">${oldest ? esc(oldest.ir) : ""}</div></div>
    <div class="stat-card"><span>Pass</span><b>${tsList.filter(r => r.result === "Pass").length}</b></div>
    <div class="stat-card"><span>Fail</span><b>${tsList.filter(r => r.result === "Fail").length}</b></div>`;
  document.getElementById("ttSecSummary").innerHTML = `<table class="qa-table"><thead><tr><th>Section</th><th>Open</th><th>Overdue</th><th>Longest pending</th><th>Closed</th><th>Avg turnaround</th></tr></thead><tbody>${
    TS_SECTIONS.map(sx => {
      const o = openRows.filter(r => r.section === sx), c = closedRows.filter(r => r.section === sx).map(tsAge).filter(v => v !== null);
      const ages = o.map(r => tsAge(r) || 0), ov = ages.filter(v => v > TS_SLA_DAYS).length;
      return `<tr><td>${esc(sx)}</td><td>${o.length}</td><td style="${ov ? "color:var(--reject);font-weight:700" : ""}">${ov}</td><td>${ages.length ? Math.max.apply(null, ages) + " d" : "—"}</td><td>${c.length}</td><td>${c.length ? (c.reduce((a, b) => a + b, 0) / c.length).toFixed(1) + " d" : "—"}</td></tr>`;
    }).join("")}</tbody></table>`;
  const rows = tsList.filter(r => {
    if (st === "Open" && r.status === "Closed") return false;
    if (st === "Closed" && r.status !== "Closed") return false;
    if (sec && r.section !== sec) return false;
    if (sbuF && r.sbu !== sbuF) return false;
    if (!has(r.buyer, qb) || !has(r.ir, qi) || !has(r.styleNo, qs)) return false;
    if (document.getElementById("ttAging").value === "over" && !(r.status !== "Closed" && (tsAge(r) || 0) > TS_SLA_DAYS)) return false;
    const ld = String(r.logInDate || "").slice(0, 10), tf = document.getElementById("ttFrom").value, tt = document.getElementById("ttTo").value;
    if (tf && (!ld || ld < tf)) return false;
    if (tt && (!ld || ld > tt)) return false;
    return true;
  });
  // open requests first, oldest (most overdue) on top; then closed, newest first
  rows.sort((a, b) => ((a.status === "Closed") - (b.status === "Closed")) ||
    (a.status !== "Closed" ? (tsAge(b) || 0) - (tsAge(a) || 0) : (String(b.reportDate || "") > String(a.reportDate || "") ? 1 : -1)));
  ttRows = rows;
  document.getElementById("ttBody").innerHTML = rows.map(r => {
    const closed = r.status === "Closed";
    return `<tr>

}

// ---------- Testing Tracking: download the rows currently shown (Excel / PDF) to send for follow-up ----------
let ttRows = [];
function ttRowData_(r) {
  const age = tsAge(r), over = age !== null && age > TS_SLA_DAYS ? age - TS_SLA_DAYS : 0, closed = r.status === "Closed";
  return {
    login: String(r.logInDate || "").slice(0, 10), section: r.section || "", sbu: r.sbu || "", buyer: r.buyer || "", ir: r.ir || "", style: r.styleNo || "",
    color: r.color || "", submission: r.submission || "", testOn: r.testOn || "", option: r.testOption || "", tests: (r.requirements || []).join("; "),
    cycle: r.testCycle === undefined ? "" : r.testCycle, by: r.submittedBy || "", age: age === null ? "" : age, over: over,
    status: closed ? "Closed" : "Open", result: closed ? (r.result || "") : "", trf: r.trpNo || "", reportDate: String(r.reportDate || "").slice(0, 10)
  };
}
function ttFilterLabel_() {
  const g = id => { const e = document.getElementById(id); return e ? e.value : ""; };
  const parts = ["Status: " + (g("ttStatus") || "All")];
  [["ttSection", "Section"], ["ttSbu", "SBU"], ["ttBuyer", "Buyer"], ["ttIr", "IR"], ["ttStyle", "Style"], ["ttFrom", "From"], ["ttTo", "To"]].forEach(([id, l]) => { if (g(id)) parts.push(l + ": " + g(id)); });
  if (g("ttAging") === "over") parts.push("Overdue only");
  return parts.join("  |  ");
}
function ttDownloadCsv() {
  if (!ttRows.length) return alert("No rows to download.");
  const head = ["Login Date", "Section", "SBU", "Buyer", "IR", "Style", "Color", "Submission", "Test on", "Options", "Test Requirements", "Test Cycle", "Submitted by", "Aging (days)", "Overdue by (days)", "Status", "Result", "TRF No", "Report Date"];
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const lines = [head.map(q).join(",")].concat(ttRows.map(r => { const d = ttRowData_(r); return [d.login, d.section, d.sbu, d.buyer, d.ir, d.style, d.color, d.submission, d.testOn, d.option, d.tests, d.cycle, d.by, d.age, d.over, d.status, d.result, d.trf, d.reportDate].map(q).join(","); }));
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "Testing_Tracking_" + ovYmd(new Date()) + ".csv"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function ttDownloadPdf() {
  if (!ttRows.length) return alert("No rows to download.");
  const { jsPDF } = window.jspdf, doc = new jsPDF({ unit: "mm", format: "a4", orientation: "landscape", compress: true });
  const T = s => String(s == null ? "" : s).replace(/[\u2013\u2014]/g, "-").replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[^\x00-\xFF]/g, "?");
  const nOver = ttRows.filter(r => r.status !== "Closed" && (tsAge(r) || 0) > TS_SLA_DAYS).length;
  doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.text("Testing Tracking - Pending Test Report", 10, 12);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
  doc.text(T("J.M. Fabrics Limited  |  Date: " + ovYmd(new Date()) + "  |  " + ttRows.length + " request(s), " + nOver + " overdue (SLA " + TS_SLA_DAYS + " days)"), 10, 17.5);
  doc.setFontSize(7.5); doc.setTextColor(100); doc.text(T(ttFilterLabel_()), 10, 22); doc.setTextColor(0);
  const body = ttRows.map((r, i) => { const d = ttRowData_(r);
    return [i + 1, d.login, T(d.section), T(d.sbu), T(d.buyer), T(d.ir), T(d.style), T(d.color + (d.submission ? "\n" + d.submission : "")), T(d.testOn + (d.option ? "\n" + d.option : "")), T((r.requirements || []).length), T(d.by),
      d.age === "" ? "-" : d.age + " d" + (d.over ? "\nOverdue +" + d.over : ""), d.status === "Closed" ? "Closed\n" + T(d.result) : "Open"]; });
  doc.autoTable({ startY: 25, margin: { left: 8, right: 8, bottom: 12 }, theme: "grid", head: [["#", "Login", "Section", "SBU", "Buyer", "IR", "Style", "Color", "Test on", "Tests", "Submitted by", "Aging", "Status"]], body: body,
    styles: { fontSize: 7.2, cellPadding: 1.1, overflow: "linebreak", valign: "middle" }, headStyles: { fillColor: [47, 63, 76], textColor: 255 },
    columnStyles: { 0: { cellWidth: 7 }, 1: { cellWidth: 17 }, 3: { cellWidth: 13 }, 5: { cellWidth: 17 }, 9: { cellWidth: 11, halign: "center" }, 11: { cellWidth: 18 }, 12: { cellWidth: 17 } },
    didParseCell: d => { if (d.section === "body") {
      if (d.column.index === 11 && /Overdue/.test(String(d.cell.raw))) { d.cell.styles.textColor = [176, 0, 0]; d.cell.styles.fontStyle = "bold"; }
      if (d.column.index === 12) { const v = String(d.cell.raw); if (/Fail/.test(v)) d.cell.styles.textColor = [176, 0, 0]; else if (/Pass/.test(v)) d.cell.styles.textColor = [23, 97, 42]; else if (v === "Open") d.cell.styles.textColor = [180, 83, 9]; } } } });
  const n = doc.getNumberOfPages();
  for (let p = 1; p <= n; p++) { doc.setPage(p); doc.setFontSize(7); doc.setTextColor(110); doc.text("Page " + p + " of " + n, 289, 204, { align: "right" }); }
  doc.save("Testing_Tracking_" + ovYmd(new Date()) + ".pdf");
}

function rlDraw() {

    (!st || (st === "Closed") === (r.status === "Closed")) &&
    (!sbu || r.sbu === sbu) && (!buyer || r.buyer === buyer) &&
    (!ir || String(r.ir || "").toLowerCase().indexOf(ir) >= 0));

async function ttSubmitClose(id) {
  if (typeof tcBlockIfGuest === 'function' && tcBlockIfGuest('Closing a test')) return;
  const msg = document.getElementById("tcMsg");
  const date = document.getElementById("tcDate").value, trp = document.getElementById("tcTrp").value.trim();
  if (!date || !trp) { msg.textContent = "Report date and TRF No are required."; msg.className = "form-msg err show"; return; }
  try {
    const res = await qaApi({ action: "closeTestRequest", id: id, reportDate: date, trpNo: trp,
      result: document.getElementById("tcResult").value, comments: document.getElementById("tcComments").value });
    if (!res.ok) throw new Error(res.error || "Failed");
    document.getElementById("ttClosePanel").innerHTML = "";
    renderTestingTracking();
  } catch (err) { msg.textContent = err.message; msg.className = "form-msg err show"; }

async function saveStageEntry(stageId) {
  if (typeof tcBlockIfGuest === 'function' && tcBlockIfGuest('Saving an entry')) return;
  const msg = document.getElementById("stageMsg");
  const sel = stageSelCtrl ? stageSelCtrl.getSel() : { ir: "", detail: null };
  if (!sel.ir) {
    msg.textContent = "Select SBU, Buyer, and IR first.";
    msg.className = "form-msg err show";
    return;
  }
  const entry = {
    stage: stageId,
    orderNo: "",
    styleNo: sel.detail ? sel.detail.styleName : "",

    inspector: document.getElementById("stInspector").value,
    status: document.getElementById("stStatus").value,
    score: document.getElementById("stScore").value,
    notes: document.getElementById("stNotes").value,
  };
  await runSave(msg, () => qaApi({ action: "saveEntry", entry: entry }), () => renderStage(ALL_STAGES.find(x => x.id === stageId)), "Entry saved. Form cleared for the next entry.");
}

async function loadStageEntries(stageId) {
  const tbody = document.querySelector("#stageEntriesTable tbody");
  try {
    const res = await qaApi({ action: "listEntries", stage: stageId });
    if (!res.ok) throw new Error(res.error || "Failed to load");
    if (!res.entries.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--ink-soft)">No entries yet for this stage.</td></tr>`;
      return;
    }
    tbody.innerHTML = res.entries.map(e => `
      <tr>
        <td>${esc(e.timestamp)}</td><td>${esc(e.styleNo)}</td><td>${esc(e.irNo)}</td><td>${esc(e.inspector)}</td>
        <td><span class="status-pill ${esc((e.status||"Open").replace(" ","-"))}">${esc(e.status)}</span></td>
        <td>${esc(e.score)}</td><td>${esc(e.notes)}</td>
      </tr>
    `).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--reject)">${esc(err.message)}</td></tr>`;
  }
}

  tcInitModuleAuth({
    moduleKey: "qa",
    sheetName: "QAUsers",
    displayLabel: "QA Process",
    theme: { icon: "📋", accent: "#2F6E52", iconBg: "#E5F0E9", bg: "#0F1F18" }
  });
  if (window.TCEG) TCEG.setAdmin(adminEditEntry_, adminDeleteEntry_);
  if (window.TCEG) TCEG.init("qaprocess", null, r => { const t = String(r.report || r.label || ""); if (/^Testing/.test(t) && /\[[^\]]+\]/.test(t)) { ttFixOpen(r); return true; } if (String(r.reportId || "").split("|")[3] && String(r.reportId).split("|")[3].indexOf("~") > 0) { stageFixOpen(r); return true; } return false; });

// ---------- Correct a Testing entry after an administrator approved the Edit Request ----------
const TT_FIX_FIELDS = [["sbu","SBU"],["buyer","Buyer"],["ir","IR No"],["styleNo","Style"],["season","Season"],["item","Item"],["color","Color"],["logInDate","Login Date","date"],
  ["line","Line"],["size","Size"],["fiber","Fiber / Composition"],["fabricType","Fabric Type"],["testOn","Test on"],["testOption","Options"],["testCycle","Test Cycle"],
  ["printType","Print / Embroidery Type"],["gsm","GSM"],["submission","Submission"],["reportDate","Report / Log Out Date","date"],["trpNo","TRF / TRP No"],["result","Result"],["comments","Comments"]];
async function ttFixOpen(req) {
  const m = /\[([^\]]+)\]/.exec(String(req.report || req.label || ""));
  if (!m) return false;
  if (!tsList || !tsList.length) { try { const res = await qaApi({ action: "listTestRequests" }); tsList = (res && res.entries) || []; } catch (e) {} }
  const r = (tsList || []).find(x => String(x.id) === m[1]);
  if (!r) { alert("Could not find this Testing entry (" + m[1] + "). Please refresh the page and try again."); return true; }
  let box = document.getElementById("ttFixModal");
  if (!box) { box = document.createElement("div"); box.id = "ttFixModal"; box.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9997;display:flex;align-items:center;justify-content:center;padding:14px"; document.body.appendChild(box); }
  box.style.display = "flex";
  box.innerHTML = `<div style="background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:20px;border-top:5px solid #1E6B4A">
    <h3 style="margin:0 0 4px">&#9998; Correct entry — ${esc(r.ir)} · ${esc(r.section)}</h3>
    <div style="font-size:12.5px;color:#667;margin-bottom:6px">Edit approved by the administrator (one time).</div>
    ${req.reason ? `<div style="background:#f4f3ee;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:10px"><b>Your request:</b> ${esc(req.reason)}</div>` : ""}
    <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">${TT_FIX_FIELDS.map(([k, l, t]) =>
      `<div class="field"><label>${esc(l)}</label><input data-fix="${k}" type="${t || "text"}" value="${esc(t === "date" ? String(r[k] || "").slice(0, 10) : (r[k] == null ? "" : r[k]))}"></div>`).join("")}</div>
    <div id="ttFixMsg" style="margin-top:8px;font-size:12.5px"></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary" id="ttFixSave">Save correction</button><button class="btn btn-ghost" id="ttFixCancel">Cancel</button></div></div>`;
  box.querySelector("#ttFixCancel").onclick = () => { box.style.display = "none"; };
  box.querySelector("#ttFixSave").onclick = async () => {
    const msg = box.querySelector("#ttFixMsg"), fields = {};
    box.querySelectorAll("[data-fix]").forEach(i => { if (String(r[i.dataset.fix] == null ? "" : r[i.dataset.fix]).slice(0, i.type === "date" ? 10 : 9999) !== i.value) fields[i.dataset.fix] = i.value.trim(); });
    if (!Object.keys(fields).length) { msg.style.color = "#b3261e"; msg.textContent = "Nothing was changed."; return; }
    const btn = box.querySelector("#ttFixSave"); btn.disabled = true; msg.style.color = "#667"; msg.textContent = "Saving…";
    try {
      const res = await qaApi({ action: "patchTestRequest", id: r.id, fields });
      if (!res || !res.ok) throw new Error((res && res.error) || "Save failed (is the latest qa-process-backend.gs deployed?)");
      Object.assign(r, fields);
      if (window.TCEG) await TCEG.useRequest(req);
      box.style.display = "none";
      try { rlDraw(); } catch (e) {}
      alert(window.TCEG && TCEG.isAdmin() ? "Correction saved." : "Correction saved. The entry is locked again.");
    } catch (e) { msg.style.color = "#b3261e"; msg.textContent = e.message; btn.disabled = false; }
  };
  return true;
}

// ---------- Correct any other QA Process entry (SizeSet, PP Meeting, Physical/Functional, Print/Embroidery/Wash/Heat-seal, RA, generic stages) ----------
const FIX_COMMON = (extra) => extra;
const FIX_DEFS = {
  sizeset: { sheet: "sizeset", list: { action: "listSizeSet" }, stamp: "createdAt", ir: "ir", fields: [["date","Date","Date","date"],["sbu","SBU","SBU"],["buyer","Buyer","Buyer"],["styleNo","StyleNo","Style"],["ir","IR","IR No"],["season","Season","Season"],["item","Item","Item"],["embellishmentType","EmbellishmentType","Embellishment Type"],["productType","ProductType","Product Type"],["orderType","OrderType","Order Type"],["colorCount","ColorCount","Color Count"],["plannedQty","PlannedQty","Planned Qty"],["status","Status","Status"],["correctionType","CorrectionType","Correction Type"],["remarks","Remarks","Remarks"]] },
  ppmeeting: { sheet: "ppmeeting", list: { action: "listPPMeeting" }, stamp: "createdAt", ir: "ir", fields: [["date","Date","Date","date"],["sbu","SBU","SBU"],["buyer","Buyer","Buyer"],["ir","IR","IR No"],["styleNo","StyleNo","Style"],["season","Season","Season"],["item","Item","Item"],["ppBy","PPby","PP by"],["orderType","OrderType","Order Type"],["embellishmentType","EmbellishmentType","Embellishment Type"],["productType","ProductType","Product Type"],["plannedQty","PlannedQty","Planned Qty"],["requirementsReview","RequirementsReview","Requirements Review"]] },
  physicalfunctional: { sheet: "physicalfunctional", list: { action: "listPhysicalFunctional" }, stamp: "createdAt", ir: "ir", fields: [["date","Date","Date","date"],["time","Time","Time"],["auditBy","AuditBy","Audit by"],["line","Line","Line"],["sbu","SBU","SBU"],["buyer","Buyer","Buyer"],["ir","IR","IR No"],["styleNo","StyleNo","Style"],["color","Color","Color"],["sampleChecked","SampleChecked","Sample Checked"],["passQty","PassQty","Pass Qty"],["failQty","FailQty","Fail Qty"],["defectPct","DefectPct","Defect %"],["defectType","DefectType","Defect Type"],["comments","Comments","Comments"],["correctiveAction","CorrectiveAction","Corrective Action"]] },
  aql: { sheet: "aql", stamp: "createdAt", ir: "ir", fields: [["date","Date","Date","date"],["inspectedBy","InspectedBy","Inspected by"],["line","Line","Line"],["sbu","SBU","SBU"],["buyer","Buyer","Buyer"],["ir","IR","IR No"],["styleNo","StyleNo","Style"],["size","Size","Size"],["color","Color","Color"],["compareWith","CompareWith","Compare with"],["lotQty","LotQty","Lot Qty"],["sampleSize","SampleSize","Sample Size"],["foundCritical","FoundCritical","Found Critical"],["foundMajor","FoundMajor","Found Major"],["foundMinor","FoundMinor","Found Minor"],["comments","Comments","Comments"],["result","Result","Result"]] },
  ra: { sheet: "ra", list: { action: "listQualityRA" }, stamp: "timestamp", ir: "ir", fields: [["sbu","SBU","SBU"],["buyer","Buyer","Buyer"],["ir","IR","IR No"],["styleNo","StyleNo","Style"],["raDate","RADate","RA Date","date"],["raBy","RAby","RA by"],["orderType","OrderType","Order Type"],["riskDecision","RiskDecision","Risk Decision"],["actionComments","ActionComments","Action / Comments"]] },
  entries: { sheet: "entries", stamp: "timestamp", ir: "irNo", fields: [["orderNo","OrderNo","Order No"],["styleNo","StyleNo","Style"],["irNo","IrNo","IR No"],["inspector","Inspector","Inspector"],["status","Status","Status"],["score","Score","Score"],["notes","Notes","Notes"]] }
};
function fixDefFor_(stage) {
  if (FIX_DEFS[stage]) return FIX_DEFS[stage];
  if (["print", "embroidery", "wash", "heatseal"].indexOf(stage) >= 0) return Object.assign({}, FIX_DEFS.aql, { list: { action: "listAqlProcess", process: stage }, process: stage });
  if (typeof QC_PAGES !== "undefined" && QC_PAGES[stage]) return null;   // inspection-report stages: corrected on their own inspection page
  return Object.assign({}, FIX_DEFS.entries, { list: { action: "listEntries", stage: stage } });
}
// id carried inside the Edit Request: "<stage>~<creation stamp>"
function fixId_(stage, raw) {
  const d = fixDefFor_(stage); if (!d || !raw) return "";
  const st = raw[d.stamp]; if (!st) return "";
  return String(stage) + "~" + String(st).replace(/\|/g, "/");
}
async function stageFixOpen(req) {
  const parts = String(req.reportId || "").split("|"), id = parts[3] || "", k = id.indexOf("~");
  if (k < 0) return false;
  const stage = id.slice(0, k), stamp = id.slice(k + 1), d = fixDefFor_(stage);
  if (!d) return false;
  let list = [];
  try { const res = await qaApi(d.list); list = (res && res.entries) || []; } catch (e) { alert("Could not load the entry: " + e.message); return true; }
  const r = list.find(x => String(x[d.stamp]).replace(/\|/g, "/") === stamp);
  if (!r) { alert("Could not find this entry any more. Please refresh the page and try again."); return true; }
  let box = document.getElementById("ttFixModal");
  if (!box) { box = document.createElement("div"); box.id = "ttFixModal"; box.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9997;display:flex;align-items:center;justify-content:center;padding:14px"; document.body.appendChild(box); }
  box.style.display = "flex";
  const label = (ALL_STAGES.find(x => x.id === stage) || {}).label || stage;
  const val = (f) => (f[3] === "date" ? String(r[f[0]] == null ? "" : r[f[0]]).slice(0, 10) : (r[f[0]] == null ? "" : String(r[f[0]])));
  box.innerHTML = `<div style="background:#fff;border-radius:12px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:20px;border-top:5px solid #1E6B4A">
    <h3 style="margin:0 0 4px">&#9998; Correct entry — ${esc(label)} · IR ${esc(r[d.ir])}</h3>
    <div style="font-size:12.5px;color:#667;margin-bottom:6px">Edit approved by the administrator (one time).</div>
    ${req.reason ? `<div style="background:#f4f3ee;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:10px"><b>Your request:</b> ${esc(req.reason)}</div>` : ""}
    <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">${d.fields.map(f =>
      `<div class="field"><label>${esc(f[2])}</label><input data-fix="${f[0]}" type="${f[3] || "text"}" value="${esc(val(f))}"></div>`).join("")}</div>
    <div id="ttFixMsg" style="margin-top:8px;font-size:12.5px"></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary" id="ttFixSave">Save correction</button><button class="btn btn-ghost" id="ttFixCancel">Cancel</button></div></div>`;
  box.querySelector("#ttFixCancel").onclick = () => { box.style.display = "none"; };
  box.querySelector("#ttFixSave").onclick = async () => {
    const msg = box.querySelector("#ttFixMsg"), fields = {}, local = {};
    d.fields.forEach(f => { const inp = box.querySelector('[data-fix="' + f[0] + '"]'); if (inp && inp.value.trim() !== val(f).trim()) { fields[f[1]] = inp.value.trim(); local[f[0]] = inp.value.trim(); } });
    if (!Object.keys(fields).length) { msg.style.color = "#b3261e"; msg.textContent = "Nothing was changed."; return; }
    const btn = box.querySelector("#ttFixSave"); btn.disabled = true; msg.style.color = "#667"; msg.textContent = "Saving…";
    try {
      const res = await qaApi({ action: "patchRow", sheet: d.sheet, process: d.process, stamp: stamp, ir: String(r[d.ir] == null ? "" : r[d.ir]), fields });
      if (!res || !res.ok) throw new Error((res && res.error) || "Save failed (is the latest qa-process-backend.gs deployed?)");
      if (window.TCEG) await TCEG.useRequest(req);
      box.style.display = "none";
      alert(window.TCEG && TCEG.isAdmin() ? "Correction saved. Refresh the list to see it." : "Correction saved. The entry is locked again. Refresh the list to see it.");
      try { if (typeof hubStage !== "undefined" && hubStage === stage) renderHubList(stage, window._hubMode || "log"); } catch (e) {}
    } catch (e) { msg.style.color = "#b3261e"; msg.textContent = e.message; btn.disabled = false; }
  };
  return true;
}

// ---------- Administrator: edit / delete directly from "See Details" ----------
function adminEditEntry_(ctx) {
  const t = String((ctx && ctx.area) || "");
  const m = /\[([^\]]+)\]/.exec(String((ctx && ctx.extra) || ""));
  if (/^Testing/.test(t) && m) return ttFixOpen({ report: t + " [" + m[1] + "]", reason: "" });
  if (ctx && ctx.id) return stageFixOpen({ reportId: ["", "", "", ctx.id].join("|"), reason: "" });
  alert("Direct edit is not available from this screen. Open the entry from its own Report Log.");
}
async function adminDeleteEntry_(ctx) {
  const t = String((ctx && ctx.area) || ""), m = /\[([^\]]+)\]/.exec(String((ctx && ctx.extra) || ""));
  const what = (ctx.area || "entry") + (ctx.ir ? " · IR " + ctx.ir : "");
  if (!confirm("Delete this entry?\n\n" + what + "\n\nThis cannot be undone.")) return;
  try {
    let res;
    if (/^Testing/.test(t) && m) res = await qaApi({ action: "patchTestRequest" === 0 ? "" : "deleteTestRequest", id: m[1] });
    else if (ctx.id && ctx.id.indexOf("~") > 0) {
      const k = ctx.id.indexOf("~"), stage = ctx.id.slice(0, k), stamp = ctx.id.slice(k + 1), d = fixDefFor_(stage);
      if (!d) throw new Error("This entry type cannot be deleted here.");
      const list = (await qaApi(d.list || {})).entries || [];
      const r = list.find(x => String(x[d.stamp]).replace(/\|/g, "/") === stamp);
      res = await qaApi({ action: "deleteRow", sheet: d.sheet, process: d.process, stamp: stamp, ir: r ? String(r[d.ir] == null ? "" : r[d.ir]) : undefined });
    } else { alert("Direct delete is not available from this screen. Open the entry from its own Report Log."); return; }
    if (!res || !res.ok) throw new Error((res && res.error) || "Delete failed (is the latest qa-process-backend.gs deployed?)");
    alert("Entry deleted.");
    try { if (t.indexOf("Testing") === 0) { tsList = tsList.filter(x => !m || String(x.id) !== m[1]); document.getElementById("rlDetails").innerHTML = ""; rlDraw(); } } catch (e) {}
    try { if (typeof hubStage !== "undefined" && hubStage) { document.getElementById("hbDetails").innerHTML = ""; renderHubList(hubStage, window._hubMode || "log"); } } catch (e) {}
  } catch (e) { alert("Could not delete: " + e.message); }
}
</script>
